<div class="qlnv-bang">
  <div class="qlnv-cuon-ngang">
    <table class="bang">
      <thead>
        <tr>
          <th *ngIf="hienStt" class="cot-stt">STT</th>
          <th
            *ngFor="let c of cot"
            [style.width]="c.rong || null"
            [class.can-phai]="c.canPhai"
            [class.can-giua]="c.canGiua"
            [class.sap-xep-duoc]="choPhepSapXep(c)"
            (click)="bamTieuDe(c)"
          >
            <span class="nhan-cot">{{ c.nhan }}</span>
            <i *ngIf="choPhepSapXep(c)" class="fas bieu-tuong-sx" [ngClass]="bieuTuongSapXep(c)"></i>
          </th>
        </tr>
      </thead>

      <tbody>
        <tr *ngIf="dangTai">
          <td [attr.colspan]="soCot" class="o-trong">Đang tải dữ liệu...</td>
        </tr>

        <tr *ngIf="!dangTai && duLieuHienThi.length === 0">
          <td [attr.colspan]="soCot" class="o-trong">{{ thongBaoRong }}</td>
        </tr>

        <tr
          *ngFor="let dong of duLieuHienThi; let i = index; trackBy: theoKhoa"
          [class.dong-bam-duoc]="chonDuocDong"
          (click)="bamDong(dong)"
        >
          <td *ngIf="hienStt" class="cot-stt">{{ chiSoDau + i }}</td>

          <td
            *ngFor="let c of cot"
            [class.can-phai]="c.canPhai"
            [class.can-giua]="c.canGiua"
            [ngClass]="c.lopCss || ''"
          >
            <ng-container *ngIf="templateCua(c) as tpl; else oMacDinh">
              <ng-container
                [ngTemplateOutlet]="tpl"
                [ngTemplateOutletContext]="ngucanhO(dong, c, i)"
              ></ng-container>
            </ng-container>

            <ng-template #oMacDinh>
              <span [class.qlnv-cat-dong]="c.catDong">{{ dinhDangO(dong, c) }}</span>
            </ng-template>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="thanh-phan-trang" *ngIf="!anPhanTrang && tongSoThuc > 0">
    <div class="tom-tat">
      Hiển thị <strong>{{ chiSoDau }}</strong>–<strong>{{ chiSoCuoi }}</strong>
      trên tổng <strong>{{ tongSoThuc }}</strong> bản ghi
    </div>

    <div class="dieu-huong">
      <button
        type="button"
        class="nut-trang"
        [disabled]="trang <= 1"
        (click)="diToiTrang(1)"
        title="Trang đầu"
      >
        <i class="fas fa-angle-double-left"></i>
      </button>
      <button
        type="button"
        class="nut-trang"
        [disabled]="trang <= 1"
        (click)="diToiTrang(trang - 1)"
        title="Trang trước"
      >
        <i class="fas fa-angle-left"></i>
      </button>

      <button
        type="button"
        class="nut-trang"
        *ngFor="let t of dsSoTrang"
        [class.dang-o]="t === trang"
        (click)="diToiTrang(t)"
      >
        {{ t }}
      </button>

      <button
        type="button"
        class="nut-trang"
        [disabled]="trang >= tongSoTrang"
        (click)="diToiTrang(trang + 1)"
        title="Trang sau"
      >
        <i class="fas fa-angle-right"></i>
      </button>
      <button
        type="button"
        class="nut-trang"
        [disabled]="trang >= tongSoTrang"
        (click)="diToiTrang(tongSoTrang)"
        title="Trang cuối"
      >
        <i class="fas fa-angle-double-right"></i>
      </button>
    </div>

    <div class="chon-kich-thuoc" *ngIf="dsKichThuoc.length > 0">
      <label [attr.for]="idKichThuoc">Số dòng</label>
      <select
        [id]="idKichThuoc"
        [value]="kichThuoc"
        (change)="doiKichThuoc($any($event.target).value)"
      >
        <option *ngFor="let k of dsKichThuoc" [value]="k">{{ k }}</option>
      </select>
    </div>
  </div>
</div>
