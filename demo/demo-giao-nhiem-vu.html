        b.trangthaiDvXuly = null;
        b.trangthaixulygiahan = null;
        b.ngayhoanthanhthucte = null;
        b.solangiahan = 0;
        b.mucdoht = 0;
      }
      // L2b — nhiệm vụ CÒN MỞ tại `moc`: dựng lại gia hạn / hạn xử lý / trạng thái
      if (!xongTruocMoc) {
        gh = giaHanTaiMoc(dsGiaHanGoc, b.id, moc);
        b.solangiahan = gh.soLan;                       // §9.4 S3(c)
        if (gh.hanCu) b.hanxulyth = gh.hanCu;           // hạn bị nới SAU mốc ⇒ trả về hạn cũ
        b.trangthaixulygiahan = gh.choDuyet ? 10 : null;
        b.trangthaiDvXuly = null;                       // báo cáo (nếu có) là việc sau mốc
        b.ngayhoanthanhthucte = null;
        b.mucdoht = 0;
        if (b.ngaytiepnhan && !(b.ngaytiepnhan < moc)) b.ngaytiepnhan = null;
        // Ngày từ chối nhiệm vụ không có trong DM_NHIEMVU_CHITIET (§4.2) ⇒ giữ nguyên mã 6.
        if (b.trangthai !== 6) {
          b.trangthai = gh.choDuyet ? 13                                  // §2.4 T11
            : ((b.hanxulyth && b.hanxulyth < moc) ? 7                     // §2.5 job 2|3 → 7
               : (b.ngaytiepnhan ? 2 : 3));                               // §2.4 T2 / T1
        }
      }
      giuId[b.id] = true;
      dsNv.push(b);
    }

    // Bản sao trung tính của X: có mặt để tra cứu, không cộng điểm cho ai
    var xTrungTinh = saoChepNong(X);
    xTrungTinh.trangthai = 3;                 // §2.4 T1 — trạng thái khởi tạo
    xTrungTinh.trangthaiDvXuly = null;
    xTrungTinh.trangthaixulygiahan = null;
    xTrungTinh.solangiahan = 0;
    xTrungTinh.mucdoht = 0;
    xTrungTinh.ngaytiepnhan = null;
    xTrungTinh.ngayhoanthanhthucte = null;
    xTrungTinh.ai_goiy_id = null;
    dsNv.push(xTrungTinh);

    // L3 — cắt các bảng phụ thuộc
    var pc = [], src = laMang(db.phancong);
    for (i = 0; i < src.length; i++) {
      // Bản ghi phân công tạo SAU mốc (giao lại sau thu hồi) chưa tồn tại tại thời điểm này
      if (src[i] && giuId[src[i].idnvchitiet] && String(src[i].createdate || '') < moc) {
        pc.push(src[i]);
      }
    }
    var xl = [], sx = laMang(db.xuly);
    for (i = 0; i < sx.length; i++) {
      if (sx[i] && giuId[sx[i].idCtnv] && String(sx[i].ngayxuly || '') < moc) xl.push(sx[i]);
    }
    var gh = [], sg = laMang(db.giahan);
    for (i = 0; i < sg.length; i++) {
      if (sg[i] && giuId[sg[i].idCtnv] && String(sg[i].createDate || '') < moc) gh.push(sg[i]);
    }
    var al = [], sa = laMang(db.aiLog);
    for (i = 0; i < sa.length; i++) {
      if (sa[i] && String(sa[i].createdate || '') < moc) al.push(sa[i]);
    }

    return {
      today: moc,                 // L4 — "hôm nay" của ảnh chụp
      donvi: laMang(db.donvi),
      linhvuc: laMang(db.linhvuc),
      users: laMang(db.users),
      vanban: laMang(db.vanban),
      nhiemvu: dsNv,
      phancong: pc,
      xuly: xl,
      giahan: gh,
      aiLog: al,
      _nhiemVuDangXet: xTrungTinh
    };
  }

  /* --- Bộ chuyển đổi mềm cho window.AiEngine.goiY ---------------------- */

  var _cachGoiY = -1; // -1 chưa dò | -2 không gọi được | >=0 chỉ số cách gọi

  function chuanHoaUngVien(kq) {
    var ds = null;
    if (Array.isArray(kq)) ds = kq;
    else if (kq && Array.isArray(kq.ungVien)) ds = kq.ungVien;
    else if (kq && Array.isArray(kq.dsUngVien)) ds = kq.dsUngVien;
    else if (kq && kq.data && Array.isArray(kq.data.ungVien)) ds = kq.data.ungVien;
    if (!ds) return null;
    var out = [], i, uv, id;
    for (i = 0; i < ds.length; i++) {
      uv = ds[i];
      id = uv && (uv.userid || uv.userId || uv.id);
      if (id) out.push(String(id));
    }
    return out;
  }

  function goiYQuaAiEngine(dbAnh, yeuCau) {
    var E = (typeof window !== 'undefined') ? window.AiEngine : null;
    if (!E || typeof E.goiY !== 'function' || _cachGoiY === -2) return null;
    var cach = [
      function () { return E.goiY(dbAnh, yeuCau); },
      function () { return E.goiY(yeuCau, dbAnh); },
      function () { return E.goiY(dbAnh, yeuCau.nhiemvu, yeuCau); },
      function () { return E.goiY(dbAnh, yeuCau.idnvchitiet, yeuCau); },
      function () { return E.goiY(yeuCau); }
    ];
    var i, ds;
    if (_cachGoiY >= 0) {
      try { return chuanHoaUngVien(cach[_cachGoiY]()); } catch (e) { return null; }
    }
    for (i = 0; i < cach.length; i++) {
      try {
        ds = chuanHoaUngVien(cach[i]());
        if (ds && ds.length) { _cachGoiY = i; return ds; }
      } catch (e2) { /* thử cách gọi khác */ }
    }
    return null;
  }

  /* --- Bốn chiến lược -------------------------------------------------- */

  var CHIEN_LUOC = [
    { ma: 'MO_HINH',          ten: 'Mô hình chấm điểm có trọng số (AI)' },
    { ma: 'NGAU_NHIEN',       ten: 'Chọn ngẫu nhiên' },
    { ma: 'RANH_NHAT',        ten: 'Chọn người rảnh nhất (S4)' },
    { ma: 'CHUYEN_MON_NHAT',  ten: 'Chọn người chuyên môn cao nhất (S1)' }
  ];

  function xepTheoDiem(ungVien, chamDiem) {
    var ds = [], i;
    for (i = 0; i < ungVien.length; i++) {
      ds.push({ id: String(ungVien[i].id), diem: chamDiem(ungVien[i]) });
    }
    // Sắp giảm dần theo điểm; hoà điểm thì theo id để kết quả TÁI LẬP được
    ds.sort(function (a, b) {
      if (b.diem !== a.diem) return b.diem - a.diem;
      return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
    });
    var out = [];
    for (i = 0; i < ds.length; i++) out.push(ds[i].id);
    return out;
  }

  function xaoTronCoSeed(ungVien, seed) {
    var ds = [], i, j, tmp, rnd = mulberry32(seed);
    for (i = 0; i < ungVien.length; i++) ds.push(String(ungVien[i].id));
    for (i = ds.length - 1; i > 0; i--) { // Fisher–Yates với PRNG có seed
      j = Math.floor(rnd() * (i + 1));
      tmp = ds[i]; ds[i] = ds[j]; ds[j] = tmp;
    }
    return ds;
  }

  function thuHangCua(danhSach, uid) {
    for (var i = 0; i < danhSach.length; i++) if (danhSach[i] === uid) return i + 1;
    return null; // không có trong danh sách ⇒ đóng góp 0 vào MRR
  }

  /**
   * §9.8 — So sánh mô hình với 3 baseline. Trả mảng 4 dòng, hoặc `null` nếu
   * chưa nạp window.AiEngine (không ném lỗi).
   */
  function soSanhBaseline(db, soLanThu) {
    var E = (typeof window !== 'undefined') ? window.AiEngine : null;
    if (!E || typeof E.goiY !== 'function') return null; // chưa có engine ⇒ null, không ném lỗi

    var soMau = (typeof soLanThu === 'number' && soLanThu > 0)
      ? Math.floor(soLanThu) : SO_MAU_BASELINE_MACDINH;

    // Tập ứng viên: TOÀN BỘ người thực hiện đang hoạt động, không giới hạn đơn vị.
    // Cố ý không thu hẹp theo đơn vị của nhiệm vụ: mọi chiến lược cùng đối mặt
    // một tập ứng viên như nhau và người thật luôn nằm trong tập ⇒ so sánh công bằng.
    var ungVien = dsUngVienHeThong(db);
    if (ungVien.length < 2) return null;
    var laUngVien = {}, i, j;
    for (i = 0; i < ungVien.length; i++) laUngVien[String(ungVien[i].id)] = true;

    // "Đáp án": nhiệm vụ ĐÃ NGHIỆM THU, có ngày giao và có người chủ trì hợp lệ
    var pcGoc = laMang(db && db.phancong);
    var dsGoc = laMang(db && db.nhiemvu), ungCu = [], nv, nguoiThat;
    for (i = 0; i < dsGoc.length; i++) {
      nv = dsGoc[i];
      if (!nv || !daNghiemThu(nv) || !nv.ngaygiao) continue;
      nguoiThat = nguoiChuTri(pcGoc, nv.id);
      // Bỏ mẫu mà người thật hiện không còn là ứng viên hợp lệ (đã khoá / đổi vai):
      // không chiến lược nào có thể tìm ra ⇒ giữ lại chỉ làm nhiễu đều cả 4 dòng.
      if (!nguoiThat || !laUngVien[nguoiThat]) continue;
      ungCu.push({ nv: nv, nguoiThat: nguoiThat });
    }
    if (!ungCu.length) return null;

    ungCu.sort(function (a, b) {
      return a.nv.ngaygiao < b.nv.ngaygiao ? -1 : (a.nv.ngaygiao > b.nv.ngaygiao ? 1 : 0);
    });

    // Lấy mẫu ĐỀU theo thời gian để không thiên về giai đoạn nào
    var mau = [];
    if (ungCu.length <= soMau) mau = ungCu;
    else {
      var buoc = ungCu.length / soMau;
      for (i = 0; i < soMau; i++) mau.push(ungCu[Math.min(ungCu.length - 1, Math.floor(i * buoc))]);
    }

    // Bộ đếm kết quả cho từng chiến lược
    var tich = {}, c;
    for (c = 0; c < CHIEN_LUOC.length; c++) {
      tich[CHIEN_LUOC[c].ma] = { hang1: 0, top3: 0, nghichDao: 0, phanBo: {}, soLanXep: 0 };
    }

    var soMauDaChay = 0, soLanEngineHong = 0;
    var dungDacTrungEngine = false;

    for (i = 0; i < mau.length; i++) {
      var X = mau[i].nv;
      var uidThat = mau[i].nguoiThat;
      var anh = taoAnhChupTruocKhiGiao(db, X);
      var chiSo = gomChiSo(anh);

      // Điểm S1/S4 tại thời điểm ảnh chụp (ưu tiên AiEngine.tinhDacTrung nếu có)
      var s1 = {}, s4 = {}, u, dt;
      for (j = 0; j < ungVien.length; j++) {
        u = ungVien[j];
        dt = dacTrungQuaAiEngine(anh, u, anh._nhiemVuDangXet);
        if (dt) { dungDacTrungEngine = true; s1[u.id] = dt.S1; s4[u.id] = dt.S4; }
        else { s1[u.id] = tinhS1(chiSo, String(u.id), X.linhvuc || null); s4[u.id] = tinhS4(chiSo, u); }
      }

      // (a) MO_HINH — gọi engine trên ẢNH CHỤP, không phải db hiện tại
      var phamVi = [], daCo = {};
      for (j = 0; j < ungVien.length; j++) {
        if (ungVien[j].unitcode && !daCo[ungVien[j].unitcode]) {
          daCo[ungVien[j].unitcode] = true; phamVi.push(ungVien[j].unitcode);
        }
      }
      var yeuCau = {
        idnvchitiet: X.id,
        id: X.id,
        nhiemvu: anh._nhiemVuDangXet,
        noidung: X.noidung,
        linhvuc: X.linhvuc,
        dokhan: X.dokhan,
        hanxulyth: X.hanxulyth,
        ngaygiao: X.ngaygiao,
        unitcode: X.unitcode,
        phamViUnitCode: phamVi,
        loaiTru: [],
        soLuong: ungVien.length
      };
      var xepMoHinh = goiYQuaAiEngine(anh, yeuCau);
      if (!xepMoHinh) { soLanEngineHong++; xepMoHinh = []; }
      // Chỉ giữ ứng viên nằm trong tập chuẩn (loại người ngoài phạm vi so sánh)
      var loc = [];
      for (j = 0; j < xepMoHinh.length; j++) if (laUngVien[xepMoHinh[j]]) loc.push(xepMoHinh[j]);
      xepMoHinh = loc;

      // Cắt mọi chiến lược ở cùng độ dài K để so sánh công bằng: engine thường
      // chỉ trả top-N (mặc định 5), baseline thì xếp được cả tập.
      var K = xepMoHinh.length ? Math.max(3, xepMoHinh.length) : ungVien.length;

      var xep = {};
      xep.MO_HINH = xepMoHinh.slice(0, K);
      xep.NGAU_NHIEN = xaoTronCoSeed(ungVien, 20260905 + i * 7919).slice(0, K);
      xep.RANH_NHAT = xepTheoDiem(ungVien, function (uu) { return s4[uu.id]; }).slice(0, K);
      xep.CHUYEN_MON_NHAT = xepTheoDiem(ungVien, function (uu) { return s1[uu.id]; }).slice(0, K);

      for (c = 0; c < CHIEN_LUOC.length; c++) {
        var ma = CHIEN_LUOC[c].ma, t = tich[ma], dsXep = xep[ma];
        if (!dsXep || !dsXep.length) continue;
        t.soLanXep++;
        var hang = thuHangCua(dsXep, uidThat);
        if (hang === 1) t.hang1++;
        if (hang !== null && hang <= 3) t.top3++;
        if (hang !== null) t.nghichDao += 1 / hang;
        // Mô phỏng giao việc cho ứng viên hạng 1 để đo độ đồng đều tải
        t.phanBo[dsXep[0]] = (t.phanBo[dsXep[0]] || 0) + 1;
      }
      soMauDaChay++;
    }

    // Không dò được chữ ký `AiEngine.goiY` ở bất kỳ mẫu nào ⇒ coi như chưa có
    // engine: trả null thay vì báo cáo một dòng MO_HINH toàn số 0 gây hiểu nhầm.
    if (!soMauDaChay || _cachGoiY < 0) return null;

    var kq = [];
    for (c = 0; c < CHIEN_LUOC.length; c++) {
      var m = CHIEN_LUOC[c], tt = tich[m.ma];
      // Mẫu số là TỔNG số mẫu đã chạy: chiến lược không xếp được lần nào thì
      // lần đó tính là trượt — không được "thưởng" bằng cách thu nhỏ mẫu số.
      var dsTai = [];
      for (j = 0; j < ungVien.length; j++) dsTai.push(tt.phanBo[String(ungVien[j].id)] || 0);
      kq.push({
        chienLuoc: m.ma,
        ten: m.ten,
        soMau: soMauDaChay,
        precision1: lamTron(chiaAnToan(tt.hang1, soMauDaChay), 2),
        precision3: lamTron(chiaAnToan(tt.top3, soMauDaChay), 2),
        mrr: lamTron(chiaAnToan(tt.nghichDao, soMauDaChay), 2),
        giniTaiSauKhiGiao: gini(dsTai)
      });
    }

    // Thông tin phụ trợ cho báo cáo — gắn kèm mảng, không phá cấu trúc trả về
    kq.soMauDanhGia = soMauDaChay;
    kq.soUngVien = ungVien.length;
    kq.soLanEngineHong = soLanEngineHong;
    kq.nguonDacTrung = dungDacTrungEngine ? 'AiEngine.tinhDacTrung' : 'Metrics (§9.4)';
    kq.ghiChu = 'Đánh giá time-split: mỗi nhiệm vụ chỉ dùng dữ liệu có trước ngày giao của chính nó.';
    return kq;
  }

  /* ======================================================================
   * 8b. §9.8 — HAI DÒNG CÒN LẠI CỦA BẢNG ĐO HIỆU QUẢ
   * ==================================================================== */

  /**
   * §9.8 dòng "Tỷ lệ đúng hạn": so sánh nhóm nhiệm vụ GIAO THEO GỢI Ý
   * (`ai_goiy_id` khác null, §4.2/§4.8) với nhóm GIAO THỦ CÔNG. Kỳ vọng nhóm AI
   * CAO HƠN. Chỉ tính trên nhiệm vụ đã nghiệm thu; §9.4 S3(a): trangthai = 1 là
   * hoàn thành TRONG hạn, trangthai = 5 là hoàn thành SAU hạn.
   */
  function tyLeDungHanTheoNguon(db) {
    var ds = laMang(db && db.nhiemvu), i, nv, nhom;
    var theoGoiY = { nhan: 'Giao theo gợi ý AI', soHoanThanh: 0, soDungHan: 0, tyLeDungHan: 0 };
    var thuCong  = { nhan: 'Giao thủ công',      soHoanThanh: 0, soDungHan: 0, tyLeDungHan: 0 };
    for (i = 0; i < ds.length; i++) {
      nv = ds[i];
      if (!nv || !daNghiemThu(nv)) continue;
      nhom = (nv.ai_goiy_id != null && nv.ai_goiy_id !== '') ? theoGoiY : thuCong;
      nhom.soHoanThanh++;
      if (nv.trangthai === 1) nhom.soDungHan++;
    }
    var tlAi = chiaAnToan(theoGoiY.soDungHan, theoGoiY.soHoanThanh);
    var tlTc = chiaAnToan(thuCong.soDungHan, thuCong.soHoanThanh);
    theoGoiY.tyLeDungHan = lamTron(tlAi, 2);
    thuCong.tyLeDungHan  = lamTron(tlTc, 2);
    return {
      theoGoiY: theoGoiY,
      thuCong: thuCong,
      chenhLech: lamTron(tlAi - tlTc, 2),
      // So bằng giá trị THÔ; chỉ kết luận khi cả hai nhóm đều có mẫu
      dat: theoGoiY.soHoanThanh > 0 && thuCong.soHoanThanh > 0 && tlAi > tlTc
    };
  }

  /**
   * §9.8 dòng "Độ lệch tải (Gini) — TRƯỚC và SAU khi dùng AI". Kỳ vọng GIẢM.
   * `moc` mặc định = ngày `createdate` sớm nhất trong AI_GOIY_LOG (lần đầu dùng gợi ý).
   * "Trước" = Gini tải đo trên ảnh chụp CSDL tại mốc đó — dùng lại đúng bộ cắt chống
   * rò rỉ ở mục 8, nên tải tại mốc không bị dữ liệu sau mốc làm sai.
   */
  function giniTaiTruocSau(db, mocBatDauAI) {
    var moc = ngayCuaChuoi(mocBatDauAI) || null;
    var logs = laMang(db && db.aiLog), i, c;
    if (!moc) {
      for (i = 0; i < logs.length; i++) {
        c = ngayCuaChuoi(logs[i] && logs[i].createdate);
        if (c && (moc === null || c < moc)) moc = c;
      }
    }
    var sau = giniTai(db);
    // Chưa từng dùng AI ⇒ không có mốc để chia trước/sau, trả cùng một giá trị
    if (!moc) return { moc: null, truoc: sau, sau: sau, giam: 0, dat: false };
    var anh = taoAnhChupTruocKhiGiao(db, { id: '__MOC_THOI_GIAN__', ngaygiao: moc });
    var truoc = giniTai(anh);
    return { moc: moc, truoc: truoc, sau: sau, giam: lamTron(truoc - sau, 3), dat: sau < truoc };
  }

  /* ======================================================================
   * 9. XUẤT RA window.Metrics
   * ==================================================================== */

  window.Metrics = {
    // §9.8 — đo hiệu quả AI (màn M13)
    thongKeAI: thongKeAI,
    gini: gini,
    giniTai: giniTai,
    giniTaiTruocSau: giniTaiTruocSau,
    tyLeDungHanTheoNguon: tyLeDungHanTheoNguon,
    taiHienTai: taiHienTai,
    soSanhBaseline: soSanhBaseline,
    // §3.1 / §5.10 — dashboard
    dashboard: dashboard,
    viecSapDenHan: viecSapDenHan,
    // §4.8 / §4.4
    hieuSuatNguoiDung: hieuSuatNguoiDung,
    tienDoTheoThoiGian: tienDoTheoThoiGian,
    // Hằng số + tiện ích dùng lại cho UI
    NGUONG_MUC_TIEU: NGUONG_MUC_TIEU,
    DM_TRANGTHAI: DM_TRANGTHAI,
    lamTron: lamTron,
    soNgayGiua: soNgayGiua
  };
})();

</script>

<script>
/* ============================================================

(function () {
  'use strict';

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  function esc(v) {

      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function n1(v) { return (Math.round(Number(v) * 10) / 10).toFixed(1); }
  function n2(v) { return (Math.round(Number(v) * 100) / 100).toFixed(2); }
  function pct(v) { return Math.round(Number(v) * 100) + '%'; }
  function clamp01(v) { return Math.max(0, Math.min(1, Number(v) || 0)); }

  /* ---------- Trạng thái ứng dụng ---------- */
  var S = {
    db: null,
    me: null,
    man: 'tong-quan',
    chip: 'TAT_CA',
    idvb: null,          // văn bản đang phân công
    rows: [],            // các dòng nhiệm vụ đang soạn ở M05
    aiCache: null,       // kết quả gợi ý gần nhất (để "xem thêm")
    buoc: null           // bước sơ đồ đang tô sáng
  };

  /* ---------- Danh mục / màu ---------- */
  var MAU_LOP = {
    xam: 'mute', mute: 'mute',
    duong: 'info', xanhduong: 'info', info: 'info',
    do: 'bad', bad: 'bad',
    xanh: 'good', xanhla: 'good', good: 'good',
    vang: 'warn', warn: 'warn',
    tim: 'spec', spec: 'spec',
    den: 'dead', dead: 'dead'
  };
  var MAU_A = { 1: 'good', 2: 'info', 3: 'mute', 5: 'good', 6: 'bad', 7: 'bad', 13: 'spec', 97: 'dead' };
  var MAU_B = { 10: 'warn', 11: 'good', 12: 'bad' };

  function dmA(ma) {
    var d = (window.Flow && Flow.DM && Flow.DM.TRANGTHAINV) || [];
    for (var i = 0; i < d.length; i++) if (String(d[i].ma) === String(ma)) return d[i];
    return { ma: ma, nhan: 'Mã ' + ma, mau: 'xam' };
  }
  function dmB(ma) {
    if (ma == null) return null;
    var d = (window.Flow && Flow.DM && Flow.DM.TRANGTHAIPH) || [];
    for (var i = 0; i < d.length; i++) if (String(d[i].ma) === String(ma)) return d[i];
    return { ma: ma, nhan: 'Mã ' + ma, mau: 'xam' };
  }
  function lopA(ma) { return MAU_A[ma] || MAU_LOP[dmA(ma).mau] || 'mute'; }
  function lopB(ma) { return MAU_B[ma] || MAU_LOP[(dmB(ma) || {}).mau] || 'mute'; }

  /** Chip kép hai trục — dấu hiệu nhận dạng của hệ này (§2: 2 trục song song). */
  function chipDuo(nv) {
    var a = dmA(nv.trangthai), b = dmB(nv.trangthaiDvXuly);
    var h = '<span class="duo" title="Trục A trangthai=' + esc(nv.trangthai) +
      ' · Trục B trangthaiDvXuly=' + esc(nv.trangthaiDvXuly == null ? 'null' : nv.trangthaiDvXuly) + '">';
    h += '<b class="c-' + lopA(nv.trangthai) + '"><span class="ma">' + esc(nv.trangthai) + '</span>' + esc(a.nhan) + '</b>';
    if (b) h += '<b class="ax-b c-' + lopB(nv.trangthaiDvXuly) + '"><span class="ma">' + esc(b.ma) + '</span>' + esc(b.nhan) + '</b>';
    else h += '<b class="ax-b none"><span class="ma">—</span>Chưa báo cáo</b>';
    h += '</span>';
    return h;
  }

  /* ---------- Truy vấn tiện dụng ---------- */
  function user(id) { for (var i = 0; i < S.db.users.length; i++) if (S.db.users[i].id === id) return S.db.users[i]; return null; }
  function tenUser(id) { var u = user(id); return u ? u.fullname : '—'; }
  function donVi(code) { for (var i = 0; i < S.db.donvi.length; i++) if (S.db.donvi[i].unitcode === code) return S.db.donvi[i]; return null; }
  function tenDonVi(code) { var d = donVi(code); return d ? d.tendonvi : code || '—'; }
  function linhVuc(ma) { for (var i = 0; i < S.db.linhvuc.length; i++) if (S.db.linhvuc[i].ma === ma) return S.db.linhvuc[i]; return null; }
  function tenLinhVuc(ma) { var l = linhVuc(ma); return l ? l.ten : (ma || '—'); }
  function nhiemVu(id) { for (var i = 0; i < S.db.nhiemvu.length; i++) if (S.db.nhiemvu[i].id === id) return S.db.nhiemvu[i]; return null; }
  function vanBan(id) { for (var i = 0; i < S.db.vanban.length; i++) if (S.db.vanban[i].id === id) return S.db.vanban[i]; return null; }
  function pcCua(idnv, vaitro) {
    return S.db.phancong.filter(function (p) {
      return p.idnvchitiet === idnv && p.trangthai === 1 && (!vaitro || p.vaitro === vaitro);
    });
  }
  function today() { return (window.Flow && Flow.Ngay) ? Flow.Ngay.homNay(S.db) : S.db.today; }
  function dinhDang(iso) { return (window.Flow && Flow.Ngay) ? Flow.Ngay.dinhDang(iso) : (iso || '—'); }
  function conLai(nv) {
    if (!nv.hanxulyth) return null;
    return Flow.Ngay.soNgayConLai(nv.hanxulyth, today());
  }

  /** Nhiệm vụ tôi đang chủ trì / phối hợp */
  function cuaToi() {
    var ids = {};
    S.db.phancong.forEach(function (p) {
      if (p.userid === S.me.id && p.trangthai === 1) ids[p.idnvchitiet] = p.vaitro;
    });
    return S.db.nhiemvu.filter(function (nv) { return ids[nv.id]; })
      .map(function (nv) { nv.__vai = ids[nv.id]; return nv; });
  }
  /** Nhiệm vụ tôi giao, đang chờ tôi kiểm tra kết quả */
  function choToiKiemTra() {
    return S.db.nhiemvu.filter(function (nv) {
      return Flow.quyen(S.db, nv, S.me.id).kiemTraKetQua;
    });
  }

  /* ---------- Thông báo ---------- */
  function toast(t, d, xau) {
    var box = $('#toasts');
    var el = document.createElement('div');
    el.className = 'toast' + (xau ? ' bad' : '');
    el.innerHTML = '<div class="t">' + esc(t) + '</div>' + (d ? '<div class="d">' + esc(d) + '</div>' : '');
    box.appendChild(el);
    setTimeout(function () { el.remove(); }, xau ? 6000 : 4200);
  }

  /* ---------- Hộp thoại ---------- */
  function moDlg(tieuDe, phu, thanHTML, chanHTML, sau) {
    var dlg = $('#dlg');
    $('#dlg-inner').innerHTML =
      '<div class="dlg-head"><div><h3>' + tieuDe + '</h3>' +
      (phu ? '<div class="sub">' + phu + '</div>' : '') + '</div>' +
      '<button class="btn btn-sm btn-ghost x" data-dong>✕</button></div>' +
      '<div class="dlg-body">' + thanHTML + '</div>' +
      (chanHTML ? '<div class="dlg-foot">' + chanHTML + '</div>' : '');
    if (!dlg.open) dlg.showModal();
    $$('[data-dong]', dlg).forEach(function (b) { b.onclick = function () { dlg.close(); }; });
    if (sau) sau(dlg);
  }
  function dongDlg() { var d = $('#dlg'); if (d.open) d.close(); }

  /* =========================================================
     RUY-BĂNG 7 BƯỚC NGHIỆP VỤ (§1)
     ========================================================= */
  var BUOC = ['Tạo nhiệm vụ', 'Giao nhiệm vụ', 'Tiếp nhận', 'Thực hiện & tiến độ',
    'Gửi báo cáo', 'Kiểm tra kết quả', 'Hoàn thành'];

  function veRibbon(buoc, nhanhBoSung) {
    var h = '<span class="ribbon-lab">Luồng nghiệp vụ</span>';
    for (var i = 1; i <= 7; i++) {
      var lop = buoc == null ? '' : (i < buoc ? 'done' : (i === buoc ? 'now' : ''));
      h += '<div class="step ' + lop + '"><span class="step-n">' + i + '</span><span>' + BUOC[i - 1] + '</span></div>';
    }
    if (nhanhBoSung) h += '<div class="step loop now"><span class="step-n">↺</span><span>Yêu cầu bổ sung → làm lại</span></div>';
    $('#ribbon').innerHTML = h;
  }

  /* =========================================================
     MÀN HÌNH
     ========================================================= */
  var MAN = {
    'tong-quan': { ten: 'Tổng quan', ma: 'M02', buoc: null, ve: veTongQuan },
    'van-ban': { ten: 'Văn bản chỉ đạo', ma: 'M03', buoc: 1, ve: veVanBan },
    'phan-cong': { ten: 'Phân công nhiệm vụ', ma: 'M05', buoc: 2, ve: vePhanCong },
    'cua-toi': { ten: 'Nhiệm vụ của tôi', ma: 'M08', buoc: 4, ve: veCuaToi },
    'kiem-tra': { ten: 'Chờ tôi kiểm tra', ma: 'M07', buoc: 6, ve: veKiemTra },
    'ai-log': { ten: 'Nhật ký gợi ý AI', ma: 'M13', buoc: null, ve: veAiLog },
    'ai-cau-hinh': { ten: 'Trọng số mô hình', ma: 'H4', buoc: null, ve: veCauHinh },
    'may-trang-thai': { ten: 'Máy trạng thái', ma: '§2', buoc: null, ve: veMayTrangThai }
  };

  function di(man) { S.man = man; render(); }

  function render() {
    var m = MAN[S.man] || MAN['tong-quan'];
    $('#man-title').textContent = m.ten;
    $('#man-code').textContent = m.ma;
    $$('.nav-item').forEach(function (b) {
      if (b.dataset.man === S.man) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    veRibbon(m.buoc);
    $('#view').innerHTML = m.ve();
    ganSuKien();
    capNhatDem();
  }

  function capNhatDem() {
    $('#nav-cua-toi').textContent = cuaToi().filter(function (nv) {
      return [1, 5, 97].indexOf(nv.trangthai) < 0 || nv.trangthaiDvXuly === 10;
    }).length || '';
    var k = choToiKiemTra().length;
    $('#nav-kiem-tra').textContent = k || '';
    $('#foot-count').textContent = S.db.nhiemvu.length + ' nhiệm vụ · ' + S.db.users.length + ' người dùng';
    $('#foot-today').textContent = dinhDang(today());
  }

  /* ---------- M02 Tổng quan ---------- */
  function veTongQuan() {
    var d = Metrics.dashboard(S.db, today());
    var ai = Metrics.thongKeAI(S.db);
    var gini = Metrics.giniTai(S.db);

    var h = '<div class="view-head"><div>' +
      '<h2>Tổng quan</h2>' +
      '<p class="lede">Bốn thẻ đếm, phân bố theo trạng thái nghiệp vụ và theo đơn vị — tính trực tiếp từ hai trục trạng thái, không qua bảng thống kê nền.</p>' +
      '</div></div>';

    h += '<div class="grid g-4" style="margin-bottom:14px">' +
      thẻ('s-mute', 'Chưa triển khai', d.chuaTrienKhai, 'trangthai = 3') +
      thẻ('s-info', 'Đang triển khai', d.dangTrienKhai, 'trangthai ∈ {2, 7}') +
      thẻ('s-warn', 'Chờ xác nhận', d.choXacNhan, 'trangthaiDvXuly = 10') +
      thẻ('s-bad', 'Quá hạn', d.quaHan, 'hạn < hôm nay, chưa kết thúc') +
      '</div>';

    h += '<div class="grid g-main">';

    // Phân bố theo trạng thái — dùng bảng màu trạng thái, mỗi dòng có nhãn chữ nên không dựa vào màu
    var maxTT = Math.max.apply(null, d.theoTrangThai.map(function (r) { return r.soLuong; }).concat([1]));
    h += '<section class="panel"><div class="panel-head"><h3>Phân bố theo trạng thái nhiệm vụ</h3>' +
      '<span class="sub">trục A · ' + d.tongSo + ' nhiệm vụ</span></div><div class="panel-body"><div class="bars">';
    d.theoTrangThai.forEach(function (r) {
      if (!r.soLuong) return;
      var lop = MAU_A[r.ma] || MAU_LOP[r.mau] || 'mute';
      // Sàn 2% để nhóm nhỏ không biến mất bên cạnh 270 nhiệm vụ lịch sử đã nghiệm thu
      var w = Math.max(2, r.soLuong / maxTT * 100);
      h += '<div class="bar-row" title="' + esc(r.nhan) + ': ' + r.soLuong + ' nhiệm vụ">' +
        '<div><span class="spec">' + r.ma + '</span> ' + esc(r.nhan) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + w + '%;background:var(--st-' + lop + ')"></div></div>' +
        '<div class="num">' + r.soLuong + '</div></div>';
    });
    h += '</div><p class="note" style="margin-top:9px">Cột ngắn nhất được kéo lên tối thiểu 2% để nhóm ít nhiệm vụ vẫn nhìn thấy; con số bên phải mới là giá trị thật.</p></div></section>';

    // Sắp đến hạn — đổi theo vai đang đăng nhập để bảng không rỗng
    var nguonSap = cuaToi(), nhanSap = 'Việc của tôi sắp đến hạn';
    if (!nguonSap.length) {
      nguonSap = S.db.nhiemvu.filter(function (nv) { return nv.userIdGiaoViec === S.me.id; });
      nhanSap = 'Việc tôi giao sắp đến hạn';
    }
    var sap = nguonSap.filter(function (nv) {
      var c = conLai(nv);
      return c != null && c <= 3 && [1, 5, 97].indexOf(nv.trangthai) < 0;
    }).sort(function (a, b) { return conLai(a) - conLai(b); }).slice(0, 6);

    h += '<section class="panel"><div class="panel-head"><h3>' + esc(nhanSap) + '</h3><span class="sub">≤ 3 ngày hoặc đã quá hạn</span></div>';
    if (!sap.length) h += '<div class="empty">Không có việc nào sắp đến hạn.</div>';
    else {
      h += '<div class="panel-body tight"><div class="tbl-wrap"><table><tbody>';
      sap.forEach(function (nv) {
        var c = conLai(nv);
        h += '<tr><td><span class="noidung">' + esc(cắt(nv.noidung, 74)) + '</span>' +
          '<div class="meta">' + esc(tenLinhVuc(nv.linhvuc)) + '</div></td>' +
          '<td class="num"><span class="han ' + (c < 0 ? 'qua' : 'sap') + '">' +
          (c < 0 ? 'Quá ' + (-c) + ' ngày' : 'Còn ' + c + ' ngày') + '</span></td></tr>';
      });
      h += '</tbody></table></div></div>';
    }
    h += '</section></div>';

    // Theo đơn vị — độ lớn, một sắc độ
    var maxDV = Math.max.apply(null, d.theoDonVi.map(function (r) { return r.tongSo; }).concat([1]));
    h += '<div class="grid g-main" style="margin-top:14px">';
    h += '<section class="panel"><div class="panel-head"><h3>Khối lượng theo đơn vị</h3>' +
      '<span class="sub">tổng nhiệm vụ · tỷ lệ đã nghiệm thu</span></div><div class="panel-body"><div class="bars">';
    d.theoDonVi.forEach(function (r) {
      h += '<div class="bar-row" title="' + esc(r.tendonvi) + ': ' + r.tongSo + ' nhiệm vụ, hoàn thành ' + r.hoanThanh + '">' +
        '<div>' + esc(r.tendonvi) + '</div>' +
        '<div class="bar-track" style="position:relative">' +
        '<div class="bar-fill" style="width:' + (r.tongSo / maxDV * 100) + '%;background:var(--accent);opacity:.28"></div>' +
        '<div class="bar-fill" style="width:' + (r.hoanThanh / maxDV * 100) + '%;background:var(--accent);position:absolute;inset:0"></div>' +
        '</div>' +
        '<div class="num">' + Math.round(r.tyLeHoanThanh * 100) + '%</div></div>';
    });
    h += '</div><div class="contrib-key" style="margin-top:9px">' +
      '<span><i style="opacity:1"></i>Đã nghiệm thu</span><span><i style="opacity:.28"></i>Tổng được giao</span></div>' +
      '</div></section>';

    h += '<section class="panel"><div class="panel-head"><h3>Hiệu quả gợi ý AI</h3>' +
      '<span class="sub">' + ai.soLanGoiY + ' lượt</span>' +
      '<span class="spacer"></span><button class="btn btn-sm" data-di="ai-log">Chi tiết</button></div>' +
      '<div class="panel-body"><div class="grid g-2">' +
      kpi('Precision@3', n2(ai.precision3), 'mục tiêu ≥ 0,60', ai.precision3 >= 0.6) +
      kpi('Tỷ lệ chấp nhận', n2(ai.tyLeChapNhan), 'mục tiêu ≥ 0,70', ai.tyLeChapNhan >= 0.7) +
      '</div><p class="note" style="margin-top:10px">Độ lệch tải giữa những người thực hiện (hệ số Gini): <b class="mono">' +
      n2(gini) + '</b> — càng thấp thì khối lượng càng được chia đều.</p></div></section>';
    h += '</div>';
    return h;
  }

  function thẻ(lop, k, v, n) {
    return '<div class="stat ' + lop + '"><div class="k">' + esc(k) + '</div><div class="v">' + v +
      '</div><div class="n"><span class="spec">' + esc(n) + '</span></div></div>';
  }
  function kpi(k, v, t, dat) {
    return '<div class="kpi ' + (dat ? 'ok' : 'no') + '"><div class="k">' + esc(k) + '</div>' +
      '<div class="v">' + v + '</div><div class="t">' + esc(t) + (dat ? ' ✓' : ' ✕') + '</div></div>';
  }
  function cắt(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

  /* ---------- M03 Văn bản chỉ đạo ---------- */
  function veVanBan() {
    var h = '<div class="view-head"><div><h2>Văn bản chỉ đạo</h2>' +
      '<p class="lede">Tầng trên của mô hình hai tầng: một văn bản chỉ đạo sinh ra nhiều nhiệm vụ chi tiết (§1.1).</p></div>' +
      '<div class="spacer"></div></div>';
    h += '<section class="panel"><div class="panel-body tight"><div class="tbl-wrap"><table>' +
      '<thead><tr><th>Số ký hiệu</th><th>Trích yếu</th><th>Lĩnh vực</th><th>Độ khẩn</th>' +
      '<th class="num">Nhiệm vụ</th><th></th></tr></thead><tbody>';
    S.db.vanban.forEach(function (vb) {
      var ds = S.db.nhiemvu.filter(function (nv) { return nv.idvb === vb.id; });
      h += '<tr>' +
        '<td><span class="vb-so">' + esc(vb.sokyhieu) + '</span><div class="meta">' + dinhDang(vb.ngaybanhanh) + '</div></td>' +
        '<td><span class="vb-title">' + esc(cắt(vb.trichyeu, 96)) + '</span>' +
        '<div class="meta">' + esc(vb.coquanbanhanh || '') + '</div></td>' +
        '<td>' + esc(tenLinhVuc(vb.linhvuc)) + '</td>' +
        '<td><span class="tag c-' + (vb.dokhan === 'DOTXUAT' ? 'bad' : vb.dokhan === 'TRONGTAM' ? 'warn' : 'mute') + ' solid">' + nhãnKhẩn(vb.dokhan) + '</span></td>' +
        '<td class="num">' + ds.length + '</td>' +
        '<td class="acts"><button class="btn btn-sm btn-primary" data-pc="' + vb.id + '">Phân công →</button></td>' +
        '</tr>';
    });
    h += '</tbody></table></div></div></section>';
    return h;
  }
  function nhãnKhẩn(k) {
    return k === 'DOTXUAT' ? 'Đột xuất' : k === 'TRONGTAM' ? 'Trọng tâm' : 'Thường xuyên';
  }

  /* ---------- M05 Phân công nhiệm vụ ⭐ ---------- */
  function vePhanCong() {
    if (!S.idvb) S.idvb = S.db.vanban[0] && S.db.vanban[0].id;
    var vb = vanBan(S.idvb);
    if (!vb) return '<div class="empty">Chưa có văn bản chỉ đạo nào.</div>';
    if (!S.rows.length) S.rows = [dòngMới(vb)];

    var q = S.me.vaitro === 'NGUOI_GIAO' || S.me.vaitro === 'QUAN_TRI';

    var h = '<div class="view-head"><div><h2>Phân công nhiệm vụ</h2>' +
      '<p class="lede">Màn hình trọng tâm. Một văn bản → nhiều dòng nhiệm vụ; mỗi dòng bắt buộc có ít nhất một người chủ trì. Nút <b>AI gợi ý</b> nằm ngay tại ô chọn chủ trì.</p></div>' +
      '<div class="spacer"></div>' +
      '<select id="sel-vb" style="width:auto;min-width:280px">' +
      S.db.vanban.map(function (v) {
        return '<option value="' + v.id + '"' + (v.id === S.idvb ? ' selected' : '') + '>' +
          esc(v.sokyhieu + ' — ' + cắt(v.trichyeu, 56)) + '</option>';
      }).join('') + '</select></div>';

    if (!q) {
      h += '<div class="ai-warn">Vai <b>' + esc(nhãnVai(S.me.vaitro)) + '</b> không được tạo và giao nhiệm vụ (§6.2 dòng 4). ' +
        'Hãy chuyển sang một tài khoản Người giao ở góc trên bên phải để thử màn này.</div>';
    }

    h += '<section class="panel" style="margin-bottom:14px"><div class="panel-body">' +
      '<div class="grid g-4">' +
      ô('Số ký hiệu', '<span class="vb-so">' + esc(vb.sokyhieu) + '</span>') +
      ô('Cơ quan ban hành', esc(vb.coquanbanhanh || '—')) +
      ô('Lĩnh vực', esc(tenLinhVuc(vb.linhvuc))) +
      ô('Độ khẩn', nhãnKhẩn(vb.dokhan)) +
      '</div><div class="hr"></div>' +
      '<div class="field"><label>Trích yếu</label><div class="vb-title">' + esc(vb.trichyeu) + '</div></div>' +
      '</div></section>';

    h += '<section class="panel"><div class="panel-head"><h3>Danh sách nhiệm vụ giao</h3>' +
      '<span class="sub">' + S.rows.length + ' dòng</span><span class="spacer"></span>' +
      '<button class="btn btn-sm" id="btn-them-dong"' + (q ? '' : ' disabled') + '>+ Thêm dòng</button>' +
      '</div><div class="panel-body">';

    S.rows.forEach(function (r, i) {
      h += '<div class="pc-row"><div class="pc-top"><div class="pc-stt">' + (i + 1) + '</div>' +
        '<div class="field" style="flex:1"><label>Nội dung nhiệm vụ <span style="color:var(--st-bad)">*</span></label>' +
        '<textarea data-r="' + i + '" data-f="noidung" maxlength="2000" placeholder="Nhập nội dung nhiệm vụ…"' + (q ? '' : ' disabled') + '>' + esc(r.noidung) + '</textarea></div>' +
        (S.rows.length > 1 ? '<button class="btn btn-sm btn-ghost" data-xoa="' + i + '" title="Xoá dòng">✕</button>' : '') +
        '</div>';

      h += '<div class="pc-fields">' +
        '<div class="field"><label>Lĩnh vực <span style="color:var(--st-bad)">*</span></label>' +

    return v === 'QUAN_TRI' ? 'Quản trị' : v === 'NGUOI_GIAO' ? 'Người giao' : 'Người thực hiện';

  /** Đơn vị thực sự phụ trách một lĩnh vực = nơi có nhiều nhiệm vụ đã nghiệm thu nhất
   *  ở lĩnh vực đó. Dùng làm phạm vi mặc định khi giao việc, để danh sách gợi ý mở ra
   *  là những người có kinh nghiệm thật, thay vì một đơn vị không làm lĩnh vực này. */
  function donViPhuTrach(maLV) {
    var dem = {};
    S.db.nhiemvu.forEach(function (nv) {
      if (nv.linhvuc !== maLV) return;
      if ([1, 5].indexOf(nv.trangthai) < 0 || nv.trangthaiDvXuly !== 11) return;
      pcCua(nv.id, 'CHUTRI').forEach(function (p) {
        var u = user(p.userid);
        if (u) dem[u.unitcode] = (dem[u.unitcode] || 0) + 1;
      });
    });
    var best = null, bestN = -1;
    Object.keys(dem).forEach(function (k) { if (dem[k] > bestN) { bestN = dem[k]; best = k; } });
    if (best) return best;
    var dv = S.db.donvi.filter(function (d) { return d.capdonvi > 1; });
    return dv.length ? dv[0].unitcode : S.db.donvi[0].unitcode;
  }

  function dòngMới(vb) {
    var la = S.db.linhvuc.filter(function (l) { return l.nhomCha; });      // chỉ lĩnh vực lá
    var ma = null;
    if (vb && vb.linhvuc) {
      var l = linhVuc(vb.linhvuc);
      if (l && l.nhomCha) ma = l.ma;                                        // văn bản đã gán lĩnh vực lá
      else if (l) {                                                         // gán ở mức nhóm cha → lấy lá đầu tiên trong nhóm
        var con = la.filter(function (x) { return x.nhomCha === l.ma; });
        if (con.length) ma = con[0].ma;
      }
    }
    if (!ma) ma = la[0].ma;
    return {
      noidung: '', linhvuc: ma,
      dokhan: (vb && vb.dokhan) || 'THUONGXUYEN',
      hanxulyth: Flow.Ngay.congNgay(today(), 21),
      unitcode: donViPhuTrach(ma), chuTri: [], phoiHop: [], goiyId: null
    };
  }
  /** 4 điều kiện bật nút Lưu (§1.2 bước 1.3) */

      var r = S.rows[i];
      if (!r.noidung.trim()) return 'Dòng ' + (i + 1) + ': chưa nhập nội dung nhiệm vụ.';
      if (!r.linhvuc) return 'Dòng ' + (i + 1) + ': chưa chọn lĩnh vực.';
      if (!r.chuTri.length) return 'Dòng ' + (i + 1) + ': phải có ít nhất một người chủ trì.';
    }
    return null;
  }

      case 'QUA_HAN': return nv.trangthai === 7 || (c != null && c < 0 && [1, 5, 97].indexOf(nv.trangthai) < 0);
      case 'XONG': return [1, 5].indexOf(nv.trangthai) >= 0 && nv.trangthaiDvXuly === 11;

      '<p class="note" style="margin-top:10px">Bốn yếu tố đề tài yêu cầu — chuyên môn, lịch sử, hiệu quả, khối lượng — đều <b>suy ra từ chính lịch sử nhiệm vụ</b>. Không có bảng khai báo năng lực, không ai phải đi điền hồ sơ (§9.2, §10.1).</p>' +
      '</div></section></div>';

  function veMayTrangThai() {

      '<p class="lede">Hai trục song song, không gộp. Bảng dưới là ma trận chuyển §2.4 — mỗi dòng là một hành động có thật trong demo này.</p></div></div>';

    h += '<div class="grid g-2" style="margin-bottom:14px">';
    [['Trục A — trangthai', Flow.DM.TRANGTHAINV, MAU_A],
     ['Trục B — trangthaiDvXuly', Flow.DM.TRANGTHAIPH, MAU_B]].forEach(function (pair) {
      h += '<section class="panel"><div class="panel-head"><h3>' + esc(pair[0]) + '</h3></div>' +
        '<div class="panel-body tight"><div class="tbl-wrap"><table><tbody>';
      pair[1].forEach(function (t) {
        var lop = pair[2][t.ma] || MAU_LOP[t.mau] || 'mute';
        h += '<tr><td style="width:56px"><span class="tag c-' + lop + ' solid mono">' + t.ma + '</span></td>' +
          '<td><b>' + esc(t.nhan) + '</b><div class="meta">' + esc(t.moTa || '') + '</div></td></tr>';
      });
      h += '</tbody></table></div></div></section>';
    });
    h += '</div>';

    h += '<section class="panel"><div class="panel-head"><h3>Ma trận chuyển trạng thái</h3>' +
      '<span class="sub">§2.4 · 14 chuyển</span></div><div class="panel-body tight"><div class="tbl-wrap">' +
      '<table class="mtx"><thead><tr><th>#</th><th>Từ (A, B)</th><th>Hành động</th><th>Vai</th><th>Đến</th></tr></thead><tbody>';
    Flow.MA_TRAN_CHUYEN.forEach(function (t) {
      h += '<tr><td class="mono">' + esc(t.ma) + '</td><td class="tt">' + esc(t.tu) + '</td>' +
        '<td><b>' + esc(t.hanhDong) + '</b>' + (t.moi ? ' <span class="tag c-spec solid">thiết kế mới</span>' : '') + '</td>' +
        '<td>' + esc(t.vai) + '</td><td class="tt">' + esc(t.den) + '</td></tr>';
    });
    h += '</tbody></table></div></div></section>';
    return h;

  /* =========================================================
     POPUP AI GỢI Ý (M06) ⭐
     ========================================================= */
  function moGoiY(i, soLuong) {
    var r = S.rows[i];
    if (!r.linhvuc) { toast('Chưa chọn lĩnh vực', 'Mô hình cần lĩnh vực để chấm điểm chuyên môn.', true); return; }

    var req = {
      idnvchitiet: null,
      noidung: r.noidung,
      linhvuc: r.linhvuc,
      dokhan: r.dokhan,
      hanxulyth: r.hanxulyth,
      phamViUnitCode: [r.unitcode],
      loaiTru: r.chuTri.map(function (u) { return u.id; }),
      soLuong: soLuong || 5
    };
    var kq = AiEngine.goiY(S.db, req);
    S.aiCache = { i: i, req: req, kq: kq };
    veGoiY();
  }

  function veGoiY() {
    var c = S.aiCache, kq = c.kq, req = c.req;
    var cf = AiEngine.CAU_HINH;

    var body = '';
    body += '<div class="ai-bar">' +
      '<span class="k">Lĩnh vực</span><span class="v"><b>' + esc(tenLinhVuc(req.linhvuc)) + '</b></span>' +
      '<span class="k">Hạn</span><span class="v">' + dinhDang(req.hanxulyth) + '</span>' +
      '<span class="k">Ưu tiên</span><span class="v">' + nhãnKhẩn(req.dokhan) + '</span>' +
      '<span class="k">Chế độ</span><span class="v"><span class="spec">' + esc(kq.cheDo) + '</span></span>' +
      '<span class="k">Trọng số</span><span class="v"><span class="spec">' + esc(kq.phienBanTrongSo) + '</span></span>' +
      '</div>';

    (kq.canhBao || []).forEach(function (w) {
      body += '<div class="ai-warn">' + esc(typeof w === 'string' ? w : (w.noiDung || w.nhan || '')) + '</div>';
    });

    if (!kq.ungVien.length) body += '<div class="empty">Không tìm được ứng viên nào trong phạm vi đơn vị đã chọn.</div>';

    kq.ungVien.forEach(function (u, idx) {
      var dt = u.diemThanhPhan;
      var quaTai = (u.nhan || []).some(function (n) { return (n.ma || n) === 'QUA_TAI'; });
      body += '<div class="cand ' + (idx === 0 && !quaTai ? 'top' : '') + (quaTai ? ' dim' : '') + '">';

      body += '<div class="cand-head"><div class="rank">' + (idx + 1) + '</div>' +
        '<div style="min-width:0"><div class="cand-name">' + esc(u.fullname) + '</div>' +
        '<div class="cand-org">' + esc(u.chucvu || '') + ' · ' + esc(u.unitname || '') + '</div>' +
        '<div style="margin-top:4px;display:flex;gap:5px;flex-wrap:wrap">' +
        (u.nhan || []).map(function (n) {
          var ma = n.ma || n, txt = n.nhan || n;
          var lop = ma === 'QUA_TAI' ? 'bad' : ma === 'CO_QUA_HAN' ? 'warn' : ma === 'NGUOI_MOI' ? 'info' : 'mute';
          return '<span class="tag c-' + lop + ' solid">' + esc(txt) + '</span>';
        }).join('') + '</div></div>' +
        '<div class="cand-score"><div class="v">' + n1(u.diemTong) + '</div><div class="u">/ 100 điểm</div>' +
        '<div class="u">tin cậy ' + n2(u.doTinCay) + '</div></div></div>';

      // Thanh đóng góp: bề rộng mỗi đoạn = trọng số, phần tô đậm = điểm × trọng số
      var segs = [['chuyenMon', 'Chuyên môn'], ['lichSu', 'Lịch sử'], ['hieuQua', 'Hiệu quả'],
                  ['khoiLuong', 'Khối lượng'], ['sanSang', 'Sẵn sàng']];
      body += '<div><div class="contrib">' + segs.map(function (s) {
        var p = dt[s[0]] || { diem: 0, trongSo: 0, gopPhan: 0 };
        return '<div class="seg" style="width:' + (p.trongSo * 100) + '%" title="' + esc(s[1]) +
          ': ' + n2(p.diem) + ' × ' + n2(p.trongSo) + ' = ' + n1(p.gopPhan) + ' điểm">' +
          '<i style="width:' + (clamp01(p.diem) * 100) + '%"></i></div>';
      }).join('') + '</div>' +
        '<div class="contrib-key">' + segs.map(function (s) {
          var p = dt[s[0]] || { gopPhan: 0 };
          return '<span><i></i>' + esc(s[1]) + ' <b class="mono">' + n1(p.gopPhan) + '</b></span>';
        }).join('') + '</div></div>';

      body += '<div class="parts">' + segs.map(function (s, k) {
        var p = dt[s[0]] || { diem: 0, trongSo: 0 };
        return '<div class="part"><div class="pk"><span>S' + (k + 1) + ' ' + esc(s[1]) + '</span><b>' + n2(p.diem) + '</b></div>' +
          '<div class="pt"><div class="pf" style="width:' + (clamp01(p.diem) * 100) + '%"></div></div>' +
          '<div class="pw">trọng số ' + n2(p.trongSo) + '</div></div>';
      }).join('') + '</div>';

      body += '<ul class="reasons">' + (u.lyDo || []).map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>';

      body += '<div class="cand-foot">' +
        '<button class="btn btn-sm btn-ghost" data-cachtinh="' + idx + '">Xem cách tính điểm</button>' +
        '<span class="spacer"></span>' +
        '<button class="btn btn-sm btn-primary" data-chon="' + idx + '">Chọn ' + esc(u.fullname.split(' ').pop()) + '</button></div>';

      body += '<div id="ct-' + idx + '" hidden>' + veCachTinh(u, cf) + '</div>';
      body += '</div>';
    });

    var chan = '<button class="btn" data-them>Xem thêm 5 người</button>' +
      '<button class="btn btn-ghost" data-dong>Bỏ qua, chọn thủ công</button>' +
      '<span class="spacer"></span>' +
      '<span class="note">Gợi ý dựa trên dữ liệu lịch sử trên hệ thống. Quyết định phân công thuộc về người giao nhiệm vụ.</span>';

    moDlg('🤖 Gợi ý người thực hiện phù hợp',
      'Top ' + kq.ungVien.length + ' ứng viên · thang điểm 0–100 · <span class="spec">POST /api/v1/ai/goi-y-nguoi-thuc-hien</span>',
      body, chan);
  }

  /** Bảng "vì sao người này" — thứ cần có khi bị hỏi vặn lúc bảo vệ */
  function veCachTinh(u, cf) {
    var d = u.diemThanhPhan, s = u.soLieu || {};
    var t =
      'S1 chuyên môn   = min(1, ' + (s.soNvHoanThanhLinhVuc || 0) + ' / ' + cf.nguong_chuyen_mon + ')' +
      '                       = <b>' + n2(d.chuyenMon.diem) + '</b>\n' +
      'S2 lịch sử      = ln(1+' + (s.soNvHoanThanh || 0) + ') / ln(1+' + cf.nguong_lich_su + ')' +
      '                    = <b>' + n2(d.lichSu.diem) + '</b>\n' +
      'S3 hiệu quả     = (' + (s.soNvDungHan || 0) + ' + ' + cf.alpha + '×' + n2(cf.p0) + ') / (' + (s.soNvHoanThanh || 0) + ' + ' + cf.alpha + ')' +
      ' − phạt      = <b>' + n2(d.hieuQua.diem) + '</b>\n' +
      'S4 khối lượng   = 1 − tải ' + n1(s.taiTrongSo || 0) + ' / K ' + (s.K || 8) +
      '                        = <b>' + n2(d.khoiLuong.diem) + '</b>\n' +
      'S5 sẵn sàng     = 1 − min(1, ' + (s.soNvQuaHan || 0) + ' / 3)' +
      '                          = <b>' + n2(d.sanSang.diem) + '</b>\n' +
      '\n' +
      'ĐIỂM = 100 × (' +
      n2(cf.w1) + '×' + n2(d.chuyenMon.diem) + ' + ' + n2(cf.w2) + '×' + n2(d.lichSu.diem) + ' + ' +
      n2(cf.w3) + '×' + n2(d.hieuQua.diem) + ' + ' + n2(cf.w4) + '×' + n2(d.khoiLuong.diem) + ' + ' +
      n2(cf.w5) + '×' + n2(d.sanSang.diem) + ')\n' +
      '     = <b>' + n1(u.diemTong) + '</b>';
    return '<div class="formula" style="margin-top:8px">' + t + '</div>';
  }

  /** M09 — Xử lý nhiệm vụ, 3 chế độ dùng chung một form */
  function moXuLy(idnv, che) {
    var nv = nhiemVu(idnv);
    veRibbon(che === 'BAOCAO' ? 5 : che === 'TUCHOI' ? 3 : 4);
    var tieu = che === 'TIENDO' ? 'Cập nhật tiến độ' : che === 'BAOCAO' ? 'Gửi báo cáo kết quả' : 'Từ chối nhiệm vụ';
    var b = '<div class="field" style="margin-bottom:12px"><label>Nội dung nhiệm vụ</label>' +
      '<div>' + esc(nv.noidung) + '</div>' +
      '<div class="meta">' + esc(tenLinhVuc(nv.linhvuc)) + ' · hạn ' + dinhDang(nv.hanxulyth) + ' · giao bởi ' + esc(tenUser(nv.userIdGiaoViec)) + '</div></div>';

    if (che !== 'TUCHOI') {
      b += '<div class="field" style="margin-bottom:12px"><label>Mức độ hoàn thành (%) — bắt buộc 0–100</label>' +
        '<input type="number" id="f-muc" min="0" max="100" step="1" value="' + (nv.mucdoht || 0) + '"></div>';
    }
    if (che === 'BAOCAO') {
      var hl = Flow.trangThaiHopLe(nv, today());
      var cl = conLai(nv);
      b += '<div class="field" style="margin-bottom:12px"><label>Kết quả xử lý</label>' +
        '<select id="f-tt">' + hl.map(function (t) {
          return '<option value="' + t.ma + '">' + esc(t.nhan) + ' (' + t.ma + ')</option>';
        }).join('') + '</select>' +
        '<div class="note">Danh sách đã lọc theo hạn: nhiệm vụ ' +
        (cl != null && cl < 0 ? '<b>quá hạn</b> nên chỉ chọn được 5 / 7 / 3' : '<b>còn hạn</b> nên chỉ chọn được 1 / 2 / 3') +
        ' (§1.2 bước 5). Máy chủ kiểm lại danh sách này một lần nữa.</div></div>';
    }
    b += '<div class="field"><label>' + (che === 'TUCHOI' ? 'Lý do từ chối' : 'Nội dung xử lý') +
      (che !== 'TIENDO' ? ' <span style="color:var(--st-bad)">*</span>' : '') + '</label>' +
      '<textarea id="f-nd" maxlength="2000" placeholder="' +
      (che === 'TUCHOI' ? 'Bắt buộc — hệ gốc không bắt buộc, đây là ràng buộc mới (§10.7)' : 'Mô tả công việc đã làm…') + '"></textarea></div>';

    var chan = '<button class="btn btn-primary" id="f-ok">' + tieu + '</button>' +
      '<button class="btn btn-ghost" data-dong>Huỷ</button>' +
      '<span class="spacer"></span><span class="note">' +
      (che === 'TIENDO' ? 'Không đổi trạng thái phản hồi — chỉ ghi thêm một dòng lịch sử (T6).'
        : che === 'BAOCAO' ? 'Sau khi gửi: <span class="spec">trangthaiDvXuly = 10</span> (Chờ xác nhận).'
        : 'Sau khi từ chối: <span class="spec">(6, 10)</span> — chờ người giao xử lý.') + '</span>';

    moDlg(tieu, 'M09 · ' + chipDuo(nv), b, chan, function () {
      $('#f-ok').onclick = function () {
        var nd = ($('#f-nd').value || '').trim();
        var muc = che === 'TUCHOI' ? null : Number($('#f-muc').value);
        var kq;
        if (che === 'TIENDO') kq = Flow.capNhatTienDo(S.db, nv, S.me.id, { mucdoht: muc, noidung: nd });
        else if (che === 'BAOCAO') kq = Flow.guiBaoCao(S.db, nv, S.me.id, { trangthai: Number($('#f-tt').value), noidung: nd, mucdoht: muc });
        else kq = Flow.tuChoi(S.db, nv, S.me.id, { lyDo: nd });
        xong(kq, tieu);
      };
    });
  }

      ô('Độ khẩn', nhãnKhẩn(nv.dokhan)) +
      ô('Ngày giao', '<span class="mono">' + dinhDang((nv.ngaygiao || '').slice(0, 10)) + '</span>') +
      ô('Ngày tiếp nhận', '<span class="mono">' + (nv.ngaytiepnhan ? dinhDang(nv.ngaytiepnhan.slice(0, 10)) : '— chưa tiếp nhận') + '</span>') +
      '</div>' +
      '<div class="field" style="margin-bottom:12px"><label>Nội dung</label><div>' + esc(nv.noidung) + '</div></div>';

    var tien = Metrics.tienDoTheoThoiGian(S.db, idnv);
    if (tien.length > 1) {
      b += '<section class="panel" style="margin-bottom:12px"><div class="panel-head"><h3>Đường tiến độ</h3>' +
        '<span class="sub">cải tiến so với hệ gốc: lưu vết mucdoht theo thời gian (§4.4)</span></div>' +
        '<div class="panel-body"><div class="bars">' + tien.map(function (p) {
          return '<div class="bar-row" title="' + esc(dinhDang(p.ngay)) + ': ' + p.mucdoht + '%">' +
            '<div class="mono" style="font-size:11px">' + dinhDang(p.ngay) + '</div>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + p.mucdoht + '%;background:var(--accent)"></div></div>' +
            '<div class="num">' + p.mucdoht + '%</div></div>';
        }).join('') + '</div></div></section>';
    }
    b += lịchSử(idnv);
    moDlg('Chi tiết nhiệm vụ', 'Bước ' + Flow.buocSoDo(nv) + ' / 7 của sơ đồ nghiệp vụ', b,
      '<button class="btn btn-ghost" data-dong>Đóng</button>');
  }

  function lịchSử(idnv) {
    var ds = S.db.xuly.filter(function (x) { return x.idCtnv === idnv; });
    var NH = { TIEPNHAN: 'Tiếp nhận', TIENDO: 'Cập nhật tiến độ', BAOCAO: 'Gửi báo cáo', TUCHOI: 'Từ chối', THUHOI_BC: 'Thu hồi báo cáo', NGHIEMTHU: 'Kiểm tra kết quả' };
    var h = '<section class="panel"><div class="panel-head"><h3>Lịch sử xử lý</h3><span class="sub">' + ds.length + ' lượt</span></div><div class="panel-body">';
    if (!ds.length) h += '<span class="note">Chưa có lịch sử.</span>';
    else {
      h += '<div class="timeline">' + ds.map(function (x) {
        return '<div class="tl k-' + esc(x.loai) + '"><div class="tl-head">' +
          '<span class="tl-kind">' + esc(NH[x.loai] || x.loai) + '</span>' +
          '<span class="tl-when">' + dinhDang((x.ngayxuly || '').slice(0, 10)) + '</span>' +
          '<span class="tl-who">' + esc(tenUser(x.useridXuly)) + '</span>' +
          (x.mucdoht != null ? '<span class="tl-when">' + x.mucdoht + '%</span>' : '') +
          (x.trangthaiDvXuly != null ? '<span class="tag c-' + lopB(x.trangthaiDvXuly) + ' solid">' + esc((dmB(x.trangthaiDvXuly) || {}).nhan) + '</span>' : '') +
          '</div>' + (x.noidung ? '<div class="tl-body">' + esc(x.noidung) + '</div>' : '') + '</div>';
      }).join('') + '</div>';
    }
    return h + '</div></section>';
  }

  /** Xử lý kết quả trả về của một hành động */
  function xong(kq, nhan) {
    if (!kq || !kq.ok) { toast('Không thực hiện được', (kq && kq.loi) || 'Lỗi không xác định', true); return; }
    dongDlg();
    toast(nhan, 'Trạng thái mới: ' + môTảTT(kq.nv));
    render();
  }
  function môTảTT(nv) {
    var b = dmB(nv.trangthaiDvXuly);
    return dmA(nv.trangthai).nhan + ' (' + nv.trangthai + ') · ' + (b ? b.nhan + ' (' + b.ma + ')' : 'chưa báo cáo');
  }

  /* ---------- Chọn người thủ công ---------- */
  function moChonTay(i) {
    var r = S.rows[i];
    var ds = S.db.users.filter(function (u) {
      return u.trangthai === 1 && u.vaitro === 'NGUOI_THUC_HIEN';
    });
    var b = '<div class="tbl-wrap"><table><thead><tr><th>Họ tên</th><th>Chức vụ</th><th>Đơn vị</th><th></th></tr></thead><tbody>' +
      ds.map(function (u) {
        var da = r.chuTri.some(function (x) { return x.id === u.id; });
        return '<tr><td>' + esc(u.fullname) + '</td><td>' + esc(u.chucvu) + '</td><td>' + esc(tenDonVi(u.unitcode)) + '</td>' +
          '<td class="acts"><button class="btn btn-sm" data-tay-chon="' + u.id + '"' + (da ? ' disabled' : '') + '>' +
          (da ? 'Đã chọn' : 'Chọn') + '</button></td></tr>';
      }).join('') + '</tbody></table></div>';
    moDlg('Chọn người chủ trì thủ công', 'Bỏ qua gợi ý — quyền quyết định vẫn thuộc người giao', b,
      '<button class="btn btn-ghost" data-dong>Đóng</button>', function (dlg) {
        $$('[data-tay-chon]', dlg).forEach(function (btn) {
          btn.onclick = function () {
            r.chuTri.push({ id: btn.dataset.tayChon, tuAi: false });
            if (S.aiCache && S.aiCache.kq) AiEngine.ghiLog(S.db, S.aiCache.kq, btn.dataset.tayChon);
            dongDlg(); render();
          };
        });
      });
  }

  /* =========================================================
     LƯU & GIAO NHIỆM VỤ (T1)
     ========================================================= */
  var demId = 0;
  function luuVaGiao() {
    var lỗi = kiểmTraLưới();
    if (lỗi) { toast('Chưa lưu được', lỗi, true); return; }
    var n = 0, tg = today() + 'T09:00';
    S.rows.forEach(function (r) {
      demId++;
      var id = 'nv-new-' + demId;
      S.db.nhiemvu.push({
        id: id, idvb: S.idvb, noidung: r.noidung.trim(), linhvuc: r.linhvuc, dokhan: r.dokhan,
        hanxulyth: r.hanxulyth, songayhxlth: null, hanxulyph: null,
        ngaygiao: tg, ngaytiepnhan: null, ngayhoanthanhthucte: null,
        trangthai: 3, trangthaiDvXuly: null, trangthaixulygiahan: null,   // §1.2 bước 2.4
        solangiahan: 0, mucdoht: 0, phanhoi: null, hsChatluong: null,
        userIdGiaoViec: S.me.id, useridcreate: S.me.id, unitcode: r.unitcode,
        createdate: tg, updatedate: tg, ai_goiy_id: r.goiyId || null
      });
      r.chuTri.forEach(function (u) {
        S.db.phancong.push({
          id: 'pc-new-' + (++demId), idnvchitiet: id, userid: u.id,
          unitcode: (user(u.id) || {}).unitcode, vaitro: 'CHUTRI',
          useridCreate: S.me.id, trangthai: 1, createdate: tg
        });
      });
      r.phoiHop.forEach(function (u) {
        S.db.phancong.push({
          id: 'pc-new-' + (++demId), idnvchitiet: id, userid: u.id,
          unitcode: (user(u.id) || {}).unitcode, vaitro: 'PHOIHOP',
          useridCreate: S.me.id, trangthai: 1, createdate: tg
        });
      });
      n++;
    });
    toast('Đã giao ' + n + ' nhiệm vụ', 'Trạng thái khởi tạo: Chưa triển khai (3) · trangthaiDvXuly = null');
    S.rows = [dòngMới(vanBan(S.idvb))];
    veRibbon(3);
    render();
  }

  /* =========================================================
     KỊCH BẢN DEMO — chạy trọn một vòng nghiệp vụ
     ========================================================= */
  function kichBan() {
    // Tìm một nhiệm vụ đang ở (3, null) để chạy trọn vòng
    var nv = S.db.nhiemvu.filter(function (x) {
      return x.trangthai === 3 && x.trangthaiDvXuly == null && pcCua(x.id, 'CHUTRI').length;
    })[0];
    if (!nv) { toast('Không tìm được nhiệm vụ phù hợp', 'Cần một nhiệm vụ ở trạng thái (3, null).', true); return; }

    var chuTri = pcCua(nv.id, 'CHUTRI')[0].userid;
    var nguoiGiao = nv.userIdGiaoViec;
    var buoc = [
      ['Tiếp nhận', chuTri, 3, function () { return Flow.tiepNhan(S.db, nv, chuTri, {}); }],
      ['Cập nhật tiến độ 45%', chuTri, 4, function () { return Flow.capNhatTienDo(S.db, nv, chuTri, { mucdoht: 45, noidung: 'Đã rà soát hiện trạng và dựng đề cương báo cáo.' }); }],
      ['Gửi báo cáo kết quả', chuTri, 5, function () {
        var hl = Flow.trangThaiHopLe(nv, today());
        return Flow.guiBaoCao(S.db, nv, chuTri, { trangthai: hl[0].ma, noidung: 'Hoàn thành nội dung được giao, kèm báo cáo tổng hợp.', mucdoht: 100 });
      }],
      ['Kiểm tra: CHƯA ĐẠT', nguoiGiao, 6, function () { return Flow.nghiemThu(S.db, nv, nguoiGiao, { ketQua: 'CHUA_DAT', phanHoi: 'Thiếu số liệu quý III, đề nghị bổ sung phụ lục.' }); }],
      ['Báo cáo lại sau bổ sung', chuTri, 5, function () {
        var hl = Flow.trangThaiHopLe(nv, today());
        return Flow.guiBaoCao(S.db, nv, chuTri, { trangthai: hl[0].ma, noidung: 'Đã bổ sung phụ lục số liệu quý III theo yêu cầu.', mucdoht: 100 });
      }],
      ['Kiểm tra: ĐẠT', nguoiGiao, 7, function () { return Flow.nghiemThu(S.db, nv, nguoiGiao, { ketQua: 'DAT', phanHoi: 'Kết quả đạt yêu cầu, đồng ý nghiệm thu.' }); }]
    ];

    S.man = 'cua-toi';
    var i = 0;
    (function chay() {
      if (i >= buoc.length) {
        toast('Xong một vòng nghiệp vụ', 'Nhiệm vụ đã đi hết sơ đồ, gồm cả nhánh "Chưa đạt → làm lại".');
        S.me = user(nguoiGiao); $('#sel-user').value = S.me.id; render();
        return;
      }
      var b = buoc[i++];
      S.me = user(b[1]);
      $('#sel-user').value = S.me.id;
      veRibbon(b[2], b[0].indexOf('CHƯA ĐẠT') >= 0);
      var kq = b[3]();
      if (!kq || !kq.ok) { toast('Kịch bản dừng ở bước "' + b[0] + '"', (kq && kq.loi) || '', true); render(); return; }
      toast('Bước ' + i + '/' + buoc.length + ': ' + b[0], nhãnVai(S.me.vaitro) + ' · ' + môTảTT(nv));
      $('#view').innerHTML = MAN['cua-toi'].ve();
      ganSuKien(); capNhatDem();
      setTimeout(chay, 1250);
    })();
  }

  /* =========================================================
     GẮN SỰ KIỆN
     ========================================================= */
  function ganSuKien() {
    var v = $('#view');

    $$('[data-di]', v).forEach(function (b) { b.onclick = function () { di(b.dataset.di); }; });
    $$('[data-chip]', v).forEach(function (b) { b.onclick = function () { S.chip = b.dataset.chip; render(); }; });
    $$('[data-pc]', v).forEach(function (b) {
      b.onclick = function () { S.idvb = b.dataset.pc; S.rows = []; di('phan-cong'); };
    });

    var selVb = $('#sel-vb', v);
    if (selVb) selVb.onchange = function () { S.idvb = selVb.value; S.rows = []; render(); };

    // Lưới phân công
    $$('[data-r]', v).forEach(function (el) {
      var i = Number(el.dataset.r), f = el.dataset.f;
      el.oninput = el.onchange = function () {
        S.rows[i][f] = el.value;
        if (f === 'linhvuc') {
          // Đổi lĩnh vực thì phạm vi đơn vị đi theo, để gợi ý luôn hỏi đúng nơi làm việc đó
          S.rows[i].unitcode = donViPhuTrach(el.value);
          render();
          return;
        }
        var btn = $('#btn-luu');
        if (btn) btn.disabled = !!kiểmTraLưới();
      };
    });
    var them = $('#btn-them-dong', v);
    if (them) them.onclick = function () { S.rows.push(dòngMới(vanBan(S.idvb))); render(); };
    $$('[data-xoa]', v).forEach(function (b) {
      b.onclick = function () { S.rows.splice(Number(b.dataset.xoa), 1); render(); };
    });
    $$('[data-bo]', v).forEach(function (b) {
      b.onclick = function () {
        var p = b.dataset.bo.split(':');
        var r = S.rows[Number(p[0])];
        r.chuTri = r.chuTri.filter(function (u) { return u.id !== p[1]; });
        render();
      };
    });
    $$('[data-ai]', v).forEach(function (b) { b.onclick = function () { moGoiY(Number(b.dataset.ai)); }; });
    $$('[data-tay]', v).forEach(function (b) { b.onclick = function () { moChonTay(Number(b.dataset.tay)); }; });
    var luu = $('#btn-luu', v);
    if (luu) luu.onclick = luuVaGiao;

    // Hành động trên nhiệm vụ
    $$('[data-tn]', v).forEach(function (b) {
      b.onclick = function () {
        var nv = nhiemVu(b.dataset.tn);
        veRibbon(3);
        xong(Flow.tiepNhan(S.db, nv, S.me.id, {}), 'Đã tiếp nhận nhiệm vụ');
      };
    });
    $$('[data-xl]', v).forEach(function (b) {
      b.onclick = function () { var p = b.dataset.xl.split(':'); moXuLy(p[0], p[1]); };
    });
    $$('[data-thbc]', v).forEach(function (b) {
      b.onclick = function () {
        xong(Flow.thuHoiBaoCao(S.db, nhiemVu(b.dataset.thbc), S.me.id, {}), 'Đã thu hồi báo cáo');
      };
    });
    $$('[data-kt]', v).forEach(function (b) { b.onclick = function () { moKiemTra(b.dataset.kt); }; });
    $$('[data-gh]', v).forEach(function (b) { b.onclick = function () { moGiaHan(b.dataset.gh, false); }; });
    $$('[data-dgh]', v).forEach(function (b) { b.onclick = function () { moGiaHan(b.dataset.dgh, true); }; });
    $$('[data-ct]', v).forEach(function (b) { b.onclick = function () { moChiTiet(b.dataset.ct); }; });

    // Trọng số
    $$('[data-w]', v).forEach(function (el) {
      el.oninput = function () { AiEngine.CAU_HINH[el.dataset.w] = Number(el.value); render(); };
    });
    var rw = $('#btn-reset-w', v);
    if (rw) rw.onclick = function () {
      var c = AiEngine.CAU_HINH;
      c.w1 = 0.30; c.w2 = 0.20; c.w3 = 0.25; c.w4 = 0.20; c.w5 = 0.05;
      render(); toast('Đã khôi phục trọng số gốc');
    };

    // So sánh baseline
    var bl = $('#btn-baseline', v);
    if (bl) bl.onclick = function () {
      bl.disabled = true; bl.textContent = 'Đang chạy…';
      setTimeout(function () {
        var kq = Metrics.soSanhBaseline(S.db, 60);
        var box = $('#baseline');
        if (!kq || !kq.length) { box.innerHTML = '<div class="empty">Không đủ dữ liệu lịch sử để so sánh.</div>'; return; }
        var max = Math.max.apply(null, kq.map(function (r) { return r.precision3; }).concat([0.01]));
        box.innerHTML = '<div class="bars">' + kq.map(function (r) {
          var la = r.chienLuoc === 'MO_HINH';
          return '<div class="bar-row" title="' + esc(r.ten) + ': Precision@3 = ' + n2(r.precision3) + '">' +
            '<div>' + (la ? '<b>' + esc(r.ten) + '</b>' : esc(r.ten)) + '</div>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + (r.precision3 / max * 100) + '%;background:' +
            (la ? 'var(--accent)' : 'var(--st-mute)') + '"></div></div>' +
            '<div class="num">' + n2(r.precision3) + '</div></div>';
        }).join('') + '</div>' +
          '<p class="note" style="margin-top:9px">Precision@3 trên ' + (kq[0].soMau || 60) +
          ' nhiệm vụ lịch sử. Mỗi lần chấm chỉ dùng dữ liệu phát sinh <b>trước</b> ngày giao của nhiệm vụ đó, nên không có rò rỉ dữ liệu tương lai.</p>';
      }, 30);
    };
  }

  /* Sự kiện trong hộp thoại AI (uỷ quyền vì nội dung thay đổi liên tục) */
  $('#dlg').addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-chon],[data-them],[data-cachtinh]') : null;
    if (!t) return;
    if (t.hasAttribute('data-cachtinh')) {
      var box = $('#ct-' + t.dataset.cachtinh);
      box.hidden = !box.hidden;
      t.textContent = box.hidden ? 'Xem cách tính điểm' : 'Ẩn cách tính';
      return;
    }
    if (t.hasAttribute('data-them')) { moGoiY(S.aiCache.i, (S.aiCache.req.soLuong || 5) + 5); return; }
    if (t.hasAttribute('data-chon')) {
      var c = S.aiCache, u = c.kq.ungVien[Number(t.dataset.chon)];
      var r = S.rows[c.i];
      if (!r.chuTri.some(function (x) { return x.id === u.userid; })) {
        r.chuTri.push({ id: u.userid, tuAi: true });
      }
      AiEngine.ghiLog(S.db, c.kq, u.userid);
      r.goiyId = c.kq.goiyId;
      dongDlg();
      toast('Đã chọn ' + u.fullname, 'Hạng ' + (Number(t.dataset.chon) + 1) + ' · ' + n1(u.diemTong) + ' điểm — đã ghi vào nhật ký gợi ý');
      render();
    }
  });

  /* =========================================================
     KHỞI ĐỘNG
     ========================================================= */
  function boot() {
    var thieu = ['SeedData', 'Flow', 'AiEngine', 'Metrics'].filter(function (m) { return !window[m]; });
    if (thieu.length) {
      document.getElementById('view').innerHTML =
        '<div class="empty">Thiếu module: ' + thieu.join(', ') + '</div>';
      return;
    }
    var homNay = new Date().toISOString().slice(0, 10);
    S.db = SeedData.taoDuLieuMau(homNay);
    if (SeedData.tuKiemTra) {
      var cb = SeedData.tuKiemTra(S.db);
      if (cb && cb.length) console.warn('Cảnh báo dữ liệu mẫu:', cb);
    }

    // Người giao đầu tiên làm tài khoản mặc định
    var mac = S.db.users.filter(function (u) { return u.vaitro === 'NGUOI_GIAO'; })[0] || S.db.users[0];
    S.me = mac;

    var sel = $('#sel-user');
    var nhom = { NGUOI_GIAO: 'Người giao', NGUOI_THUC_HIEN: 'Người thực hiện', QUAN_TRI: 'Quản trị' };
    ['NGUOI_GIAO', 'NGUOI_THUC_HIEN', 'QUAN_TRI'].forEach(function (v) {
      var us = S.db.users.filter(function (u) { return u.vaitro === v && u.trangthai === 1; });
      if (!us.length) return;
      var og = document.createElement('optgroup');
      og.label = nhom[v];
      us.forEach(function (u) {
        var o = document.createElement('option');
        o.value = u.id;
        o.textContent = u.fullname + ' — ' + (u.chucvu || '') + ', ' + tenDonVi(u.unitcode);
        og.appendChild(o);
      });
      sel.appendChild(og);
    });
    sel.value = S.me.id;
    sel.onchange = function () { S.me = user(sel.value); S.rows = []; render(); };

    $('#btn-kich-ban').onclick = kichBan;
    $('#btn-job').onclick = function () {
      var n = Flow.jobCapNhatQuaHan(S.db);
      toast('Job cập nhật quá hạn', n ? 'Đã chuyển ' + n + ' nhiệm vụ sang trạng thái 7 (Đang triển khai – Đã hết hạn).' : 'Không có nhiệm vụ nào cần chuyển.');
      render();
    };
    $$('.nav-item').forEach(function (b) { b.onclick = function () { di(b.dataset.man); }; });

    render();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
