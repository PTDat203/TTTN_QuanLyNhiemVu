    // bam "Duyet gia han" va ham duyetGiaHan se gan lai truc A => hoi sinh diem cuoi.
    var dsGh = mang(db, 'giahan');
    for (var i = 0; i < dsGh.length; i++) {
      if (dsGh[i].idCtnv !== n.id) continue;
      if (Number(dsGh[i].trangThai) !== 10) continue;
      dsGh[i].trangThai = 12;
      dsGh[i].phanhoi = 'Nhiệm vụ đã bị thu hồi, đề xuất gia hạn không còn hiệu lực.';
      dsGh[i].useridDuyet = userid;
      dsGh[i].ngayduyet = homNay(db);
      if (soHoacNull(n.trangthaixulygiahan) === 10) n.trangthaixulygiahan = 12;
    }

    danhDauSua(db, n);
    ghiXuLy(db, n, userid, 'THUHOI_NV', {
      noidung: chuoiSach(p.lyDo) || 'Người giao thu hồi nhiệm vụ.',
      trangthai: 97,
      trangthaiDvXuly: null
    });
    return ok(n);
  }

  /** Nhac viec (§1.3) — CHI ghi lich su, KHONG doi trang thai, khong dinh kem tep. */
  function nhacViec(db, nv, userid, payload) {
    var c = chuanBi(db, nv, userid, 'nhacViec', 'nhắc việc');
    if (c.loi) return c.loi;
    var n = c.n, p = payload || {};

    var e = kiemNoiDung(p.noidung, true, 'nội dung nhắc việc');
    if (e) return loi(e);

    // §1.3 + §10.8: he goc khong doi trang thai, khong dem so lan nhac.
    ghiXuLy(db, n, userid, 'NHACVIEC', { noidung: chuoiSach(p.noidung) });
    return ok(n);
  }

  /* -------------------------------------------------------------------
   * 9. Flow.jobCapNhatQuaHan — job I5 (§5.9 I5, §2.5)
   * ----------------------------------------------------------------- */
  function jobCapNhatQuaHan(db) {
    if (!db) return 0;
    baoDamBoDem(db);
    var ngay = homNay(db);
    var ds = (Array.isArray(db.nhiemvu)) ? db.nhiemvu : [];
    var dem = 0;
    for (var i = 0; i < ds.length; i++) {
      var n = ds[i];
      var tt = soHoacNull(n.trangthai);
      if (tt !== 2 && tt !== 3) continue;      // §2.5: chi ap cho 2 va 3
      if (!quaHan(n, ngay)) continue;          // hanxulyth < hom nay
      n.trangthai = 7;
      n.updatedate = ngay;
      dem++;
    }
    return dem;
  }

  /* -------------------------------------------------------------------
   * 10. Flow.diemCuoi — §2.6
   *     CHU Y: (1|5,10), (1|5,12), (6,12) KHONG phai diem cuoi.
   * ----------------------------------------------------------------- */
  function diemCuoi(nv) {
    if (!nv) return null;
    var tt = soHoacNull(nv.trangthai);
    var dv = soHoacNull(nv.trangthaiDvXuly);
    if (trong([1, 5], tt) && dv === 11) return 'HOAN_THANH_NGHIEM_THU';
    if (tt === 97) return 'DA_THU_HOI';
    return null;
  }

  /* -------------------------------------------------------------------
   * 11. Flow.MA_TRAN_CHUYEN — bang §2.4 dang du lieu (14 dong T1..T14)
   * ----------------------------------------------------------------- */
  var MA_TRAN_CHUYEN = [
    { ma: 'T1',  tu: '—',                       hanhDong: 'Tạo & giao nhiệm vụ',              vai: 'Người giao',      den: '(3, null)',                       moi: false,
      ghiChu: '§1.2 bước 2 — trạng thái khởi tạo do server đặt = 3 (hệ gốc không gán ở FE, §10.4).' },
    { ma: 'T2',  tu: '(3, null)',                hanhDong: 'Tiếp nhận',                        vai: 'Người thực hiện', den: '(2, null) + ngaytiepnhan',        moi: true,
      ghiChu: '§10.3 — hệ gốc KHÔNG có nút, API hay trạng thái tiếp nhận. Thiết kế hoàn toàn mới.' },
    { ma: 'T3',  tu: '(3, null) hoặc (2, null)', hanhDong: 'Từ chối nhiệm vụ',                 vai: 'Người thực hiện', den: '(6, 10)',                         moi: false,
      ghiChu: '§10.7 — bắt buộc nhập lý do là yêu cầu MỚI, hệ gốc không bắt buộc.' },
    { ma: 'T4',  tu: '(6, 10)',                  hanhDong: 'Xử lý từ chối: Chấp nhận',         vai: 'Người giao',      den: '(97, null)',                      moi: false,
      ghiChu: '§2.6 — điểm cuối "Đã thu hồi".' },
    { ma: 'T5',  tu: '(6, 10)',                  hanhDong: 'Xử lý từ chối: Bác bỏ',            vai: 'Người giao',      den: '(2, 12)',                         moi: false,
      ghiChu: '§2.6 — (6,12) KHÔNG phải điểm cuối, người thực hiện làm lại.' },
    { ma: 'T6',  tu: '(2|7, null|12)',           hanhDong: 'Cập nhật tiến độ',                 vai: 'Người thực hiện', den: 'không đổi trạng thái',            moi: false,
      ghiChu: '§10.2 — validate mucdoht 0–100 là yêu cầu MỚI; §6.2 dòng 11 cho phép cả trạng thái 3.' },
    { ma: 'T7',  tu: '(2|3|7, null|12)',         hanhDong: 'Gửi báo cáo kết quả',              vai: 'Người thực hiện', den: '(giá trị đã chọn, 10)',           moi: false,
      ghiChu: '§5.4 D4 — server validate lại giá trị theo bộ lọc hạn (§1.2 bước 5).' },
    { ma: 'T8',  tu: '(1|5, 10)',                hanhDong: 'Thu hồi báo cáo',                  vai: 'Người thực hiện', den: '(2 nếu còn hạn / 7 nếu quá hạn, null)', moi: false,
      ghiChu: '§2.6 — (1|5,10) KHÔNG phải điểm cuối vì còn thu hồi được.' },
    { ma: 'T9',  tu: '(1|5, 10)',                hanhDong: 'Kiểm tra kết quả: ĐẠT',            vai: 'Người giao',      den: '(giữ nguyên, 11) → ĐIỂM CUỐI',    moi: false,
      ghiChu: '§1.2 bước 7 — mọi hành động tắt, chỉ còn xem chi tiết.' },

    { ma: 'T11', tu: '(2|3|7, *), giahan ≠ 10, solangiahan < 2', hanhDong: 'Xin gia hạn',      vai: 'Người thực hiện', den: 'trangthai := 13, trangthaixulygiahan := 10', moi: false,

    { ma: 'T12', tu: 'trangthaixulygiahan = 10', hanhDong: 'Duyệt gia hạn',                    vai: 'Người giao',      den: 'trangthaixulygiahan := 11, solangiahan += 1, cập nhật hanxulyth', moi: false,

    { ma: 'T14', tu: 'trangthai ∉ {1,5,97}',     hanhDong: 'Thu hồi nhiệm vụ',                 vai: 'Người giao',      den: '(97, null) → ĐIỂM CUỐI',          moi: false,

  ];

   * 12. Flow.buocSoDo — chi so buoc 1..7 trong so do §1
   * ----------------------------------------------------------------- */
  var SO_DO_BUOC = [
    { so: 1, ten: 'Tạo nhiệm vụ' },
    { so: 2, ten: 'Giao nhiệm vụ' },
    { so: 3, ten: 'Tiếp nhận' },
    { so: 4, ten: 'Thực hiện & cập nhật tiến độ' },
    { so: 5, ten: 'Gửi báo cáo kết quả' },
    { so: 6, ten: 'Kiểm tra kết quả' },
    { so: 7, ten: 'Hoàn thành' }
  ];

  function buocSoDo(nv) {
    if (!nv) return 1;                                   // chua co ban ghi => dang tao
    var tt = soHoacNull(nv.trangthai);
    var dv = soHoacNull(nv.trangthaiDvXuly);

    if (trong([1, 5], tt) && dv === 11) return 7;        // §2.6 — Hoan thanh, da nghiem thu
    if (tt === 97) return 2;                             // Da thu hoi: dung lai o khau Giao
    if (tt === 6) return 3;                              // Tu choi: van thuoc khau Tiep nhan
    if (dv === 10) return 6;                             // Da gui bao cao => dang Kiem tra
    if (tt === 3) return 3;                              // Da giao, cho tiep nhan
    if (trong([2, 7, 13], tt)) return 4;                 // Dang thuc hien (ke ca dang xin gia han)
    if (trong([1, 5], tt)) return 5;                     // Da bao cao nhung dv = null|12 => quay lai khau Bao cao
    return 2;
  }

  /* -------------------------------------------------------------------
   * 13. Xuat window.Flow
   * ----------------------------------------------------------------- */
  window.Flow = {
    PHIEN_BAN: PHIEN_BAN,
    CAU_HINH: CAU_HINH,

    // §2, §7.4 — danh muc seed
    DM: DM,
    timDm: timDm,
    nhanTrangThai: nhanTrangThai,
    nhanPhanHoi: nhanPhanHoi,
    nhanGiaHan: nhanGiaHan,
    nhanDoKhan: nhanDoKhan,
    nhanLoaiXuLy: nhanLoaiXuLy,
    mauTrangThai: mauTrangThai,

    // tien ich ngay
    Ngay: Ngay,

    // phan quyen §6.2
    vaiTroTrenNhiemVu: vaiTroTrenNhiemVu,
    quyen: quyen,
    HANH_DONG: HANH_DONG,
    dsHanhDongChoPhep: dsHanhDongChoPhep,

    // §5.4 D5 — bo loc trang thai theo han
    trangThaiHopLe: trangThaiHopLe,

    // hanh dong T2..T14
    tiepNhan: tiepNhan,
    tuChoi: tuChoi,

    thuHoiNhiemVu: thuHoiNhiemVu,
    nhacViec: nhacViec,

    // job nen + trang thai tong hop
    jobCapNhatQuaHan: jobCapNhatQuaHan,
    diemCuoi: diemCuoi,

    // du lieu cho UI ve so do
    MA_TRAN_CHUYEN: MA_TRAN_CHUYEN,
    SO_DO_BUOC: SO_DO_BUOC,
    buocSoDo: buocSoDo,

    // tien ich id
    taoId: taoId,
    dongBoBoDem: dongBoBoDem
  };
})();

<script>

(function () {
  'use strict';

  /* ==========================================================================
   * 0. HANG SO NGHIEP VU (§2 — tuyet doi khong doi so)
   * ========================================================================*/
  var TT_HOAN_THANH_TRONG_HAN = 1;   // §2.1 truc A: Hoan thanh (con han)
  var TT_HOAN_THANH_SAU_HAN = 5;     // §2.1 truc A: Hoan thanh - Sau han
  var TT_QUA_HAN = 7;                // §2.1 truc A: Dang trien khai - Da het han
  var TT_THU_HOI = 97;               // §2.1 truc A: Da thu hoi
  var DV_DA_XAC_NHAN = 11;           // §2.2 truc B: Da xac nhan (DAT)
  var DV_TU_CHOI = 12;               // §2.2 truc B: Tu choi (CHUA DAT)

  // §9.4 S5: mau so co dinh 3 trong cong thuc S5 = 1 - min(1, q/3)
  var NGUONG_QUA_HAN_S5 = 3;
  // §9.4 "He so tin cay": (so_nv_hoanthanh_tong / 10) x 0,6 — hang so 10 la co dinh
  var CHIA_DO_TIN_CAY = 10;
  // §9.5 dong cuoi: che do khoi tao chi xep theo S1 va S4 voi w = 0,6 / 0,4
  var TS_KHOI_TAO_S1 = 0.6;
  var TS_KHOI_TAO_S4 = 0.4;
  // §9.4 S4: mac dinh K khi user khong khai max_concurrent_tasks (§4.7)
  var K_MAC_DINH = 8;
  // §9.6: toi da 4 dong ly do (§9.7 "Toi da 4 dong ly do")
  var SO_DONG_LY_DO_TOI_DA = 4;
  // §9.6 request.soLuong mac dinh
  var SO_LUONG_MAC_DINH = 5;
  // §4.8 AI_GOIY_LOG.co_trong_goi_y: "nguoi duoc chon co nam trong TOP-5 khong" — moc CO DINH
  var TOP_LOG = 5;

  /* ==========================================================================
   * 1. TIEN ICH THUAN
   * ========================================================================*/

  function clamp(x, thap, cao) {
    if (typeof x !== 'number' || !isFinite(x)) return thap;
    return x < thap ? thap : (x > cao ? cao : x);
  }

  function lamTron(x, soChuSo) {
    var he = Math.pow(10, soChuSo || 0);
    return Math.round((Number(x) || 0) * he) / he;
  }

  // Dinh dang so kieu Viet Nam: dau phay thap phan (vi du 2,0)
  function soVN(x, soChuSo) {
    return lamTron(x, soChuSo).toFixed(soChuSo || 0).replace('.', ',');
  }

  function laMang(v) {
    if (v === null || v === undefined) return [];
    return Array.isArray(v) ? v : [v];
  }

  function daNghiemThu(nv) {
    // §2.6 Diem cuoi "Hoan thanh - da nghiem thu": trangthai IN (1,5) VA trangthaiDvXuly = 11
    return (nv.trangthai === TT_HOAN_THANH_TRONG_HAN || nv.trangthai === TT_HOAN_THANH_SAU_HAN) &&
           nv.trangthaiDvXuly === DV_DA_XAC_NHAN;
  }

  function dangGiuViec(nv) {
    // §4.8 view USER_TAI_HIENTAI: nv.trangthai NOT IN (1, 5, 97)
    return nv.trangthai !== TT_HOAN_THANH_TRONG_HAN &&
           nv.trangthai !== TT_HOAN_THANH_SAU_HAN &&
           nv.trangthai !== TT_THU_HOI;
  }

  function coVaiTro(user, ma) {
    // §4.7: app moi dung 1 truc `vaitro`. Ho tro ca chuoi lan mang cho chac.
    var v = user && user.vaitro;
    if (!v) return false;
    if (Array.isArray(v)) return v.indexOf(ma) >= 0;
    return String(v).indexOf(ma) >= 0;
  }

  /* --- PRNG co seed (mulberry32) — KHONG dung Math.random de tai lap duoc --- */
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var _rngId = mulberry32(20260905); // seed = ngay "hom nay" cua demo
  var _demId = 0;
  function taoId(tienTo) {
    _demId += 1;
    var r = Math.floor(_rngId() * 0xFFFFFFFF).toString(16);
    while (r.length < 8) r = '0' + r;
    return tienTo + '-' + _demId + '-' + r;
  }

  /* ==========================================================================
   * 2. DOI TUONG XUAT + CAU HINH (§9.2 bang trong so, §5.8 API H4)
   * ========================================================================*/
  var API = {};

  // H4: bo cau hinh SUA DUOC luc chay (man H4 gan thang vao AiEngine.CAU_HINH).
  API.CAU_HINH = {
    w1: 0.30,   // §9.2 S1 Chuyen mon
    w2: 0.20,   // §9.2 S2 Lich su thuc hien
    w3: 0.25,   // §9.2 S3 Hieu qua cong viec
    w4: 0.20,   // §9.2 S4 Khoi luong hien tai
    w5: 0.05,   // §9.2 S5 Tinh san sang
    nguong_chuyen_mon: 5,   // §9.4 S1: min(1, n/5)
    nguong_lich_su: 10,     // §9.4 S2: ln(1+N)/ln(1+10)
    p0: 0.70,               // §9.4 S3: tien nghiem toan he thong
    alpha: 5,               // §9.4 S3: so "quan sat ao" (lam muot Laplace)
    phat_tralai: 0.30,      // §9.4 S3: he so phat bi tra lai
    phat_giahan: 0.15,      // §9.4 S3: he so phat gia han
    he_so_qua_tai: 1.5,     // §9.3 dieu 6: tai >= K x 1,5 => nhan "Qua tai"
    trong_so_dokhan: { DOTXUAT: 2.0, TRONGTAM: 1.5, THUONGXUYEN: 1.0 }, // §9.4 S4
    phien_ban: 'v1.0'       // §4.8 AI_GOIY_LOG.phien_ban_trongso
  };

  // Doc cau hinh qua API de man H4 co the GAN LAI ca object (AiEngine.CAU_HINH = {...})
  function cfg() { return API.CAU_HINH; }

  /* ==========================================================================
   * 3. CHI MUC TAM (chi de chay nhanh — khong ghi gi vao DB)
   *    Xay 1 lan cho moi lan goi goiY(): O(N + P + X). Voi 400 nhiem vu ~ <5ms.
   * ========================================================================*/
  function xayDungChiMuc(db) {
    var cm = {
      nvTheoId: Object.create(null),
      chuTriTheoUser: Object.create(null),  // userid -> [nhiemvu] (CHUTRI con hieu luc)
      phanCongTheoNv: Object.create(null),  // idnvchitiet -> [phancong con hieu luc]
      tuChoiTheoNv: Object.create(null),    // idnvchitiet -> { userid: true }
      soTraLaiTheoNv: Object.create(null),  // idnvchitiet -> so ban ghi xu ly CHUA DAT
      linhVucTheoMa: Object.create(null),
      donViTheoMa: Object.create(null),
      heThongCoNghiemThu: false             // §9.5 dong cuoi: toan he thong chua co du lieu?
    };
    var i, n, x, p, nv, ds;

    var dsNv = (db && db.nhiemvu) || [];
    for (i = 0; i < dsNv.length; i++) {
      nv = dsNv[i];
      cm.nvTheoId[nv.id] = nv;
      if (daNghiemThu(nv)) cm.heThongCoNghiemThu = true;
    }

    var dsLv = (db && db.linhvuc) || [];
    for (i = 0; i < dsLv.length; i++) cm.linhVucTheoMa[dsLv[i].ma] = dsLv[i];

    var dsDv = (db && db.donvi) || [];
    for (i = 0; i < dsDv.length; i++) cm.donViTheoMa[dsDv[i].unitcode] = dsDv[i];

    var dsPc = (db && db.phancong) || [];
    for (i = 0; i < dsPc.length; i++) {
      p = dsPc[i];
      if (p.trangthai !== 1) continue;               // §4.3: 1 = con hieu luc, 0 = da thu hoi
      ds = cm.phanCongTheoNv[p.idnvchitiet];
      if (!ds) { ds = []; cm.phanCongTheoNv[p.idnvchitiet] = ds; }
      ds.push(p);
      if (p.vaitro === 'CHUTRI') {
        nv = cm.nvTheoId[p.idnvchitiet];
        if (!nv) continue;
        ds = cm.chuTriTheoUser[p.userid];
        if (!ds) { ds = []; cm.chuTriTheoUser[p.userid] = ds; }
        ds.push(nv);
      }
    }

    var dsXl = (db && db.xuly) || [];
    for (i = 0; i < dsXl.length; i++) {
      x = dsXl[i];
      // §9.3 dieu 5: da tung TU CHOI chinh nhiem vu nay
      if (x.loai === 'TUCHOI') {
        n = cm.tuChoiTheoNv[x.idCtnv];
        if (!n) { n = Object.create(null); cm.tuChoiTheoNv[x.idCtnv] = n; }
        n[x.useridXuly] = true;
      }
      // §9.4 S3 (b): dem ban ghi XULY_NHIEMVU bi cham CHUA DAT (trangthaiDvXuly = 12)
      if (laBanGhiTraLai(x)) {
        cm.soTraLaiTheoNv[x.idCtnv] = (cm.soTraLaiTheoNv[x.idCtnv] || 0) + 1;
      }
    }
    return cm;
  }

  // §9.4 S3 (b) — DIEN GIAI: dac ta chi noi "trangthaiDvXuly = 12".
  // Chap nhan them bien the trangthaiXuly = 12 tren ban ghi NGHIEMTHU de dung
  // duoc voi ca hai cach seed du lieu (§4.4 co ca 2 cot).
  function laBanGhiTraLai(x) {
    if (!x) return false;
    if (x.trangthaiDvXuly === DV_TU_CHOI) return true;
    return (x.trangthaiDvXuly === null || x.trangthaiDvXuly === undefined) &&
           x.loai === 'NGHIEMTHU' && x.trangthaiXuly === DV_TU_CHOI;
  }

  /* ==========================================================================
   * 4. tinhDacTrung — §9.4 CONG THUC TUNG DAC TRUNG
   *    Tra ve { S1..S5, soLieu, coSoTinh }. Ham THUAN, khong sua db.
   *    Tham so thu 4 (chiMuc) la noi bo — goiY() truyen vao de khoi xay lai.
   * ========================================================================*/
  function tinhDacTrung(db, user, req, chiMuc) {
    var c = cfg();
    var cm = chiMuc || xayDungChiMuc(db);
    req = req || {};
    user = user || {};

    var maLV = req.linhvuc || null;
    var khongCoLinhVuc = !maLV;                       // §9.5 dong "Nhiem vu khong co linh vuc"
    var lvHienTai = maLV ? cm.linhVucTheoMa[maLV] : null;
    var nhomCha = lvHienTai ? (lvHienTai.nhomCha || null) : null;

    // DIEN GIAI (ghi vao bao cao): CA NAM dac trung deu tinh tren cac nhiem vu user giu vai
    // CHUTRI. §9.4 chi noi ro "vaitro = 'CHUTRI'" o S1 va S4; S2/S3/S5 viet chung chung
    // ("nhiem vu cua u"). Chon CHUTRI cho ca 5 de nhat quan voi view USER_TAI_HIENTAI (§4.8,
    // cung loc `p.vaitro = 'CHUTRI'`) va vi nguoi PHOIHOP khong chiu trach nhiem chinh ve
    // ket qua/han xu ly — quy cong hay quy loi cho ho deu lech ban chat. He qua phai chap
    // nhan: nguoi chi tung tham gia voi vai PHOIHOP se duoc cham nhu nguoi moi.
    var dsChuTri = cm.chuTriTheoUser[user.id] || [];   // moi nhiem vu user giu vai CHUTRI

    // --- Bien dem ---
    var n = 0;            // §9.4 S1: so nv DA HOAN THANH thuoc linh vuc L
    var nPhu = 0;         // §9.4 S1: so nv da hoan thanh o linh vuc CUNG NHOM CHA voi L
    var N = 0;            // §9.4 S2: TONG so nv da hoan thanh (moi linh vuc)
    var soDungHan = 0;    // §9.4 S3: trangthai = 1 va trangthaiDvXuly = 11
    var soTraLai = 0;     // §9.4 S3 (b)
    var soLanGiaHan = 0;  // §9.4 S3 (c): tong solangiahan
    var soNvDangMo = 0;   // §4.8 view: COUNT(*) nhiem vu dang giu
    var taiTrongSo = 0;   // §9.4 S4: tong w(dokhan)
    var q = 0;            // §9.4 S5: so nv dang o trangthai = 7
    var i, nv, w;

    for (i = 0; i < dsChuTri.length; i++) {
      nv = dsChuTri[i];

      if (daNghiemThu(nv)) {
        N += 1;                                                   // §9.4 S2
        if (nv.trangthai === TT_HOAN_THANH_TRONG_HAN) soDungHan += 1;  // §9.4 S3 (a)
        if (maLV) {
          if (nv.linhvuc === maLV) {
            n += 1;                                               // §9.4 S1 (n)
          } else if (nhomCha && nv.linhvuc && cm.linhVucTheoMa[nv.linhvuc] &&
                     cm.linhVucTheoMa[nv.linhvuc].nhomCha === nhomCha) {
            nPhu += 1;                                            // §9.4 S1 (n')
          }
        }
      }

      if (dangGiuViec(nv)) {                                      // §9.4 S4 / §4.8 view
        soNvDangMo += 1;
        w = c.trong_so_dokhan ? c.trong_so_dokhan[nv.dokhan] : undefined;
        taiTrongSo += (typeof w === 'number' ? w : 1.0);           // ELSE 1.0 (§4.8 view)
        if (nv.trangthai === TT_QUA_HAN) q += 1;                   // §9.4 S5
      }

      soLanGiaHan += (Number(nv.solangiahan) || 0);                // §9.4 S3 (c)
      soTraLai += (cm.soTraLaiTheoNv[nv.id] || 0);                 // §9.4 S3 (b)
    }

    // --- S1 — Chuyen mon (§9.4 S1) — suy tu lich su, khong can khai bao (§10.1) ---
    var nguongCM = Number(c.nguong_chuyen_mon) > 0 ? Number(c.nguong_chuyen_mon) : 1;
    var S1, nDung, dungChietKhauNhomCha = false;
    if (khongCoLinhVuc) {
      // §9.5: nhiem vu khong co linh vuc => bo rang buoc linh vuc, tinh tren TONG N
      nDung = N;
      S1 = Math.min(1, nDung / nguongCM);
    } else if (n > 0) {
      nDung = n;
      S1 = Math.min(1, n / nguongCM);                 // S1_chinh
    } else {
      nDung = 0;
      dungChietKhauNhomCha = true;
      S1 = 0.5 * Math.min(1, nPhu / nguongCM);        // chiet khau 50% vi chi gan dung
    }
    S1 = clamp(S1, 0, 1);

    // --- S2 — Lich su thuc hien (§9.4 S2): ln(1+N)/ln(1+nguong), cat nguong tai 1 ---
    var nguongLS = Number(c.nguong_lich_su) > 0 ? Number(c.nguong_lich_su) : 10;
    var mauLog = Math.log(1 + nguongLS);
    var S2 = mauLog > 0 ? Math.min(1, Math.log(1 + N) / mauLog) : (N > 0 ? 1 : 0);
    S2 = clamp(S2, 0, 1);

    // --- S3 — Hieu qua cong viec (§9.4 S3). KHONG dua hsChatluong vao (§9.4 ghi chu, §10.2) ---
    // Luu y mau thuan noi tai cua dac ta: bang cold start §9.5 dong 1 ghi nguoi moi co
    // "S3 ≈ 0,655" vi con cong vao r_chatluong = 0,60 — nhung chinh §9.4 (ghi chu) va §10.2
    // da LOAI hsChatluong khoi cong thuc. Ban nay theo §9.4/§10.2, nen nguoi moi ra
    // S3 = p0 = 0,70. Da neu trong bao cao de dinh chinh lai §9.5.
    var soHoanThanh = N;                                // trangthai IN (1,5) va dv = 11
    var p0 = typeof c.p0 === 'number' ? c.p0 : 0.7;
    var alpha = typeof c.alpha === 'number' ? c.alpha : 5;
    var mauR = soHoanThanh + alpha;
    // Chan chia 0: neu alpha = 0 va chua hoan thanh viec nao thi lay thang tien nghiem p0
    var rDungHan = mauR > 0 ? (soDungHan + alpha * p0) / mauR : p0;
    var tyLeTraLai = soTraLai / Math.max(1, soHoanThanh);     // max(1, ...) chan chia 0
    var tyLeGiaHan = soLanGiaHan / Math.max(1, soHoanThanh);  // max(1, ...) chan chia 0
    var phatTL = typeof c.phat_tralai === 'number' ? c.phat_tralai : 0.3;
    var phatGH = typeof c.phat_giahan === 'number' ? c.phat_giahan : 0.15;
    var S3 = clamp(rDungHan - phatTL * tyLeTraLai - phatGH * tyLeGiaHan, 0, 1);

    // --- S4 — Khoi luong hien tai (§9.4 S4) ---
    var K = Number(user.max_concurrent_tasks);
    if (!(K > 0)) K = K_MAC_DINH;                       // §4.7 mac dinh 8, chan chia 0
    var S4 = clamp(1 - taiTrongSo / K, 0, 1);

    // --- S5 — Tinh san sang (§9.4 S5) ---
    var S5 = clamp(1 - Math.min(1, q / NGUONG_QUA_HAN_S5), 0, 1);

    var tenLV = lvHienTai ? lvHienTai.ten : (maLV || null);
    var lvCha = nhomCha ? cm.linhVucTheoMa[nhomCha] : null;

    return {
      S1: S1, S2: S2, S3: S3, S4: S4, S5: S5,
      soLieu: {
        // Hai khoa duoi day CO trong hop dong §9.6 nhung LUON null o ban nay:
        //  - mucThanhThao: §9.2 / §10.1 bo bang khai bao nang luc -> khong co thang 1-5.
        //  - diemChatLuongTb: §9.4 ghi chu + §10.2 loai hsChatluong khoi cong thuc.
        // Giu khoa (= null) de UI kiem tra `== null` ma an thanh chat luong (§9.5 dong 4)
        // thay vi in ra "undefined".
        mucThanhThao: null,             // §9.6 soLieu.mucThanhThao
        diemChatLuongTb: null,          // §9.6 soLieu.diemChatLuongTb
        soNvHoanThanhLinhVuc: n,        // §9.4 S1 (n)
        soNvHoanThanh: soHoanThanh,     // §9.4 S2 / S3
        soNvDungHan: soDungHan,         // §9.4 S3 (a)
        soNvBiTraLai: soTraLai,         // §9.4 S3 (b) / §4.8 so_nv_bi_tralai
        soLanGiaHan: soLanGiaHan,       // §9.4 S3 (c) / §4.8 so_lan_giahan
        soNvDangMo: soNvDangMo,         // §4.8 view so_nv_dang_mo
        taiTrongSo: lamTron(taiTrongSo, 2), // §4.8 view tai_trong_so
        soNvQuaHan: q,                  // §4.8 view so_nv_qua_han
        K: K,                           // §4.7 max_concurrent_tasks
        tyLeDungHan: soHoanThanh > 0 ? lamTron(soDungHan / soHoanThanh, 4) : 0,
        soNvDuocGiao: dsChuTri.length   // BO SUNG: tong so viec tung duoc giao (nhan NGUOI_MOI)
      },
      coSoTinh: {
        maLinhVuc: maLV,
        tenLinhVuc: tenLV,
        khongCoLinhVuc: khongCoLinhVuc,
        maNhomCha: nhomCha,
        tenNhomCha: lvCha ? lvCha.ten : (nhomCha || null),
        n: n,                           // §9.4 S1
        nPhu: nPhu,                     // §9.4 S1 (n')
        nDungChoS1: nDung,
        dungChietKhauNhomCha: dungChietKhauNhomCha,
        N: N,                           // §9.4 S2
        r_dunghan: lamTron(rDungHan, 4),        // §9.4 S3 (a)
        tyle_tralai: lamTron(tyLeTraLai, 4),    // §9.4 S3 (b)
        tyle_giahan: lamTron(tyLeGiaHan, 4),    // §9.4 S3 (c)
        tai: lamTron(taiTrongSo, 2),            // §9.4 S4
        K: K,
        q: q,                                   // §9.4 S5
        nguong_chuyen_mon: nguongCM,
        nguong_lich_su: nguongLS,
        coDuLieuHieuQua: soHoanThanh > 0
      }
    };
  }

  /* ==========================================================================
   * 5. locCung — §9.3 LOC CUNG (chay TRUOC khi cham diem)
   *    Tra ve { ungVien:[user], loaiBo:[{user, lyDo}], quaTai:[userid] }
   *    Dieu 6 KHONG loai nguoi qua tai — chi danh dau de day xuong cuoi.
   * ========================================================================*/
  function locCung(db, req, chiMuc) {
    var c = cfg();
    var cm = chiMuc || xayDungChiMuc(db);
    req = req || {};

    var phamVi = laMang(req.phamViUnitCode).filter(function (x) { return !!x; });
    var loaiTru = laMang(req.loaiTru).filter(function (x) { return !!x; });
    var idNv = req.idnvchitiet || null;

    // §9.3 dieu 4 va 5 chi tra cuu duoc khi biet MA NHIEM VU. Hop dong request §9.6 khong
    // liet ke truong nay (nhiem vu dang TAO MOI thi chua co ma, hai dieu tren la vo nghia),
    // nen khi giao lai / them nguoi cho nhiem vu DA CO, caller BAT BUOC truyen
    // `idnvchitiet`, hoac truyen thang `daPhanCong[]` / `daTuChoi[]` (danh sach userid).
    var dsPcCuaNv = idNv ? (cm.phanCongTheoNv[idNv] || []) : [];
    var daPhanCong = Object.create(null);
    var k;
    for (k = 0; k < dsPcCuaNv.length; k++) daPhanCong[dsPcCuaNv[k].userid] = true;
    var dsPcThem = laMang(req.daPhanCong);
    for (k = 0; k < dsPcThem.length; k++) if (dsPcThem[k]) daPhanCong[dsPcThem[k]] = true;

    var daTuChoi = Object.create(null);
    var mapTC = idNv ? (cm.tuChoiTheoNv[idNv] || null) : null;
    if (mapTC) for (var uid in mapTC) daTuChoi[uid] = true;
    var dsTcThem = laMang(req.daTuChoi);
    for (k = 0; k < dsTcThem.length; k++) if (dsTcThem[k]) daTuChoi[dsTcThem[k]] = true;

    // Co chan doan cho goiY(): bao cho UI/kiem thu biet hai dieu loc cung nay CO chay hay khong.
    var coLocTrungLap = !!(idNv || dsPcThem.length || dsTcThem.length);

    var ungVien = [], loaiBo = [], quaTai = [];
    var dsUser = (db && db.users) || [];

    for (var i = 0; i < dsUser.length; i++) {
      var u = dsUser[i];

      // §9.3 dieu 1 — tai khoan bi khoa
      if (u.trangthai !== 1) { loaiBo.push({ user: u, lyDo: 'Tài khoản đã bị khoá' }); continue; }

      // §9.3 dieu 2 — khong phai nguoi thuc hien
      if (!coVaiTro(u, 'NGUOI_THUC_HIEN')) {
        loaiBo.push({ user: u, lyDo: 'Không có vai trò Người thực hiện' }); continue;
      }

      // §9.3 dieu 3 — ngoai pham vi don vi duoc chon (rong = khong gioi han)
      if (phamVi.length > 0 && phamVi.indexOf(u.unitcode) < 0) {
        loaiBo.push({ user: u, lyDo: 'Ngoài phạm vi đơn vị được chọn' }); continue;
      }

      // §9.3 dieu 4 — da co ten trong phan cong cua chinh nhiem vu nay (tranh goi y trung)
      if (daPhanCong[u.id]) {
        loaiBo.push({ user: u, lyDo: 'Đã được phân công trong nhiệm vụ này' }); continue;
      }
      // (cung dieu 4) danh sach loaiTru do nguoi giao truyen len — §9.6 request.loaiTru
      if (loaiTru.indexOf(u.id) >= 0) {
        loaiBo.push({ user: u, lyDo: 'Đã được người giao chọn hoặc loại trừ' }); continue;
      }

      // §9.3 dieu 5 — da tung tu choi chinh nhiem vu nay
      if (daTuChoi[u.id]) {
        loaiBo.push({ user: u, lyDo: 'Đã từ chối nhiệm vụ này trước đó' }); continue;
      }

      // §9.3 dieu 6 — qua tai nghiem trong: VAN HIEN THI, chi gan nhan + day xuong cuoi
      var dt = tinhDacTrung(db, u, req, cm);
      var K = dt.soLieu.K;
      var heSo = typeof c.he_so_qua_tai === 'number' ? c.he_so_qua_tai : 1.5;
      if (dt.soLieu.taiTrongSo >= K * heSo) quaTai.push(u.id);

      ungVien.push(u);
    }

    return { ungVien: ungVien, loaiBo: loaiBo, quaTai: quaTai, coLocTrungLap: coLocTrungLap };
  }

  /* ==========================================================================
   * 6. sinhLyDo — §9.6 bang "Sinh cau ly do" (mau CO DINH, khong dung LLM)
   *    Uu tien: chuyen mon -> kinh nghiem/lich su -> hieu qua -> khoi luong -> san sang
   * ========================================================================*/
  function sinhLyDo(user, dt, req, db) {
    if (!dt) return [];
    var sl = dt.soLieu, cs = dt.coSoTinh;
    // { cau, canhBao, uu } — uu = thu tu uu tien §9.7
    // "Toi da 4 dong ly do, uu tien: chuyen mon -> kinh nghiem -> hieu qua -> khoi luong"
    //   uu 1 = chuyen mon | 2 = kinh nghiem | 3 = hieu qua | 4 = khoi luong
    //   uu 5/6 = cac dong BO SUNG (bi tra lai, dang qua han) — chi hien khi con cho trong;
    //   thong tin nay khong mat vi da co nhan BI_TRA_LAI / CO_QUA_HAN trong `nhan[]`.
    var ds = [];

    // --- (1) Chuyen mon (uu tien 1) ---
    // DIEN GIAI: ban nay SUY chuyen mon tu lich su (§9.2 / §10.1) nen khong co
    // muc thanh thao 1-5; dung mau cau theo so viec da hoan thanh.
    if (cs.khongCoLinhVuc) {
      ds.push({ uu: 1, cau: 'Đã hoàn thành ' + cs.N + ' nhiệm vụ (nhiệm vụ chưa gán lĩnh vực nên tính trên mọi lĩnh vực)', canhBao: false });
    } else if (cs.n > 0) {
      ds.push({ uu: 1, cau: 'Đã hoàn thành ' + cs.n + ' nhiệm vụ thuộc lĩnh vực ' + (cs.tenLinhVuc || cs.maLinhVuc), canhBao: false });
    } else if (cs.nPhu > 0) {
      ds.push({ uu: 1, cau: 'Chưa từng làm ' + (cs.tenLinhVuc || cs.maLinhVuc) + ', nhưng đã hoàn thành ' +
                     cs.nPhu + ' nhiệm vụ thuộc nhóm ' + (cs.tenNhomCha || 'cùng nhóm cha'), canhBao: false });
    } else {
      ds.push({ uu: 1, cau: 'Chưa từng thực hiện nhiệm vụ thuộc lĩnh vực này', canhBao: false });
    }

    // --- (2) Kinh nghiem / lich su thuc hien (§9.4 S2) — uu tien 2 ---
    if (cs.N > 0) {
      ds.push({ uu: 2, cau: 'Tổng cộng ' + cs.N + ' nhiệm vụ đã được nghiệm thu', canhBao: false });
    } else {
      ds.push({ uu: 2, cau: 'Người mới – chưa có nhiệm vụ nào được nghiệm thu', canhBao: false });
    }

    // --- (3) Hieu qua (§9.4 S3) — uu tien 3 ---
    if (sl.soNvHoanThanh > 0) {
      var pct = Math.round((sl.soNvDungHan / sl.soNvHoanThanh) * 100);
      ds.push({ uu: 3, cau: 'Tỷ lệ đúng hạn ' + pct + '% (' + sl.soNvDungHan + '/' + sl.soNvHoanThanh + ')', canhBao: false });
    }
    if (sl.soNvBiTraLai > 0) {
      ds.push({ uu: 5, cau: 'Lưu ý: ' + sl.soNvBiTraLai + ' nhiệm vụ từng bị trả lại yêu cầu bổ sung', canhBao: true });
    }

    // --- (4) Khoi luong (§9.6 bang mau cau) — uu tien 4 ---
    var tai = soVN(sl.taiTrongSo, 1);
    if (dt.S4 >= 0.5) {
      ds.push({ uu: 4, cau: 'Đang giữ ' + sl.soNvDangMo + ' nhiệm vụ (tải ' + tai + '/' + sl.K + ' — còn nhiều dư địa)', canhBao: false });
    } else if (dt.S4 < 0.25) {
      ds.push({ uu: 4, cau: '⚠ Đang khá bận: ' + sl.soNvDangMo + ' nhiệm vụ (tải ' + tai + '/' + sl.K + ')', canhBao: true });
    } else {
      // DIEN GIAI: dac ta khong quy dinh cau cho khoang 0,25 <= S4 < 0,5 -> cau trung tinh
      ds.push({ uu: 4, cau: 'Đang giữ ' + sl.soNvDangMo + ' nhiệm vụ (tải ' + tai + '/' + sl.K + ')', canhBao: false });
    }

    // --- (5) San sang (§9.4 S5) — uu tien 6 ---
    if (sl.soNvQuaHan > 0) {
      ds.push({ uu: 6, cau: '⚠ Đang có ' + sl.soNvQuaHan + ' nhiệm vụ quá hạn', canhBao: true });
    }

    // §9.7: xep theo dung thu tu uu tien roi cat con 4 dong (sort on dinh: co tie-break
    // theo vi tri ban dau de khong phu thuoc cai dat sort cua trinh duyet).
    for (var k = 0; k < ds.length; k++) ds[k]._i = k;
    ds.sort(function (a, b) { return (a.uu - b.uu) || (a._i - b._i); });
    return ds.slice(0, SO_DONG_LY_DO_TOI_DA).map(function (x) { return x.cau; });
  }

  /* ==========================================================================
   * 7. Nhan hien thi (§9.5 / §9.6 / §9.7)
   * ========================================================================*/
  function taoNhan(dt, doTinCay, laQuaTai) {
    var ds = [];
    // §9.5 dong 1: nguoi dung moi, chua co nhiem vu nao
    if (dt.soLieu.soNvDuocGiao === 0) {
      ds.push({ ma: 'NGUOI_MOI', nhan: 'Người mới – chưa có dữ liệu lịch sử', mau: 'xam' });
    }
    // §9.4 "he so tin cay": < 0,4 => hien nhan "Dữ liệu còn ít"
    if (doTinCay < 0.4) {
      ds.push({ ma: 'DU_LIEU_IT', nhan: 'Dữ liệu còn ít', mau: 'vang' });
    }
    // §9.3 dieu 6
    if (laQuaTai) {
      ds.push({ ma: 'QUA_TAI', nhan: '⚠ Quá tải', mau: 'do' });
    }
    // §9.4 S5 — canh bao co viec dang qua han
    if (dt.soLieu.soNvQuaHan > 0) {
      ds.push({ ma: 'CO_QUA_HAN', nhan: '⚠ Đang có nhiệm vụ quá hạn', mau: 'cam' });
    }
    // §9.4 S3 (b) — canh bao tung bi tra lai. Dua vao nhan de dong ly do "bi tra lai"
    // co the bi cat theo thu tu uu tien §9.7 ma thong tin van khong mat.
    // Chi gan nhan khi ty le tra lai THAT SU cao: §9.6 ghi dieu kien la "bi tra lai NHIEU".
    // Nguong 25% — duoi nguong nay hau het nguoi lam lau nam deu dinh 1-2 lan, gan nhan cho
    // tat ca thi nhan mat het y nghia canh bao.
    var soHt = dt.soLieu.soNvHoanThanh || 0;
    var tyLeTraLai = dt.soLieu.soNvBiTraLai / (soHt > 0 ? soHt : 1);
    if (dt.soLieu.soNvBiTraLai > 0 && tyLeTraLai >= 0.25) {
      ds.push({ ma: 'BI_TRA_LAI', nhan: '⚠ Hay bị trả lại (' + dt.soLieu.soNvBiTraLai + ' lần)', mau: 'cam' });
    }
    return ds;
  }

  /* ==========================================================================
   * 8. goiY — §9.6 HOP DONG API H1
   * req = { noidung, linhvuc, dokhan, hanxulyth, phamViUnitCode:[], loaiTru:[], soLuong,
   *         idnvchitiet,            // BAT BUOC khi nhiem vu DA TON TAI (§9.3 dieu 4 + 5)
   *         daPhanCong:[], daTuChoi:[] }  // thay the neu caller khong co idnvchitiet
   * ========================================================================*/
  function goiY(db, req) {
    var c = cfg();
    req = req || {};
    var cm = xayDungChiMuc(db);
    var loc = locCung(db, req, cm);

    var quaTaiMap = Object.create(null);
    for (var i = 0; i < loc.quaTai.length; i++) quaTaiMap[loc.quaTai[i]] = true;

    // §9.5 dong cuoi: toan he thong chua co nhiem vu nao duoc nghiem thu -> che do du phong
    var cheDo = cm.heThongCoNghiemThu ? 'DAY_DU' : 'KHOI_TAO';
    var canhBao = [];
    if (cheDo === 'KHOI_TAO') {
      canhBao.push('Chế độ khởi tạo: gợi ý dựa trên chuyên môn và khối lượng hiện tại.');
    }
    if (!req.linhvuc) {
      canhBao.push('Nhiệm vụ chưa gán lĩnh vực — độ chính xác gợi ý giảm.');
    }

    var dong = [];
    for (i = 0; i < loc.ungVien.length; i++) {
      var u = loc.ungVien[i];
      var dt = tinhDacTrung(db, u, req, cm);
      var laQuaTai = !!quaTaiMap[u.id];

      // Trong so ap dung: che do KHOI_TAO chi dung S1 va S4 voi w = 0,6 / 0,4 (§9.5)
      var ts;
      if (cheDo === 'KHOI_TAO') {
        ts = { chuyenMon: TS_KHOI_TAO_S1, lichSu: 0, hieuQua: 0, khoiLuong: TS_KHOI_TAO_S4, sanSang: 0 };
      } else {
        ts = {
          chuyenMon: Number(c.w1) || 0, lichSu: Number(c.w2) || 0, hieuQua: Number(c.w3) || 0,
          khoiLuong: Number(c.w4) || 0, sanSang: Number(c.w5) || 0
        };
      }

      // §9.4 "Diem tong": DIEM = 100 x (w1·S1 + w2·S2 + w3·S3 + w4·S4 + w5·S5)
      // §9.1 "giai thich duoc" + vi du §9.6 (1,00×0,30→30,0 ... tong 87,4): gopPhan phai
      // tinh tu CHINH con so `diem` hien thi (da lam tron 2 chu so) va tong 5 gopPhan phai
      // bang diemTong — neu khong, bang phan ra hien tren M06 cong lai khong ra tong.
      var dtp = {
        chuyenMon: { diem: lamTron(dt.S1, 2), trongSo: ts.chuyenMon },
        lichSu:    { diem: lamTron(dt.S2, 2), trongSo: ts.lichSu },
        hieuQua:   { diem: lamTron(dt.S3, 2), trongSo: ts.hieuQua },
        khoiLuong: { diem: lamTron(dt.S4, 2), trongSo: ts.khoiLuong },
        sanSang:   { diem: lamTron(dt.S5, 2), trongSo: ts.sanSang }
      };
      var tong = 0;
      for (var kTP in dtp) {
        dtp[kTP].gopPhan = lamTron(100 * dtp[kTP].trongSo * dtp[kTP].diem, 1);
        tong += dtp[kTP].gopPhan;
      }
      tong = lamTron(tong, 1);

      // §9.4 "He so tin cay" (khong nhan vao diem, chi hien thi).
      // DIEN GIAI: dac ta viet `co_ho_so_chuyen_mon`, nhung ban nay KHONG co bang khai bao
      // ho so nang luc (§9.2, §10.1 — chuyen mon suy tu lich su). Vi vay dien giai co =
      // "da tung hoan thanh it nhat 1 nhiem vu thuoc linh vuc L".
      var coHoSoChuyenMon = dt.coSoTinh.khongCoLinhVuc
        ? (dt.coSoTinh.N > 0)          // khong co linh vuc -> lay tong lich su lam can cu
        : (dt.coSoTinh.n > 0);
      var doTinCay = clamp((dt.soLieu.soNvHoanThanh / CHIA_DO_TIN_CAY) * 0.6 + (coHoSoChuyenMon ? 0.4 : 0), 0, 1);
      doTinCay = lamTron(doTinCay, 2);

      var dv = cm.donViTheoMa[u.unitcode];
      var nhan = taoNhan(dt, doTinCay, laQuaTai);

      dong.push({
        _quaTai: laQuaTai,
        _S4: dt.S4,
        item: {
          userid: u.id,
          fullname: u.fullname,
          chucvu: u.chucvu || '',
          unitname: dv ? dv.tendonvi : (u.unitcode || ''),
          diemTong: tong,
          doTinCay: doTinCay,
          nhan: nhan,
          // BO SUNG: ban chuoi cua `nhan` de UI in thang (§9.7 hien [Dữ liệu còn ít] /
          // [⚠ Quá tải]) ma khong phai biet cau truc {ma, nhan, mau}.
          nhanText: nhan.map(function (x) { return x.nhan; }),
          diemThanhPhan: dtp,
          lyDo: sinhLyDo(u, dt, req, db),
          soLieu: dt.soLieu
        }
      });
    }

    // §9.5 "Nguyen tac": khong bao gio tra danh sach rong.
    // Neu MOI ung vien deu 0 diem -> xep theo S4 (ai ranh nhat) va noi ro ly do.
    var deu0 = dong.length > 0;
    for (i = 0; i < dong.length; i++) { if (dong[i].item.diemTong > 0) { deu0 = false; break; } }
    if (deu0) {
      canhBao.push('Mọi ứng viên đều chưa có dữ liệu để chấm điểm — danh sách được xếp theo mức độ rảnh (khối lượng hiện tại).');
    }
    if (dong.length === 0) {
      // DIEN GIAI: khong the "sinh" nguoi khi bo loc cung §9.3 da loai het.
      canhBao.push('Không có ứng viên nào thoả điều kiện lọc — hãy mở rộng phạm vi đơn vị hoặc chọn thủ công.');
    }

    // §9.3 dieu 6 + §9.7: nguoi QUA_TAI luon xep SAU moi nguoi khong qua tai
    dong.sort(function (a, b) {
      if (a._quaTai !== b._quaTai) return a._quaTai ? 1 : -1;
      if (deu0) {
        if (b._S4 !== a._S4) return b._S4 - a._S4;
      } else {
        if (b.item.diemTong !== a.item.diemTong) return b.item.diemTong - a.item.diemTong;
        if (b._S4 !== a._S4) return b._S4 - a._S4;   // hoa diem -> ai ranh hon len truoc
      }
      return String(a.item.fullname || '').localeCompare(String(b.item.fullname || ''), 'vi');
    });

    var soLuong = Number(req.soLuong);
    if (!(soLuong > 0)) soLuong = SO_LUONG_MAC_DINH;   // §9.6 mac dinh 5; goi lai voi so lon hon de "Xem them"
    var ketQua = dong.slice(0, Math.floor(soLuong)).map(function (x) { return x.item; });

    return {
      goiyId: taoId('goiy'),
      phienBanTrongSo: c.phien_ban,
      cheDo: cheDo,
      canhBao: canhBao,
      ungVien: ketQua,
      // --- BO SUNG ngoai §9.6 (tien cho man M06 / M13, khong pha hop dong goc) ---
      idnvchitiet: req.idnvchitiet || null,
      linhvuc: req.linhvuc || null,
      tongSoUngVien: dong.length,
      // §9.3 dieu 4 + 5 co duoc ap dung khong (false = request khong truyen ma nhiem vu
      // lan danh sach daPhanCong/daTuChoi — dung cho nhiem vu dang tao moi).
      daLocTrungLap: !!loc.coLocTrungLap,
      loaiBo: loc.loaiBo.map(function (x) {
        return { userid: x.user.id, fullname: x.user.fullname, lyDo: x.lyDo };
      })
    };
  }

  /* ==========================================================================
   * 9. ghiLog — §5.8 API H2 + §4.8 bang AI_GOIY_LOG
   *    Day la ham DUY NHAT co side effect (ghi vao db.aiLog).
   * ========================================================================*/
  function ghiLog(db, goiy, useridDaChon) {
    if (!db || !goiy) return null;
    if (!Array.isArray(db.aiLog)) db.aiLog = [];

    var ds = goiy.ungVien || [];
    var thuHang = null;                       // 1-based (§4.8 thu_hang_da_chon)
    if (useridDaChon) {
      for (var i = 0; i < ds.length; i++) {
        if (ds[i].userid === useridDaChon) { thuHang = i + 1; break; }
      }
    }

    // ket_qua_json: top-N ung vien + diem thanh phan (§4.8)
    var ketQuaJson = JSON.stringify(ds.map(function (x, idx) {
      return {
        thuHang: idx + 1,
        userid: x.userid,
        fullname: x.fullname,
        diemTong: x.diemTong,
        doTinCay: x.doTinCay,
        diemThanhPhan: x.diemThanhPhan,
        nhan: (x.nhan || []).map(function (n) { return n.ma; })
      };
    }));

    var ban = null;
    for (var j = 0; j < db.aiLog.length; j++) {
      if (db.aiLog[j].id === goiy.goiyId) { ban = db.aiLog[j]; break; }
    }
    if (!ban) {
      ban = {
        id: goiy.goiyId,
        idnvchitiet: goiy.idnvchitiet || null,
        linhvuc: goiy.linhvuc || null,
        createdate: db.today || null   // demo khong dung dong ho he thong -> lay "hom nay" cua DB
      };
      db.aiLog.push(ban);
    }
    ban.idnvchitiet = ban.idnvchitiet || goiy.idnvchitiet || null;
    ban.linhvuc = ban.linhvuc || goiy.linhvuc || null;
    ban.ket_qua_json = ketQuaJson;
    ban.userid_da_chon = useridDaChon || null;
    ban.thu_hang_da_chon = thuHang;
    // §4.8: co_trong_goi_y = "nguoi duoc chon co nam trong TOP-5 khong" — chot cung o 5,
    // KHONG phu thuoc req.soLuong. Neu UI bam "Xem them 5 nguoi" (goi lai voi soLuong=10)
    // thi Precision@3 / ty le chap nhan / MRR o §9.8 van so sanh duoc giua cac lan.
    ban.co_trong_goi_y = thuHang !== null && thuHang <= TOP_LOG;
    ban.phien_ban_trongso = goiy.phienBanTrongSo || cfg().phien_ban;
    return ban;
  }

  /* ==========================================================================
   * 10. Tien ich phu tro cho man H4 (kiem tra cau hinh) — BO SUNG
   * ========================================================================*/
  function kiemTraCauHinh() {
    var c = cfg();
    var tong = (Number(c.w1) || 0) + (Number(c.w2) || 0) + (Number(c.w3) || 0) +
               (Number(c.w4) || 0) + (Number(c.w5) || 0);
    var canhBao = [];
    if (Math.abs(tong - 1) > 1e-9) {
      canhBao.push('Tổng trọng số đang là ' + soVN(tong, 2) + ' — theo đặc tả phải bằng 1,00.');
    }
    if (!(Number(c.nguong_chuyen_mon) > 0)) canhBao.push('Ngưỡng chuyên môn phải lớn hơn 0.');
    if (!(Number(c.nguong_lich_su) > 0)) canhBao.push('Ngưỡng lịch sử phải lớn hơn 0.');
    if (!(Number(c.p0) >= 0 && Number(c.p0) <= 1)) canhBao.push('Tiên nghiệm p0 phải nằm trong khoảng 0–1.');
    if (Number(c.alpha) < 0) canhBao.push('Hệ số làm mượt α không được âm.');
    return { tongTrongSo: lamTron(tong, 4), hopLe: canhBao.length === 0, canhBao: canhBao };
  }

  /* ==========================================================================
   * 11. XUAT
   * ========================================================================*/
  API.tinhDacTrung = function (db, user, req) { return tinhDacTrung(db, user, req, null); };
  API.locCung = function (db, req) { return locCung(db, req, null); };
  API.goiY = goiY;
  API.sinhLyDo = sinhLyDo;
  API.ghiLog = ghiLog;
  API.kiemTraCauHinh = kiemTraCauHinh;
  API.xayDungChiMuc = xayDungChiMuc;   // BO SUNG: metrics.js co the dung lai chi muc

  window.AiEngine = API;
})();

</script>

<script>
/* ==========================================================================
 *  metrics.js — ĐO HIỆU QUẢ AI + THỐNG KÊ DASHBOARD
 *  Xuất ra: window.Metrics
 *
 *  Tham chiếu đặc tả DAC-TA-PHAN-HE-GIAO-NHIEM-VU.md:
 *    §3.1  M02 Bảng điều khiển (4 thẻ đếm, biểu đồ tròn, biểu đồ cột theo đơn vị)
 *    §3.4  M13 Nhật ký gợi ý AI
 *    §4.4  XULY_NHIEMVU (lưu vết mucdoht theo thời gian — cải tiến so với hệ gốc)
 *    §4.8  USER_HIEUSUAT / USER_TAI_HIENTAI / AI_GOIY_LOG
 *    §5.10 J1 dashboard/tong-quan, J2 dashboard/theo-don-vi
 *    §9.4  Công thức đặc trưng S1..S5 (dùng cho baseline RANH_NHAT / CHUYEN_MON_NHAT)
 *    §9.8  Đo hiệu quả: Precision@1, Precision@3, Tỷ lệ chấp nhận, MRR, Gini, baseline
 *
 *  Ràng buộc: JavaScript thuần ES2020, KHÔNG import/export/require, không npm,
 *  không gọi mạng. Toàn bộ chuỗi hiển thị là tiếng Việt có dấu.
 * ======================================================================== */
(function () {
  'use strict';

  /* ======================================================================
   * 0. HẰNG SỐ
   * ==================================================================== */

  // §9.8 — ngưỡng mục tiêu để UI tô màu đạt / chưa đạt
  var NGUONG_MUC_TIEU = {
    precision1: 0.35,
    precision3: 0.60,
    tyLeChapNhan: 0.70,
    mrr: 0.50
  };

  // §2.1 — nhãn + màu trục A `trangthai` (biểu đồ tròn M02)
  var DM_TRANGTHAI = [
    { ma: 3,  nhan: 'Chưa triển khai',              mau: '#94a3b8' },
    { ma: 2,  nhan: 'Đang triển khai',              mau: '#2563eb' },
    { ma: 7,  nhan: 'Đang triển khai - Đã hết hạn', mau: '#dc2626' },
    { ma: 13, nhan: 'Gia hạn',                      mau: '#7c3aed' },
    { ma: 6,  nhan: 'Từ chối nhiệm vụ',             mau: '#f97316' },
    { ma: 1,  nhan: 'Hoàn thành',                   mau: '#16a34a' },
    { ma: 5,  nhan: 'Hoàn thành - Sau hạn',         mau: '#84cc16' },
    { ma: 97, nhan: 'Đã thu hồi',                   mau: '#64748b' }
  ];

  // §9.4 S4 — trọng số tải theo độ khẩn (bám hằng MUCDOUUTIEN của hệ gốc)
  var TRONGSO_DOKHAN = { DOTXUAT: 2.0, TRONGTAM: 1.5, THUONGXUYEN: 1.0 };

  var MAX_TASK_MACDINH        = 8;  // §4.7 max_concurrent_tasks mặc định
  var NGUONG_CHUYEN_MON       = 5;  // §9.4 S1 — mốc n/5
  var SO_NGAY_SAP_HET_HAN     = 3;  // §3.1 M02 — "sắp đến hạn (≤ 3 ngày)"
  var SO_MAU_BASELINE_MACDINH = 60; // §9.8 — 60 nhiệm vụ để chạy < 2 giây

  // Khoảng điểm cho biểu đồ phân bố điểm gợi ý (M13)
  var KHOANG_DIEM = [
    { khoang: '80-100', min: 80,   max: 1e9 },
    { khoang: '60-79',  min: 60,   max: 80 },
    { khoang: '40-59',  min: 40,   max: 60 },
    { khoang: '20-39',  min: 20,   max: 40 },
    { khoang: '0-19',   min: -1e9, max: 20 }
  ];

  /* ======================================================================
   * 1. TIỆN ÍCH CHUNG — chặn chia 0, mảng rỗng, làm tròn
   * ==================================================================== */

  function laMang(x) { return Array.isArray(x) ? x : []; }

  function lamTron(x, sole) {
    var n = Number(x);
    if (!isFinite(n)) return 0;
    var he = Math.pow(10, (sole == null ? 2 : sole));
    return Math.round(n * he) / he;
  }

  function chiaAnToan(tu, mau) {
    if (!mau) return 0;
    var kq = Number(tu) / Number(mau);
    return isFinite(kq) ? kq : 0;
  }

  function keo(x, min, max) {
    var n = Number(x);
    if (!isFinite(n)) return min;
    return n < min ? min : (n > max ? max : n);
  }

  // PRNG có seed (mulberry32) — KHÔNG dùng Math.random ở chỗ cần tái lập
  function mulberry32(seed) {
    var a = (seed >>> 0);
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* --- Ngày tháng: chuỗi 'yyyy-mm-dd' hoặc 'yyyy-mm-ddTHH:mm' ---------- */

  function mocNgay(s) {
    if (!s || typeof s !== 'string') return null;
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
    if (!m) return null;
    return Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  }

  function soNgayNoiBo(tu, den) {
    var a = mocNgay(tu), b = mocNgay(den);
    if (a === null || b === null) return null;
    return Math.round((b - a) / 86400000);
  }

  // Được phép dùng window.Flow.Ngay, nhưng CHỈ khi hàm đó vượt được phép tự kiểm
  // (tránh rủi ro module kia đảo chiều tham số làm sai dấu số ngày còn lại).
  var _hamNgayFlow; // undefined = chưa dò ; null = không dùng được
  function soNgayGiua(tu, den) {
    if (_hamNgayFlow === undefined) {
      _hamNgayFlow = null;
      var N = (typeof window !== 'undefined' && window.Flow && window.Flow.Ngay) ? window.Flow.Ngay : null;
      var f = N && (N.soNgayGiua || N.khoangCachNgay || N.soNgayConLai);
      if (typeof f === 'function') {
        try {
          if (f.call(N, '2026-01-01', '2026-01-11') === 10) {
            _hamNgayFlow = function (a, b) { return f.call(N, a, b); };
          }
        } catch (e) { _hamNgayFlow = null; }
      }
    }
    if (_hamNgayFlow) {
      try {
        var r = _hamNgayFlow(tu, den);
        if (typeof r === 'number' && isFinite(r)) return r;
      } catch (e2) { /* rơi về bản nội bộ */ }
    }
    return soNgayNoiBo(tu, den);
  }

  function ngayCuaChuoi(s) {
    return (typeof s === 'string' && s.length >= 10) ? s.slice(0, 10) : null;
  }

  /* --- Vị ngữ trạng thái (§2.1, §2.6) ---------------------------------- */

  function laHoanThanh(nv) {  // trangthai ∈ {1,5}
    return !!nv && (nv.trangthai === 1 || nv.trangthai === 5);
  }
  function daNghiemThu(nv) {  // §2.6 điểm cuối: hoàn thành VÀ trangthaiDvXuly = 11
    return laHoanThanh(nv) && nv.trangthaiDvXuly === 11;
  }
  function daKetThuc(nv) {    // §2.6 — hai điểm cuối
    return daNghiemThu(nv) || (!!nv && nv.trangthai === 97);
  }
  function dangGiu(nv) {      // §4.8 view USER_TAI_HIENTAI: trangthai NOT IN (1,5,97)
    return !!nv && nv.trangthai !== 1 && nv.trangthai !== 5 && nv.trangthai !== 97;
  }

  function coVaiTro(u, vt) {
    if (!u || !u.vaitro) return false;
    if (Array.isArray(u.vaitro)) return u.vaitro.indexOf(vt) >= 0;
    return String(u.vaitro).indexOf(vt) >= 0;
  }
  function laUngVienHopLe(u) { // §9.3 lọc cứng 1 & 2
    return !!u && u.trangthai === 1 && coVaiTro(u, 'NGUOI_THUC_HIEN');
  }
  function dsUngVienHeThong(db) {
    var out = [], us = laMang(db && db.users), i;
    for (i = 0; i < us.length; i++) if (laUngVienHopLe(us[i])) out.push(us[i]);
    return out;
  }

  function lapChiMuc(ds, khoa) {
    var m = {}, i;
    for (i = 0; i < ds.length; i++) if (ds[i] && ds[i][khoa] != null) m[ds[i][khoa]] = ds[i];
    return m;
  }

  function trongSoTai(dokhan) {
    var w = TRONGSO_DOKHAN[String(dokhan || '').toUpperCase()];
    return (typeof w === 'number') ? w : 1.0;
  }

  // Người CHỦ TRÌ của một nhiệm vụ (phân công còn hiệu lực; nếu không còn bản
  // ghi hiệu lực thì lấy bản ghi CHUTRI sớm nhất — người được giao ban đầu).
  function nguoiChuTri(dsPhanCong, idnv) {
    var uuTien = null, duPhong = null, i, p;
    for (i = 0; i < dsPhanCong.length; i++) {
      p = dsPhanCong[i];
      if (!p || p.idnvchitiet !== idnv || p.vaitro !== 'CHUTRI') continue;
      if (p.trangthai === 1) {
        if (!uuTien || String(p.createdate || '') < String(uuTien.createdate || '')) uuTien = p;
      } else if (!duPhong || String(p.createdate || '') < String(duPhong.createdate || '')) {
        duPhong = p;
      }
    }
    var chon = uuTien || duPhong;
    return chon ? String(chon.userid) : null;
  }

  /* ======================================================================
   * 2. GINI — §9.8 "Độ lệch tải". Càng thấp càng đều.
   * ==================================================================== */

  /**
   * Hệ số Gini của một dãy giá trị không âm, kết quả thuộc [0, 1].
   * Dạng sắp xếp: G = 2·Σ(i·x_i) / (n·Σx) − (n+1)/n, i đếm từ 1 trên dãy tăng dần.
   * n < 2 hoặc Σx = 0 ⇒ trả 0 (coi như tuyệt đối đều) — chặn chia 0.
   */
  function gini(giaTri) {
    var nguon = laMang(giaTri), ds = [], i, v;
    for (i = 0; i < nguon.length; i++) {
      v = Number(nguon[i]);
      if (!isFinite(v) || v < 0) v = 0; // giá trị âm / lỗi coi như 0
      ds.push(v);
    }
    var n = ds.length;
    if (n < 2) return 0;
    var tong = 0;
    for (i = 0; i < n; i++) tong += ds[i];
    if (tong <= 0) return 0;
    ds.sort(function (a, b) { return a - b; });
    var luyThua = 0;
    for (i = 0; i < n; i++) luyThua += (i + 1) * ds[i];
    var g = (2 * luyThua) / (n * tong) - (n + 1) / n;
    // Gini để 3 chữ số thập phân: 2 chữ số quá thô để phân biệt các chiến lược baseline
    return lamTron(keo(g, 0, 1), 3);
  }

  /**
   * §4.8 view USER_TAI_HIENTAI — tải hiện tại của từng người thực hiện.
   * Trả { userid: { so_nv_dang_mo, tai_trong_so, so_nv_qua_han } }.
   */
  function taiHienTai(db) {
    var kq = {}, i, u, k;
    var ungVien = dsUngVienHeThong(db);
    for (i = 0; i < ungVien.length; i++) {
      kq[ungVien[i].id] = { so_nv_dang_mo: 0, tai_trong_so: 0, so_nv_qua_han: 0 };
    }
    var mapNv = lapChiMuc(laMang(db && db.nhiemvu), 'id');
    var pc = laMang(db && db.phancong);
    for (i = 0; i < pc.length; i++) {
      var p = pc[i];
      if (!p || p.vaitro !== 'CHUTRI' || p.trangthai !== 1) continue; // chỉ phân công còn hiệu lực
      var nv = mapNv[p.idnvchitiet];
      if (!nv || !dangGiu(nv)) continue;
      u = kq[p.userid];
      if (!u) { u = kq[p.userid] = { so_nv_dang_mo: 0, tai_trong_so: 0, so_nv_qua_han: 0 }; }
      u.so_nv_dang_mo += 1;
      u.tai_trong_so += trongSoTai(nv.dokhan);
      if (nv.trangthai === 7) u.so_nv_qua_han += 1;
    }
    for (k in kq) if (Object.prototype.hasOwnProperty.call(kq, k)) {
      kq[k].tai_trong_so = lamTron(kq[k].tai_trong_so, 2);
    }
    return kq;
  }

  /** §9.8 — Gini của phân bố `so_nv_dang_mo` giữa các người thực hiện. */
  function giniTai(db) {
    var bang = taiHienTai(db), ds = [], k;
    for (k in bang) if (Object.prototype.hasOwnProperty.call(bang, k)) {
      ds.push(bang[k].so_nv_dang_mo);
    }
    return gini(ds);
  }

  /* ======================================================================
   * 3. §9.8 THỐNG KÊ HIỆU QUẢ AI — tính TỪ db.aiLog (bảng AI_GOIY_LOG §4.8)
   * ==================================================================== */

  // `ket_qua_json` có thể là chuỗi JSON, mảng ứng viên, hoặc { ungVien: [...] }
  function docKetQuaJson(gt) {
    if (!gt) return [];
    var o = gt;
    if (typeof gt === 'string') {
      try { o = JSON.parse(gt); } catch (e) { return []; }
    }
    if (Array.isArray(o)) return o;
    if (o && Array.isArray(o.ungVien)) return o.ungVien;
    if (o && Array.isArray(o.dsUngVien)) return o.dsUngVien;
    if (o && o.data && Array.isArray(o.data.ungVien)) return o.data.ungVien;
    return [];
  }

  function diemUngVien(uv) {
    if (!uv) return null;
    var d = (uv.diemTong != null) ? uv.diemTong : (uv.diem != null ? uv.diem : uv.score);

    return isFinite(d) ? d : null;
  }

  function thuHangHopLe(log) {
    var h = Number(log && log.thu_hang_da_chon);
    return (isFinite(h) && h >= 1) ? Math.round(h) : null; // null = bỏ qua gợi ý
  }

  /**
   * §9.8 — Precision@1, Precision@3, Tỷ lệ chấp nhận, MRR + hai biểu đồ của M13.
   * Mọi tỷ lệ làm tròn 2 chữ số thập phân; so ngưỡng dùng giá trị thô.
   */
  function thongKeAI(db) {
    var logs = laMang(db && db.aiLog);
    var tong = logs.length;
    var soHang1 = 0, soTop3 = 0, soChapNhan = 0, tongNghichDao = 0;
    var demHang = {}, hangLonNhat = 5, soBoQua = 0;
    var demKhoang = {}, soUngVienDaCham = 0;
    var i, j, h, log, ds, d, b;

    for (i = 0; i < KHOANG_DIEM.length; i++) demKhoang[KHOANG_DIEM[i].khoang] = 0;

    for (i = 0; i < tong; i++) {
      log = logs[i];
      h = thuHangHopLe(log);

      // Tỷ lệ chấp nhận = số lần chọn từ danh sách gợi ý / tổng số lần mở popup
      if (log && (log.co_trong_goi_y === true || log.co_trong_goi_y === 1)) soChapNhan++;

      if (h === null) {
        soBoQua++;                       // lần bỏ qua gợi ý đóng góp 0 vào MRR
      } else {
        if (h === 1) soHang1++;          // Precision@1
        if (h <= 3) soTop3++;            // Precision@3
        tongNghichDao += 1 / h;          // MRR
        demHang[h] = (demHang[h] || 0) + 1;
        if (h > hangLonNhat) hangLonNhat = h;
      }

      // Phân bố điểm: gom điểm tổng của TẤT CẢ ứng viên từng được gợi ý
      ds = docKetQuaJson(log && log.ket_qua_json);
      for (j = 0; j < ds.length; j++) {
        d = diemUngVien(ds[j]);
        if (d === null) continue;
        soUngVienDaCham++;
        for (b = 0; b < KHOANG_DIEM.length; b++) {
          if (d >= KHOANG_DIEM[b].min && d < KHOANG_DIEM[b].max) {
            demKhoang[KHOANG_DIEM[b].khoang]++;
            break;
          }
        }
      }
    }

    var precision1   = chiaAnToan(soHang1, tong);
    var precision3   = chiaAnToan(soTop3, tong);
    var tyLeChapNhan = chiaAnToan(soChapNhan, tong);
    var mrr          = chiaAnToan(tongNghichDao, tong);

    var phanBoThuHang = [];
    for (i = 1; i <= hangLonNhat; i++) {
      phanBoThuHang.push({ thuHang: i, nhan: 'Hạng ' + i, soLan: demHang[i] || 0 });
    }
    phanBoThuHang.push({ thuHang: null, nhan: 'Bỏ qua gợi ý', soLan: soBoQua });

    var phanBoDiem = [];
    for (i = 0; i < KHOANG_DIEM.length; i++) {
      phanBoDiem.push({ khoang: KHOANG_DIEM[i].khoang, soLan: demKhoang[KHOANG_DIEM[i].khoang] });
    }

    return {
      soLanGoiY: tong,
      soLanChapNhan: soChapNhan,
      soLanBoQua: soBoQua,
      soUngVienDaCham: soUngVienDaCham,
      tyLeChapNhan: lamTron(tyLeChapNhan, 2),
      precision1: lamTron(precision1, 2),
      precision3: lamTron(precision3, 2),
      mrr: lamTron(mrr, 2),
      phanBoThuHang: phanBoThuHang,
      phanBoDiem: phanBoDiem,
      giniTai: giniTai(db),
      // §9.8 — hai dòng còn lại của bảng đo hiệu quả (Gini trước/sau, đúng hạn AI vs thủ công)
      giniTruocSau: giniTaiTruocSau(db),
      dungHanTheoNguon: tyLeDungHanTheoNguon(db),
      nguong: {
        precision1: NGUONG_MUC_TIEU.precision1,
        precision3: NGUONG_MUC_TIEU.precision3,
        tyLeChapNhan: NGUONG_MUC_TIEU.tyLeChapNhan,
        mrr: NGUONG_MUC_TIEU.mrr
      },
      // §9.8 — cờ để UI tô màu; so bằng giá trị THÔ, không dùng giá trị đã làm tròn
      dat: {
        precision1: tong > 0 && precision1 >= NGUONG_MUC_TIEU.precision1,
        precision3: tong > 0 && precision3 >= NGUONG_MUC_TIEU.precision3,
        tyLeChapNhan: tong > 0 && tyLeChapNhan >= NGUONG_MUC_TIEU.tyLeChapNhan,
        mrr: tong > 0 && mrr >= NGUONG_MUC_TIEU.mrr
      }
    };
  }

  /* ======================================================================
   * 4. §3.1 M02 / §5.10 J1–J2 — DASHBOARD
   * ==================================================================== */

  function dashboard(db, today) {
    var ds = laMang(db && db.nhiemvu);
    var homNay = today || (db && db.today) || null;
    var chuaTrienKhai = 0, dangTrienKhai = 0, choXacNhan = 0, quaHan = 0;
    var sapHetHan = 0, hoanThanh = 0;
    var demTrangThai = {}, theoDv = {}, i, nv, conLai, ket;

    for (i = 0; i < ds.length; i++) {
      nv = ds[i];
      if (!nv) continue;
      ket = daKetThuc(nv);

      demTrangThai[nv.trangthai] = (demTrangThai[nv.trangthai] || 0) + 1;

      if (nv.trangthai === 3) chuaTrienKhai++;
      if (nv.trangthai === 2 || nv.trangthai === 13) dangTrienKhai++; // 13 = đang chờ duyệt gia hạn
      if (nv.trangthaiDvXuly === 10) choXacNhan++;                    // §2.2 chờ xác nhận
      if (daNghiemThu(nv)) hoanThanh++;                               // §2.6 điểm cuối

      conLai = homNay ? soNgayGiua(homNay, nv.hanxulyth) : null;
      // §2.5 — job theo hạn CHỈ chuyển 2 → 7 và 3 → 7. Vậy chỉ nhiệm vụ đang mở
      // (trangthai ∈ {2,3,7,13}) mới có thể "quá hạn" / "sắp hết hạn". Việc đã báo cáo
      // xong đang chờ xác nhận (1|5, 10) hay đã từ chối (6, *) KHÔNG được đếm vào hai
      // thẻ này — nếu đếm thì thẻ "Quá hạn" chồng lấn thẻ "Chờ xác nhận" (§3.1 M02).
      if (!ket && !laHoanThanh(nv) && nv.trangthai !== 6) {
        // Quá hạn: đã bị job I5 chuyển sang 7, HOẶC hạn đã trôi qua mà chưa kết thúc
        if (nv.trangthai === 7 || (conLai !== null && conLai < 0)) quaHan++;
        // Sắp hết hạn: còn lại 0..3 ngày và chưa kết thúc (§3.1)
        else if (conLai !== null && conLai >= 0 && conLai <= SO_NGAY_SAP_HET_HAN) sapHetHan++;
      }

      var uc = nv.unitcode || '(chưa rõ)';
      if (!theoDv[uc]) theoDv[uc] = { unitcode: uc, tongSo: 0, hoanThanh: 0 };
      theoDv[uc].tongSo++;
      if (daNghiemThu(nv)) theoDv[uc].hoanThanh++;
    }

    // Biểu đồ tròn theo trạng thái (§3.1) — giữ đủ mã của §2.1 để màu ổn định
    var theoTrangThai = [];
    for (i = 0; i < DM_TRANGTHAI.length; i++) {
      var m = DM_TRANGTHAI[i];
      theoTrangThai.push({
        ma: m.ma,
        nhan: m.nhan,
        mau: m.mau,
        soLuong: demTrangThai[m.ma] || 0,
        tyLe: lamTron(chiaAnToan(demTrangThai[m.ma] || 0, ds.length), 2)
      });
    }

    // Biểu đồ cột theo đơn vị (§5.10 J2)
    var mapDv = lapChiMuc(laMang(db && db.donvi), 'unitcode');
    var theoDonVi = [], k;
    for (k in theoDv) if (Object.prototype.hasOwnProperty.call(theoDv, k)) {
      var o = theoDv[k];
      theoDonVi.push({
        unitcode: o.unitcode,
        tendonvi: (mapDv[o.unitcode] && mapDv[o.unitcode].tendonvi) || o.unitcode,
        tongSo: o.tongSo,
        hoanThanh: o.hoanThanh,
        tyLeHoanThanh: lamTron(chiaAnToan(o.hoanThanh, o.tongSo), 2)
      });
    }
    theoDonVi.sort(function (a, b) {
      if (b.tongSo !== a.tongSo) return b.tongSo - a.tongSo;
      return String(a.tendonvi).localeCompare(String(b.tendonvi));
    });

    return {
      today: homNay,
      chuaTrienKhai: chuaTrienKhai,
      dangTrienKhai: dangTrienKhai,
      choXacNhan: choXacNhan,
      quaHan: quaHan,
      sapHetHan: sapHetHan,
      hoanThanh: hoanThanh,
      tongSo: ds.length,
      tyLeHoanThanh: lamTron(chiaAnToan(hoanThanh, ds.length), 2),
      theoTrangThai: theoTrangThai,
      theoDonVi: theoDonVi
    };
  }

  /**
   * §3.1 M02 — danh sách "Việc của tôi sắp đến hạn (≤ 3 ngày)".
   * Trả [{ id, noidung, hanxulyth, soNgayConLai, dokhan, trangthai, quaHan }].
   */
  function viecSapDenHan(db, userid, today, soNgay) {
    var homNay = today || (db && db.today) || null;
    var nguong = (typeof soNgay === 'number') ? soNgay : SO_NGAY_SAP_HET_HAN;
    var out = [], i, nv, conLai;
    if (!homNay) return out;

    var cuaToi = {}, pc = laMang(db && db.phancong);
    for (i = 0; i < pc.length; i++) {
      if (pc[i] && pc[i].trangthai === 1 && String(pc[i].userid) === String(userid)) {
        cuaToi[pc[i].idnvchitiet] = pc[i].vaitro;
      }
    }
    var ds = laMang(db && db.nhiemvu);
    for (i = 0; i < ds.length; i++) {
      nv = ds[i];
      if (!nv || !cuaToi[nv.id] || daKetThuc(nv)) continue;
      conLai = soNgayGiua(homNay, nv.hanxulyth);
      if (conLai === null || conLai > nguong) continue;
      out.push({
        id: nv.id,
        noidung: nv.noidung,
        hanxulyth: nv.hanxulyth,
        soNgayConLai: conLai,
        dokhan: nv.dokhan,
        vaitro: cuaToi[nv.id],
        trangthai: nv.trangthai,

    out.sort(function (a, b) { return a.soNgayConLai - b.soNgayConLai; });

  }

  /* ======================================================================
   * 5. §4.8 USER_HIEUSUAT — tính THẲNG bằng truy vấn
   *
   * §4.8 nói rõ: bảng USER_HIEUSUAT thuần tuý là BỘ NHỚ ĐỆM do job nền ghi
   * hằng đêm; "nếu dữ liệu ít (< 5.000 nhiệm vụ) có thể bỏ hẳn bảng này và
   * tính thẳng bằng truy vấn lúc gọi API". Demo này tính thẳng — xoá bảng

   * ==================================================================== */

  function hieuSuatNguoiDung(db, userid) {
    var uid = String(userid == null ? '' : userid);
    if (!uid) return [];

    // Các nhiệm vụ mà người này giữ vai CHỦ TRÌ (phân công còn hiệu lực)
    var idCuaToi = {}, pc = laMang(db && db.phancong), i, k;
    for (i = 0; i < pc.length; i++) {

    function dong(lv) {
      var ma = lv || '(chưa gán)';
      if (!bang[ma]) {
        bang[ma] = {
          linhvuc: ma, tenLinhVuc: ma,
          so_nv_hoanthanh: 0, so_nv_dunghan: 0, so_nv_bi_tralai: 0, so_lan_giahan: 0,
          so_nv_dang_mo: 0
        };
      }
      return bang[ma];
    }

    var mapLvCuaNv = {};
    var ds = laMang(db && db.nhiemvu), nv, d;
    for (i = 0; i < ds.length; i++) {
      nv = ds[i];
      if (!nv || !idCuaToi[nv.id]) continue;
      mapLvCuaNv[nv.id] = nv.linhvuc || '(chưa gán)';
      d = dong(nv.linhvuc);
      // §4.8: so_nv_hoanthanh = trangthai ∈ {1,5} VÀ trangthaiDvXuly = 11
      if (daNghiemThu(nv)) d.so_nv_hoanthanh++;
      // §4.8 "đếm riêng trangthai = 1"; bám §9.4 S3 nên vẫn yêu cầu đã nghiệm thu
      if (nv.trangthai === 1 && nv.trangthaiDvXuly === 11) d.so_nv_dunghan++;
      // §4.8: so_lan_giahan = tổng solangiahan
      d.so_lan_giahan += Number(nv.solangiahan) || 0;
      if (dangGiu(nv)) d.so_nv_dang_mo++;
    }

    // §4.8: so_nv_bi_tralai = đếm bản ghi XULY_NHIEMVU có trangthaiDvXuly = 12.
    // Lưu ý: `useridXuly` của bản ghi này là NGƯỜI GIAO (người chấm chưa đạt),
    // nên phải quy về nhiệm vụ do `uid` chủ trì, không lọc theo useridXuly.
    var xl = laMang(db && db.xuly), x;
    for (i = 0; i < xl.length; i++) {
      x = xl[i];
      if (!x || !idCuaToi[x.idCtnv]) continue;
      var biTraLai = (x.trangthaiDvXuly === 12) ||
                     (x.loai === 'NGHIEMTHU' && x.trangthaiXuly === 12);
      if (biTraLai) dong(mapLvCuaNv[x.idCtnv]).so_nv_bi_tralai++;

    var mapLv = lapChiMuc(laMang(db && db.linhvuc), 'ma');
    var out = [];
    for (k in bang) if (Object.prototype.hasOwnProperty.call(bang, k)) {
      var r = bang[k];
      r.tenLinhVuc = (mapLv[r.linhvuc] && mapLv[r.linhvuc].ten) || r.linhvuc;

    out.sort(function (a, b) {
      if (b.so_nv_hoanthanh !== a.so_nv_hoanthanh) return b.so_nv_hoanthanh - a.so_nv_hoanthanh;

  }

  /* ======================================================================
   * 6. §4.4 — ĐƯỜNG TIẾN ĐỘ THEO THỜI GIAN
   *
   * Cải tiến so với hệ gốc: hệ gốc KHÔNG lưu vết `mucdoht` theo thời gian
   * (tab Lịch sử không hiển thị % từng lần), nên không vẽ được đường tiến độ.
   * App mới lưu ảnh chụp % trong XULY_NHIEMVU ⇒ dựng lại được đường này.
   * ==================================================================== */

    var id = String(idnv == null ? '' : idnv);
    if (!id) return [];

    var xl = laMang(db && db.xuly), moc = [], i, x, ngay;
    for (i = 0; i < xl.length; i++) {
      x = xl[i];
      if (!x || String(x.idCtnv) !== id) continue;
      if (x.loai !== 'TIENDO' && x.loai !== 'BAOCAO') continue;
      if (x.mucdoht == null || !isFinite(Number(x.mucdoht))) continue;
      ngay = ngayCuaChuoi(x.ngayxuly);
      if (!ngay) continue;
      moc.push({ ngay: ngay, thoiDiem: String(x.ngayxuly), mucdoht: Math.round(keo(x.mucdoht, 0, 100)) });
    }
    moc.sort(function (a, b) { return a.thoiDiem < b.thoiDiem ? -1 : (a.thoiDiem > b.thoiDiem ? 1 : 0); });

    // Gộp nhiều lần báo cáo trong cùng một ngày: giữ mốc cuối cùng của ngày đó
    var out = [];
    for (i = 0; i < moc.length; i++) {
      if (out.length && out[out.length - 1].ngay === moc[i].ngay) out[out.length - 1].mucdoht = moc[i].mucdoht;
      else out.push({ ngay: moc[i].ngay, mucdoht: moc[i].mucdoht });
    }

    // Điểm gốc: ngày giao, tiến độ 0% — để đường biểu diễn có điểm xuất phát
    var mapNv = lapChiMuc(laMang(db && db.nhiemvu), 'id');
    var nv = mapNv[id];
    if (nv && nv.ngaygiao) {
      var ngayGiao = ngayCuaChuoi(nv.ngaygiao);
      if (ngayGiao && (!out.length || out[0].ngay > ngayGiao)) {
        out.unshift({ ngay: ngayGiao, mucdoht: 0 });
      }
    }
    return out;
  }

  /* ======================================================================
   * 7. §9.4 — ĐẶC TRƯNG S1 / S4 DÙNG CHO BASELINE
   *
   * Ưu tiên gọi window.AiEngine.tinhDacTrung nếu module đó tồn tại VÀ trả về
   * số hợp lệ trong [0,1]; ngược lại tự tính theo đúng công thức §9.4 để
   * baseline không phụ thuộc thứ tự nạp tệp.
   * ==================================================================== */

  // Gom số liệu lịch sử một lần cho cả tập ứng viên (nhanh hơn tính lẻ từng người)
  function gomChiSo(db) {
    var htTheoLv = {}, htTong = {}, tai = taiHienTai(db);
    var mapNv = lapChiMuc(laMang(db && db.nhiemvu), 'id');
    var pc = laMang(db && db.phancong), i;
    for (i = 0; i < pc.length; i++) {
      var p = pc[i];
      if (!p || p.vaitro !== 'CHUTRI' || p.trangthai !== 1) continue;
      var nv = mapNv[p.idnvchitiet];
      // §9.4 S1: chỉ đếm việc ĐÃ NGHIỆM THU (trangthai ∈ {1,5} VÀ trangthaiDvXuly = 11)
      if (!nv || !daNghiemThu(nv)) continue;
      var uid = String(p.userid);
      var lv = nv.linhvuc || '(chưa gán)';
      if (!htTheoLv[uid]) htTheoLv[uid] = {};
      htTheoLv[uid][lv] = (htTheoLv[uid][lv] || 0) + 1;
      htTong[uid] = (htTong[uid] || 0) + 1;
    }
    return { htTheoLv: htTheoLv, htTong: htTong, tai: tai, mapLinhVuc: lapChiMuc(laMang(db && db.linhvuc), 'ma') };
  }

  // §9.4 S1 — Chuyên môn, suy từ lịch sử
  function tinhS1(chiSo, uid, linhvuc) {
    var theoLv = chiSo.htTheoLv[uid] || {};
    // §9.5 cold start: nhiệm vụ không có lĩnh vực ⇒ tính trên TỔNG số việc đã hoàn thành
    if (!linhvuc) return keo(chiaAnToan(chiSo.htTong[uid] || 0, NGUONG_CHUYEN_MON), 0, 1);

    var n = theoLv[linhvuc] || 0;
    if (n > 0) return Math.min(1, n / NGUONG_CHUYEN_MON);

    // n = 0 ⇒ xét các lĩnh vực CÙNG NHÓM CHA, chiết khấu 50%
    var lv = chiSo.mapLinhVuc[linhvuc];
    var cha = lv ? lv.nhomCha : null;
    if (!cha) return 0;
    var nPhu = 0, k;
    for (k in theoLv) if (Object.prototype.hasOwnProperty.call(theoLv, k)) {
      if (k === linhvuc) continue;
      var lv2 = chiSo.mapLinhVuc[k];
      if (lv2 && lv2.nhomCha === cha) nPhu += theoLv[k];
    }
    return 0.5 * Math.min(1, nPhu / NGUONG_CHUYEN_MON);
  }

  // §9.4 S4 — Khối lượng hiện tại (càng rảnh điểm càng cao)
  function tinhS4(chiSo, user) {
    var t = chiSo.tai[String(user.id)];
    var tai = t ? t.tai_trong_so : 0;

    return keo(1 - chiaAnToan(tai, K), 0, 1);

  // Bộ chuyển đổi mềm cho window.AiEngine.tinhDacTrung (chữ ký chưa chắc chắn)

    if (!E || typeof E.tinhDacTrung !== 'function' || _cachDacTrung === -2) return null;

      function () { return E.tinhDacTrung(db, user, nv); },
      function () { return E.tinhDacTrung(db, nv, user); },
      function () { return E.tinhDacTrung(user, nv, db); },
      function () { return E.tinhDacTrung(db, user.id, nv); }

    if (_cachDacTrung >= 0) {

  /* ======================================================================
   * 8. §9.8 SO SÁNH BASELINE — đánh giá kiểu "time-split", CHỐNG RÒ RỈ DỮ LIỆU
   *
   * Ý tưởng: nhiệm vụ ĐÃ NGHIỆM THU trong lịch sử được coi là "đáp án" —
   * người thực sự làm là người đúng. Với mỗi nhiệm vụ X, ta dựng lại ảnh chụp
   * cơ sở dữ liệu ĐÚNG THỜI ĐIỂM TRƯỚC KHI GIAO X rồi mới chạy 4 chiến lược.
   *
   * BỐN LỚP CHẶN RÒ RỈ (data leakage):
   *   L1. Cắt theo thời gian: chỉ giữ nhiệm vụ có `ngaygiao < X.ngaygiao`.
   *       Bản thân X và mọi nhiệm vụ giao SAU X bị loại — kể cả nhiệm vụ giao
   *       cùng ngày (dùng so sánh "<" chặt, không "<=") vì trong ngày không có
   *       thứ tự giờ đáng tin.
   *   L2. Che kết quả tương lai của các nhiệm vụ CŨ chưa xong tại thời điểm X:
   *       nhiệm vụ giao trước X nhưng `ngayhoanthanhthucte >= X.ngaygiao` được
   *       hạ về (trangthai = 2, trangthaiDvXuly = null). Nếu bỏ bước này, người
   *       chủ trì của chúng được cộng điểm chuyên môn/hiệu quả bằng thông tin
   *       của TƯƠNG LAI — đây là chỗ rò rỉ tinh vi nhất, dễ bỏ sót nhất.
   *   L2b. Dựng lại các trường "động" của MỌI nhiệm vụ còn mở tại mốc: `trangthai = 7`
   *       do job I5 chạy SAU mốc, `solangiahan` / `trangthaixulygiahan` / `hanxulyth`
   *       do duyệt gia hạn SAU mốc đều là dữ liệu tương lai. §9.4 S5 (đếm trangthai = 7)
   *       và §9.4 S3(c) (cộng `solangiahan` trên MỌI việc CHUTRI) đọc thẳng các trường
   *       này, nên không khôi phục về mốc là còn rò rỉ.
   *   L3. Cắt bảng phụ thuộc: `phancong`, `xuly`, `giahan`, `aiLog` chỉ giữ bản
   *       ghi thuộc nhiệm vụ còn lại VÀ có mốc thời gian < X.ngaygiao. Nhờ vậy
   *       phân công của chính X biến mất ⇒ không chiến lược nào "nhìn thấy" đáp án.
   *       HẠN CHẾ đã biết: `NHIEMVU_PHANCONG` (§4.3) chỉ có `createdate`, KHÔNG có mốc
   *       thời gian thu hồi, nên bản ghi bị thu hồi (`trangthai = 0`) SAU mốc vẫn bị
   *       coi là đã thu hồi ⇒ tải tại mốc có thể thiếu một phần. Không sửa được bằng
   *       dữ liệu hiện có; ghi rõ ở đây thay vì khẳng định đã lọc sạch.
   *   L4. `db.today` của ảnh chụp được đặt lại = X.ngaygiao, để mọi phép tính
   *       quá hạn / tải hiện tại đúng mốc thời gian đó, không dùng ngày hôm nay.
   *
   * Bản sao X thêm lại vào ảnh chụp ở dạng TRUNG TÍNH (trangthai = 3, chưa có
   * phân công, chưa nghiệm thu) để engine nào tra nhiệm vụ theo id vẫn tìm thấy,
   * mà không đóng góp bất kỳ điểm nào cho ai.
   *
   * Mọi đối tượng đều được sao chép nông trước khi sửa — KHÔNG đụng vào `db` gốc.
   * ==================================================================== */

  function saoChepNong(o) {
    var r = {}, k;
    for (k in o) if (Object.prototype.hasOwnProperty.call(o, k)) r[k] = o[k];
    return r;
  }

  /**
   * L2b — trạng thái GIA HẠN của một nhiệm vụ đúng thời điểm `moc` (§4.5, §2.4 T11–T13).
   * Trả { soLan, hanCu, choDuyet }:
   *   soLan    = số lần gia hạn ĐÃ ĐƯỢC DUYỆT trước mốc (§9.4 S3c chỉ được cộng chừng này)
   *   hanCu    = `hanxulyth_cu` của lần duyệt SỚM NHẤT sau mốc ⇒ chính là hạn tại mốc
   *   choDuyet = có đề xuất tạo trước mốc mà đến mốc vẫn chưa được xử lý (§2.4 T11)

    var soLan = 0, hanCu = null, ngayDuyetSom = null, choDuyet = false, i, g, cd, nd, xongTruoc;
    for (i = 0; i < dsGiaHan.length; i++) {
      g = dsGiaHan[i];
      if (!g || String(g.idCtnv) !== String(idnv)) continue;
      cd = String(g.createDate || '');
      if (!(cd < moc)) continue;                    // đề xuất tạo sau mốc ⇒ lúc đó chưa có
      nd = String(g.ngayduyet || '');
      xongTruoc = !!nd && nd < moc;                 // đã duyệt / đã từ chối trước mốc
      if (xongTruoc) {
        if (g.trangThai === 11) soLan++;
      } else {
        choDuyet = true;                            // tại mốc vẫn đang chờ người giao xử lý

            (ngayDuyetSom === null || nd < ngayDuyetSom)) {

  function taoAnhChupTruocKhiGiao(db, X) {
    var moc = X.ngaygiao;
    var giuId = {}, dsNv = [], i, nv, b, ketThuc, xongTruocMoc, gh;
    var dsGiaHanGoc = laMang(db.giahan);

    var goc = laMang(db.nhiemvu);
    for (i = 0; i < goc.length; i++) {
      nv = goc[i];
      if (!nv || nv.id === X.id) continue;
      if (!nv.ngaygiao || !(nv.ngaygiao < moc)) continue; // L1 — cắt theo thời gian
      b = saoChepNong(nv);

      ketThuc = b.ngayhoanthanhthucte || b.updatedate || null;
      xongTruocMoc = daKetThuc(b) && !!ketThuc && ketThuc < moc;
      if (daKetThuc(b) && !xongTruocMoc) {
