<title>Phân hệ Giao nhiệm vụ QLNV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* ============================================================
   Phân hệ Giao nhiệm vụ QLNV — demo một tệp
   Bảng màu: nền giấy lạnh, chrome mực, điểm nhấn xanh mực công văn.
   Màu ngữ nghĩa của 2 trục trạng thái tách hẳn khỏi màu điểm nhấn.
   ============================================================ */
:root{
  --paper:#F1F4F5;
  --surface:#FFFFFF;
  --surface-2:#F7F9F9;
  --surface-3:#E9EEEF;
  --ink:#0F1F28;
  --ink-2:#1B3038;
  --text:#16262E;
  --text-2:#4A6068;
  --text-3:#778D94;
  --line:#D8E0E2;
  --line-2:#C3CFD2;
  --accent:#0B6E6B;
  --accent-hi:#0A8481;
  --accent-soft:#DDECEB;
  --accent-ink:#FFFFFF;

  /* Trục A — trạng thái nhiệm vụ (§2.1) */
  --st-mute:#68797F;   /* 3 Chưa triển khai */
  --st-info:#2A5C8F;   /* 2 Đang triển khai */
  --st-bad:#A63A2E;    /* 7 Quá hạn, 6 Từ chối */
  --st-good:#1E7443;   /* 1 / 5 Hoàn thành */
  --st-warn:#8E6410;   /* 10 Chờ xác nhận */
  --st-spec:#61479B;   /* 13 Gia hạn */
  --st-dead:#5A6367;   /* 97 Đã thu hồi */

  --st-mute-bg:#E7EBEC; --st-info-bg:#E1EAF4; --st-bad-bg:#F6E4E1;
  --st-good-bg:#E0EFE6; --st-warn-bg:#F6EDD9; --st-spec-bg:#EBE5F6; --st-dead-bg:#E4E7E8;

  --shadow-1:0 1px 2px rgba(15,31,40,.06), 0 1px 1px rgba(15,31,40,.04);
  --shadow-2:0 6px 24px rgba(15,31,40,.12), 0 2px 6px rgba(15,31,40,.06);
  --shadow-3:0 24px 60px rgba(15,31,40,.24);

  --ff-ui:"Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --ff-mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
  --ff-doc:"Source Serif 4", Cambria, Georgia, serif;

  --r-sm:3px; --r-md:5px; --r-lg:8px;
  --rail:224px; --topbar:52px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B1417;
    --surface:#111D21;
    --surface-2:#16242A;
    --surface-3:#1E2F35;
    --ink:#0A1215;
    --ink-2:#132025;
    --text:#DFE8E8;
    --text-2:#9FB2B5;
    --text-3:#75898D;
    --line:#233439;
    --line-2:#31474E;
    --accent:#3EA9A2;
    --accent-hi:#54C0B8;
    --accent-soft:#173634;
    --accent-ink:#04191A;

    --st-mute:#95A7AC; --st-info:#7FADDD; --st-bad:#E68A7C;
    --st-good:#72C295; --st-warn:#D9B364; --st-spec:#AE97E0; --st-dead:#8A989C;
    --st-mute-bg:#1D2A2F; --st-info-bg:#152833; --st-bad-bg:#2E1D1B;
    --st-good-bg:#152B21; --st-warn-bg:#2C2415; --st-spec-bg:#221C33; --st-dead-bg:#1B2225;

    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 6px 24px rgba(0,0,0,.5);
    --shadow-3:0 24px 60px rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --paper:#0B1417; --surface:#111D21; --surface-2:#16242A; --surface-3:#1E2F35;
  --ink:#0A1215; --ink-2:#132025;
  --text:#DFE8E8; --text-2:#9FB2B5; --text-3:#75898D;
  --line:#233439; --line-2:#31474E;
  --accent:#3EA9A2; --accent-hi:#54C0B8; --accent-soft:#173634; --accent-ink:#04191A;
  --st-mute:#95A7AC; --st-info:#7FADDD; --st-bad:#E68A7C;
  --st-good:#72C295; --st-warn:#D9B364; --st-spec:#AE97E0; --st-dead:#8A989C;
  --st-mute-bg:#1D2A2F; --st-info-bg:#152833; --st-bad-bg:#2E1D1B;
  --st-good-bg:#152B21; --st-warn-bg:#2C2415; --st-spec-bg:#221C33; --st-dead-bg:#1B2225;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 6px 24px rgba(0,0,0,.5);
  --shadow-3:0 24px 60px rgba(0,0,0,.65);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--text);
  font-family:var(--ff-ui); font-size:13.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:600; text-wrap:balance; letter-spacing:-.01em}
p{margin:0}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent-hi); outline-offset:2px; border-radius:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}

/* ---------- Khung ứng dụng ---------- */
.app{display:grid; grid-template-columns:var(--rail) 1fr; min-height:100vh}

.rail{
  background:var(--ink); color:#C8D6D9; display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.rail-head{padding:16px 16px 14px; border-bottom:1px solid rgba(255,255,255,.09)}
.rail-mark{display:flex; align-items:center; gap:9px}
.rail-badge{
  width:26px; height:26px; flex:none; border-radius:var(--r-sm);
  background:var(--accent); color:#fff; display:grid; place-items:center;
  font-family:var(--ff-mono); font-weight:600; font-size:11px; letter-spacing:.02em;
}
.rail-title{font-size:12.5px; font-weight:600; color:#F0F5F5; line-height:1.25}
.rail-sub{font-size:10.5px; color:#7E969B; margin-top:1px}

.rail-group{padding:14px 10px 4px}
.rail-label{
  font-size:9.5px; letter-spacing:.13em; text-transform:uppercase;
  color:#63797E; padding:0 8px 6px; font-weight:600;
}
.nav-item{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:7px 9px; border:0; background:none; color:#B7C8CC; cursor:pointer;
  border-radius:var(--r-md); font-size:12.5px; position:relative;
}
.nav-item:hover{background:rgba(255,255,255,.06); color:#EAF2F2}
.nav-item[aria-current="page"]{background:rgba(62,169,162,.16); color:#fff}
.nav-item[aria-current="page"]::before{
  content:""; position:absolute; left:-10px; top:6px; bottom:6px; width:2px;
  background:var(--accent-hi); border-radius:0 2px 2px 0;
}
.nav-code{
  font-family:var(--ff-mono); font-size:9.5px; color:#6D858A;
  border:1px solid rgba(255,255,255,.12); border-radius:2px; padding:0 3px; flex:none;
}
.nav-item[aria-current="page"] .nav-code{color:#9EDBD6; border-color:rgba(158,219,214,.35)}
.nav-count{margin-left:auto; font-family:var(--ff-mono); font-size:10.5px; color:#8AA1A6}
.rail-foot{margin-top:auto; padding:12px; border-top:1px solid rgba(255,255,255,.09); font-size:10.5px; color:#6D858A}
.rail-foot b{color:#A9BFC3; font-weight:500}

/* ---------- Thanh trên ---------- */
.main{display:flex; flex-direction:column; min-width:0}
.topbar{
  position:sticky; top:0; z-index:30; height:var(--topbar); flex:none;
  background:var(--surface); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:14px; padding:0 18px;
}
.topbar h1{font-size:14px}
.topbar-crumb{font-size:11px; color:var(--text-3); font-family:var(--ff-mono)}
.topbar-right{margin-left:auto; display:flex; align-items:center; gap:10px}

.who{display:flex; align-items:center; gap:8px; padding:3px 4px 3px 10px; border:1px solid var(--line); border-radius:999px; background:var(--surface-2)}
.who label{font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:var(--text-3); font-weight:600}
.who select{
  font:inherit; font-size:12px; border:0; background:none; color:var(--text);
  padding:3px 6px; border-radius:999px; cursor:pointer; max-width:260px;
}
.who select:hover{background:var(--surface-3)}

.btn{
  display:inline-flex; align-items:center; gap:6px; padding:6px 11px;
  border:1px solid var(--line-2); background:var(--surface); color:var(--text);
  border-radius:var(--r-md); cursor:pointer; font-size:12.5px; white-space:nowrap;
}
.btn:hover{background:var(--surface-3)}
.btn:disabled{opacity:.42; cursor:not-allowed}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:500}
.btn-primary:hover{background:var(--accent-hi); border-color:var(--accent-hi)}
.btn-ai{background:linear-gradient(180deg,var(--accent-hi),var(--accent)); border-color:var(--accent); color:#fff; font-weight:500}
.btn-ai:hover{filter:brightness(1.08)}
.btn-good{border-color:var(--st-good); color:var(--st-good); background:var(--st-good-bg); font-weight:500}
.btn-bad{border-color:var(--st-bad); color:var(--st-bad); background:var(--st-bad-bg); font-weight:500}
.btn-sm{padding:3px 8px; font-size:11.5px}
.btn-ghost{border-color:transparent; background:none; color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-3); color:var(--text)}

/* ---------- Ruy-băng 7 bước nghiệp vụ (§1) ---------- */
.ribbon{
  flex:none; background:var(--surface-2); border-bottom:1px solid var(--line);
  padding:9px 18px; display:flex; align-items:center; gap:0; overflow-x:auto;
}
.ribbon-lab{
  font-size:9.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--text-3);
  font-weight:600; margin-right:14px; white-space:nowrap;
}
.step{display:flex; align-items:center; gap:7px; padding:3px 11px 3px 9px; white-space:nowrap; position:relative}
.step + .step::before{
  content:""; position:absolute; left:-1px; top:50%; width:8px; height:1px; background:var(--line-2);
}
.step-n{
  width:17px; height:17px; flex:none; border-radius:50%; display:grid; place-items:center;
  font-family:var(--ff-mono); font-size:9.5px; font-weight:600;
  background:var(--surface-3); color:var(--text-3); border:1px solid var(--line-2);
}
.step span{font-size:11.5px; color:var(--text-3)}
.step.done .step-n{background:var(--accent-soft); color:var(--accent); border-color:var(--accent)}
.step.done span{color:var(--text-2)}
.step.now .step-n{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.step.now span{color:var(--text); font-weight:600}
.step.loop{margin-left:6px; padding-left:14px}
.step.loop::after{content:"↩"; position:absolute; left:0; color:var(--st-warn); font-size:12px}

/* ---------- Vùng nội dung ---------- */
.view{padding:20px 22px 56px; max-width:1320px; width:100%}
.view-head{display:flex; align-items:flex-end; gap:14px; margin-bottom:16px; flex-wrap:wrap}
.view-head h2{font-size:19px; letter-spacing:-.02em}
.view-head .lede{font-size:12.5px; color:var(--text-2); max-width:62ch}
.view-head .spacer{margin-left:auto}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-1)}
.panel-head{
  display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--line);
}
.panel-head h3{font-size:13px}
.panel-head .sub{font-size:11.5px; color:var(--text-3)}
.panel-head .spacer{margin-left:auto}
.panel-body{padding:14px}
.panel-body.tight{padding:0}

.grid{display:grid; gap:14px}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
@media (max-width:1080px){.g-4{grid-template-columns:repeat(2,minmax(0,1fr))} .g-3,.g-2,.g-main{grid-template-columns:minmax(0,1fr)}}

/* ---------- Thẻ đếm ---------- */
.stat{padding:13px 14px; border-left:2px solid var(--line-2); background:var(--surface); border-radius:0 var(--r-md) var(--r-md) 0; border-top:1px solid var(--line); border-right:1px solid var(--line); border-bottom:1px solid var(--line)}
.stat .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--text-3); font-weight:600}
.stat .v{font-family:var(--ff-mono); font-size:27px; font-weight:500; line-height:1.15; margin-top:3px; font-variant-numeric:tabular-nums}
.stat .n{font-size:11.5px; color:var(--text-3); margin-top:1px}
.stat.s-mute{border-left-color:var(--st-mute)} .stat.s-mute .v{color:var(--st-mute)}
.stat.s-info{border-left-color:var(--st-info)} .stat.s-info .v{color:var(--st-info)}
.stat.s-warn{border-left-color:var(--st-warn)} .stat.s-warn .v{color:var(--st-warn)}
.stat.s-bad{border-left-color:var(--st-bad)}   .stat.s-bad .v{color:var(--st-bad)}
.stat.s-good{border-left-color:var(--st-good)} .stat.s-good .v{color:var(--st-good)}

/* ---------- Chip trạng thái kép (đặc trưng của hệ: 2 trục §2) ---------- */
.duo{display:inline-flex; align-items:stretch; border-radius:var(--r-sm); overflow:hidden; border:1px solid var(--line); font-size:11px; white-space:nowrap; vertical-align:middle}
.duo b{font-weight:500; padding:2px 7px; display:inline-flex; align-items:center; gap:5px}
.duo .ma{font-family:var(--ff-mono); font-size:9.5px; opacity:.75}
.duo .ax-b{border-left:1px solid var(--line)}
.duo .ax-b.none{background:var(--surface-2); color:var(--text-3)}
.c-mute{background:var(--st-mute-bg); color:var(--st-mute)}
.c-info{background:var(--st-info-bg); color:var(--st-info)}
.c-bad{background:var(--st-bad-bg); color:var(--st-bad)}
.c-good{background:var(--st-good-bg); color:var(--st-good)}
.c-warn{background:var(--st-warn-bg); color:var(--st-warn)}
.c-spec{background:var(--st-spec-bg); color:var(--st-spec)}
.c-dead{background:var(--st-dead-bg); color:var(--st-dead)}

.tag{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; padding:1px 6px; border-radius:999px; border:1px solid currentColor; white-space:nowrap}
.tag.solid{border-color:transparent}

/* ---------- Bảng ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:12.5px}
th{
  text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.09em;
  color:var(--text-3); font-weight:600; padding:8px 12px; border-bottom:1px solid var(--line);
  background:var(--surface-2); white-space:nowrap; position:sticky; top:0;
}
td{padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num{font-family:var(--ff-mono); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
td.acts{white-space:nowrap; text-align:right}
td .noidung{display:block; max-width:46ch}
.meta{font-size:11px; color:var(--text-3); margin-top:2px}
.mono{font-family:var(--ff-mono); font-variant-numeric:tabular-nums}

/* Badge hạn (§3.3 M08) */
.han{font-family:var(--ff-mono); font-size:11px; white-space:nowrap}
.han.qua{color:var(--st-bad); font-weight:600}
.han.sap{color:var(--st-warn); font-weight:600}

/* Thanh tiến độ */
.prog{display:flex; align-items:center; gap:7px}
.prog-track{width:56px; height:5px; border-radius:3px; background:var(--surface-3); overflow:hidden; flex:none}
.prog-fill{height:100%; background:var(--accent); border-radius:3px}
.prog span{font-family:var(--ff-mono); font-size:11px; color:var(--text-2); font-variant-numeric:tabular-nums}

/* ---------- Chip lọc ---------- */
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  padding:4px 10px; border:1px solid var(--line-2); background:var(--surface); border-radius:999px;
  cursor:pointer; font-size:12px; color:var(--text-2); display:inline-flex; gap:6px; align-items:center;
}
.chip:hover{border-color:var(--accent); color:var(--text)}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:#F0F5F5}
.chip .n{font-family:var(--ff-mono); font-size:10.5px; opacity:.72}

/* ---------- Văn bản chỉ đạo (mặt chữ tài liệu) ---------- */
.vb-title{font-family:var(--ff-doc); font-size:14.5px; line-height:1.45}
.vb-so{font-family:var(--ff-mono); font-size:11.5px; color:var(--accent); font-weight:500}

/* ---------- Lưới phân công (M05) ---------- */
.pc-row{border:1px solid var(--line); border-radius:var(--r-md); padding:12px; background:var(--surface-2); display:grid; gap:10px}
.pc-row + .pc-row{margin-top:10px}
.pc-top{display:flex; gap:10px; align-items:flex-start}
.pc-stt{
  width:22px; height:22px; flex:none; border-radius:var(--r-sm); background:var(--surface-3);
  color:var(--text-2); display:grid; place-items:center; font-family:var(--ff-mono); font-size:11px;
}
.field{display:grid; gap:4px; min-width:0}
.field > label{font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:var(--text-3); font-weight:600}
input[type=text],input[type=date],input[type=number],select,textarea{
  font:inherit; font-size:12.5px; padding:6px 8px; border:1px solid var(--line-2);
  border-radius:var(--r-sm); background:var(--surface); color:var(--text); width:100%;
}
textarea{resize:vertical; min-height:62px; line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--accent); outline:none; box-shadow:0 0 0 2px var(--accent-soft)}
.pc-fields{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px}
@media (max-width:900px){.pc-fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pc-people{display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap}
.picked{display:flex; gap:5px; flex-wrap:wrap; min-height:26px; align-items:center; padding:3px; border:1px dashed var(--line-2); border-radius:var(--r-sm); flex:1; min-width:190px; background:var(--surface)}
.picked:empty::after{content:"Chưa chọn người chủ trì"; color:var(--text-3); font-size:11.5px; padding:2px 5px}
.person{display:inline-flex; align-items:center; gap:5px; background:var(--accent-soft); color:var(--accent); border-radius:999px; padding:2px 4px 2px 9px; font-size:11.5px}
.person button{border:0; background:none; cursor:pointer; color:inherit; opacity:.65; line-height:1; padding:0 3px; font-size:13px}
.person button:hover{opacity:1}
.person.ph{background:var(--surface-3); color:var(--text-2)}
.badge-ai{font-family:var(--ff-mono); font-size:9px; background:var(--accent); color:#fff; border-radius:2px; padding:0 3px}

/* ---------- Hộp thoại ---------- */
dialog{
  border:0; padding:0; background:var(--surface); color:var(--text);
  border-radius:var(--r-lg); box-shadow:var(--shadow-3); max-width:min(940px,94vw); width:100%;
  max-height:90vh; overflow:hidden;
}
dialog::backdrop{background:rgba(9,20,25,.55); backdrop-filter:blur(2px)}
.dlg{display:flex; flex-direction:column; max-height:90vh}
.dlg-head{display:flex; align-items:flex-start; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); flex:none}
.dlg-head h3{font-size:14.5px}
.dlg-head .sub{font-size:11.5px; color:var(--text-3); margin-top:2px}
.dlg-head .x{margin-left:auto}
.dlg-body{padding:14px 16px; overflow-y:auto; flex:1}
.dlg-foot{padding:11px 16px; border-top:1px solid var(--line); display:flex; gap:8px; align-items:center; flex:none; background:var(--surface-2); flex-wrap:wrap}
.dlg-foot .note{font-size:11px; color:var(--text-3); max-width:52ch}
.dlg-foot .spacer{margin-left:auto}

/* ---------- Popup AI gợi ý (M06) ⭐ ---------- */
.ai-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 14px; background:var(--accent-soft); border-radius:var(--r-md); margin-bottom:12px}
.ai-bar .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--accent); font-weight:600}
.ai-bar .v{font-size:12.5px}
.ai-warn{background:var(--st-warn-bg); color:var(--st-warn); padding:8px 12px; border-radius:var(--r-md); font-size:12px; margin-bottom:10px; border-left:2px solid var(--st-warn)}

<script>
/* =====================================================================
 * seed.js — BỘ DỮ LIỆU MÔ PHỎNG cho demo "Giao nhiệm vụ tích hợp AI gợi ý
 * người thực hiện phù hợp".
 *
 * Bám đặc tả DAC-TA-PHAN-HE-GIAO-NHIEM-VU.md:
 *   §4    mô hình dữ liệu (tên trường giữ nguyên của hệ gốc QLNV)
 *   §8-T9 "sinh >= 300 nhiệm vụ lịch sử, 5-8 lĩnh vực, 15-20 người dùng"
 *   §9.2  bốn nhóm đặc trưng S1..S5 -> dữ liệu phải đủ để phân biệt
 *   §9.3  lọc cứng (tài khoản khoá, ngoài phạm vi đơn vị, quá tải)
 *   §9.5  cold start (người mới, chưa từng làm lĩnh vực)
 *   §9.8  Precision@1/@3, tỷ lệ chấp nhận, MRR
 *
 * Chạy lại LUÔN cho ra dữ liệu Y HỆT: mọi số ngẫu nhiên đều lấy từ PRNG
 * mulberry32 có seed cố định (20260905), KHÔNG dùng Math.random().
 *
 * Xuất: window.SeedData = { taoDuLieuMau(today), tuKiemTra(db), ... }
 * Tệp này ĐỘC LẬP — không gọi Flow / AiEngine / Metrics.
 * ===================================================================== */
(function () {
  'use strict';

  /* ===================================================================
   * 1. PRNG có seed (mulberry32)
   * =================================================================== */
  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var SEED_MAC_DINH = 20260905;

  function taoBoNgauNhien(seed) {
    var r = mulberry32(seed);
    return {
      so: r,
      // số nguyên trong [min, max]
      nguyen: function (min, max) {
        if (max < min) max = min;
        return min + Math.floor(r() * (max - min + 1));
      },
      chon: function (ds) { return ds[Math.floor(r() * ds.length)]; },
      kha: function (p) { return r() < p; },
      // trộn Fisher-Yates, trả về mảng mới
      tron: function (ds) {
        var a = ds.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(r() * (i + 1));
          var t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
      }
    };
  }

  function dayChiSo(n) {
    var a = [];
    for (var i = 0; i < n; i++) a.push(i);
    return a;
  }

  /* ===================================================================
   * 2. Tiện ích ngày tháng (chuỗi 'yyyy-mm-dd' / 'yyyy-mm-ddTHH:mm')
   *    Không phụ thuộc Flow.Ngay — seed.js phải chạy độc lập.
   * =================================================================== */
  var MOT_NGAY = 86400000;

  function soCuaNgay(iso) {
    var p = String(iso).slice(0, 10).split('-');
    return Date.UTC(+p[0], +p[1] - 1, +p[2]) / MOT_NGAY;
  }
  function ngayTuSo(n) {
    return new Date(n * MOT_NGAY).toISOString().slice(0, 10);
  }
  function themNgay(iso, k) {
    return ngayTuSo(soCuaNgay(iso) + k);
  }
  function hai(n) { return (n < 10 ? '0' : '') + n; }
  // đổi mốc 'yyyy-mm-ddTHH:mm' <-> số PHÚT, dùng để so sánh / đẩy giờ trong cùng một ngày
  function phutCuaMoc(s) {
    s = String(s);
    return soCuaNgay(s) * 1440 + (+s.slice(11, 13) || 0) * 60 + (+s.slice(14, 16) || 0);
  }
  function mocTuPhut(n) {
    var ngay = Math.floor(n / 1440), phut = n - ngay * 1440;
    return ngayTuSo(ngay) + 'T' + hai(Math.floor(phut / 60)) + ':' + hai(phut % 60);
  }
  // gắn giờ hành chính ngẫu nhiên -> chuỗi datetime 'yyyy-mm-ddTHH:mm'
  function gioLamViec(iso, rnd) {
    return String(iso).slice(0, 10) + 'T' + hai(rnd.nguyen(8, 16)) + ':' +

    var noiDungDaDung = {};
    // số ký hiệu văn bản phải DUY NHẤT (M03 lọc theo số ký hiệu) — giữ chỗ trước
    // cho 12 văn bản nổi bật để văn bản lịch sử không bốc trúng
    var soKyHieuDaDung = {};
    VAN_BAN_NOI_BAT.forEach(function (v) { soKyHieuDaDung[v.sokyhieu] = true; });
    function sinhNoiDung(lv) {
      var mau = rnd.chon(MAU_NOI_DUNG[lv]);
      var s = mau.replace('{p}', rnd.chon(DUOI_BO_SUNG));
      if (noiDungDaDung[s]) {
        var k = 2;
        while (noiDungDaDung[s + ' (lần ' + k + ')']) k++;
        s = s + ' (lần ' + k + ')';
      }
      noiDungDaDung[s] = true;
      return s;
    }

    var LY_DO_TRA_LAI = [
      'Báo cáo chưa nêu rõ kết quả so với yêu cầu, đề nghị bổ sung số liệu minh chứng.',
      'Thiếu phụ lục kèm theo, đề nghị hoàn thiện và gửi lại.',
      'Nội dung còn chung chung, đề nghị làm rõ phần đề xuất và lộ trình thực hiện.',
      'Số liệu chưa khớp với báo cáo của đơn vị, đề nghị rà soát lại.'
    ];
    var Y_KIEN_DAT = [
      'Kết quả đạt yêu cầu, đồng ý nghiệm thu.',
      'Đã hoàn thành theo đúng nội dung chỉ đạo, đồng ý nghiệm thu.',
      'Báo cáo đầy đủ, đúng yêu cầu. Đồng ý nghiệm thu.'
    ];
    var NOI_DUNG_TIEN_DO = [
      'Đã khảo sát hiện trạng và tổng hợp số liệu ban đầu.',
      'Đang phối hợp với các đơn vị liên quan để lấy ý kiến.',
      'Đã hoàn thiện dự thảo, đang rà soát trước khi trình.',
      'Đã xử lý phần lớn khối lượng công việc, còn khâu hoàn thiện hồ sơ.',
      'Đang tổng hợp tài liệu và chuẩn bị báo cáo kết quả.'
    ];
    var NOI_DUNG_BAO_CAO = [
      'Đã hoàn thành nội dung được giao, kính trình lãnh đạo xem xét, nghiệm thu.',
      'Báo cáo kết quả thực hiện kèm theo hồ sơ, tài liệu liên quan.',
      'Đã hoàn thành và bàn giao sản phẩm cho các đơn vị liên quan.'
    ];

    /* -----------------------------------------------------------------
     * 9.1. Sinh 324 nhiệm vụ LỊCH SỬ đã kết thúc (trangthai 1|5 + ttdv 11)
     * ----------------------------------------------------------------- */
    // (1) dựng danh sách "chỗ" nhiệm vụ theo hồ sơ từng người
    var oLichSu = [];
    HO_SO_LICH_SU.forEach(function (hs) {
      var ds = [];
      hs.lv.forEach(function (cap) {
        for (var i = 0; i < cap[1]; i++) {
          ds.push({ userid: hs.id, lv: cap[0], trangthai: 1, biTraLai: false, solangiahan: 0, cl: hs.cl });
        }
      });
      var n = ds.length;
      // đúng hạn / sau hạn: lấy đúng số lượng theo tỷ lệ (không phụ thuộc may rủi)
      var soDungHan = Math.round(hs.dungHan * n);
      var hv1 = rnd.tron(dayChiSo(n));
      for (var i = 0; i < n; i++) ds[hv1[i]].trangthai = (i < soDungHan) ? 1 : 5;
      // từng bị trả lại (§9.4 S3 phạt)
      var hv2 = rnd.tron(dayChiSo(n));
      for (var j = 0; j < hs.traLai && j < n; j++) ds[hv2[j]].biTraLai = true;
      // số lần gia hạn
      var hv3 = rnd.tron(dayChiSo(n)), k = 0;
      for (var g2 = 0; g2 < hs.giaHan[1] && k < n; g2++) ds[hv3[k++]].solangiahan = 2;
      for (var g1 = 0; g1 < hs.giaHan[0] && k < n; g1++) ds[hv3[k++]].solangiahan = 1;
      oLichSu = oLichSu.concat(ds);
    });

    // (2) gom theo lĩnh vực -> mỗi văn bản chỉ đạo có 1-4 nhiệm vụ CÙNG lĩnh vực
    var theoLinhVuc = {};
    oLichSu.forEach(function (o) {
      if (!theoLinhVuc[o.lv]) theoLinhVuc[o.lv] = [];
      theoLinhVuc[o.lv].push(o);
    });

    // Ứng viên có thể được rút ngẫu nhiên làm người PHỐI HỢP của việc lịch sử.
    // Loại trừ CHÂN DUNG (d) — người mới tinh phải KHÔNG có bất kỳ bản ghi nào.
    var dsThucHien = db.users.filter(function (u) {
      return u.vaitro === 'NGUOI_THUC_HIEN' && u.id !== CHAN_DUNG.d_nguoimoi;
    });

    // Giữ chỗ trước nội dung của 26 nhiệm vụ đang sống để việc lịch sử không trùng
    NHIEM_VU_SONG.forEach(function (s) { noiDungDaDung[s.noidung] = true; });

    LINH_VUC_LA.forEach(function (lv) {
      var ds = rnd.tron(theoLinhVuc[lv] || []);
      var i = 0;
      while (i < ds.length) {
        var soCon = Math.min(rnd.nguyen(1, 4), ds.length - i);
        taoVanBanLichSu(lv, ds.slice(i, i + soCon));
        i += soCon;
      }
    });

    function taoVanBanLichSu(lv, dsO) {
      // ngày ban hành rải trong ~18 tháng gần nhất, đủ xa để mọi mốc đều <= today
      var ngayBH = themNgay(today, -rnd.nguyen(75, 545));
      var loai = rnd.chon(LOAI_VB);
      var coQuan = rnd.chon(CO_QUAN_BAN_HANH);
      var soHieu;
      if (coQuan === 'Ủy ban nhân dân tỉnh') { loai = 'CONGVAN'; soHieu = rnd.nguyen(800, 4200) + '/UBND-KGVX'; }
      else if (coQuan === 'Bộ Thông tin và Truyền thông') { loai = 'CONGVAN'; soHieu = rnd.nguyen(500, 3000) + '/BTTTT-CNTT'; }
      else soHieu = rnd.nguyen(20, 480) + '/' + HAU_TO_SO_KY_HIEU[loai];
      // tránh trùng số ký hiệu: tăng dần phần số đứng trước dấu '/'
      var hauTo = soHieu.slice(soHieu.indexOf('/')), soDau = parseInt(soHieu, 10);
      while (soKyHieuDaDung[soHieu]) soHieu = (++soDau) + hauTo;
      soKyHieuDaDung[soHieu] = true;

      var idvb = ma('VBH', ++dem.vb, 3);
      themVanBan({
        id: idvb, sokyhieu: soHieu, trichyeu: rnd.chon(MAU_TRICH_YEU[lv]),
        loaivb: loai, ngaybanhanh: ngayBH, coquanbanhanh: coQuan,
        dokhan: rnd.chon(DOKHAN_THEO_TAN_SUAT), linhvuc: lv,
        nguonnv: rnd.chon(NGUON_NHIEM_VU), useridcreate: 'U02'
      });

      dsO.forEach(function (o) { taoNhiemVuLichSu(idvb, ngayBH, o); });
    }

    function taoNhiemVuLichSu(idvb, ngayBH, o) {
      var u = userTheoId[o.userid];
      var nguoiGiao = nguoiGiaoCua(u.unitcode);
      var dokhan = rnd.chon(DOKHAN_THEO_TAN_SUAT);
      var ngayGiao = themNgay(ngayBH, rnd.nguyen(0, 2));
      var soNgayGoc = rnd.chon([7, 10, 14, 15, 20, 21, 25, 30]);
      var hanGoc = themNgay(ngayGiao, soNgayGoc);

      // gia hạn (nếu có) đẩy hạn xử lý ra xa
      var han = hanGoc, buoc = [];
      for (var g = 0; g < o.solangiahan; g++) {
        var them = rnd.nguyen(5, 8);
        buoc.push({ cu: han, moi: themNgay(han, them) });
        han = themNgay(han, them);
      }

      // §1.2 bước 3: tiếp nhận SAU khi giao. Lệch tối thiểu 1 ngày để giờ tiếp nhận
      // không bao giờ rơi trước giờ giao việc của cùng một ngày.
      var tiepNhan = themNgay(ngayGiao, rnd.nguyen(1, 2));
      var hoanThanh = (o.trangthai === 1)
        ? themNgay(han, -rnd.nguyen(1, Math.max(1, Math.floor(soNgayGoc / 3))))
        : themNgay(han, rnd.nguyen(1, 12));
      if (soCuaNgay(hoanThanh) - soCuaNgay(tiepNhan) < 4) hoanThanh = themNgay(tiepNhan, 4);
      // §1.2 bước 5-6: nghiệm thu LUÔN diễn ra SAU khi gửi báo cáo. Lệch tối thiểu 1 ngày
      // để bản ghi NGHIEMTHU không bao giờ mang giờ sớm hơn bản ghi BAOCAO cùng ngày.
      var ngayNghiemThu = themNgay(hoanThanh, rnd.nguyen(1, 3));
      if (soCuaNgay(ngayNghiemThu) > soCuaNgay(today)) ngayNghiemThu = today;

      var idnv = ma('NV', ++dem.nv, 4);
      var coCL = rnd.kha(0.5);
      // §1.2 bước 2.4: bản ghi phân công sinh CÙNG LÚC với việc giao -> dùng chung một mốc giờ
      var gioGiao = gioLamViec(ngayGiao, rnd);
      themNhiemVu({
        id: idnv, idvb: idvb, noidung: sinhNoiDung(o.lv), linhvuc: o.lv, dokhan: dokhan,
        hanxulyth: han, songayhxlth: soCuaNgay(han) - soCuaNgay(ngayGiao),
        ngaygiao: gioGiao,
        ngaytiepnhan: gioLamViec(tiepNhan, rnd),
        ngayhoanthanhthucte: gioLamViec(hoanThanh, rnd),
        trangthai: o.trangthai, trangthaiDvXuly: 11,
        trangthaixulygiahan: o.solangiahan > 0 ? 11 : null,
        solangiahan: o.solangiahan, mucdoht: 100,
        phanhoi: rnd.chon(Y_KIEN_DAT),
        hsChatluong: coCL ? rnd.nguyen(o.cl[0], o.cl[1]) : null,
        userIdGiaoViec: nguoiGiao, unitcode: u.unitcode,
        updatedate: gioLamViec(ngayNghiemThu, rnd)
      });

      themPhanCong(idnv, o.userid, 'CHUTRI', nguoiGiao, gioGiao);
      // ~20% việc có thêm người phối hợp (khác người chủ trì — §4.3)
      if (rnd.kha(0.2)) {
        var ph = rnd.chon(dsThucHien);
        if (ph.id !== o.userid) themPhanCong(idnv, ph.id, 'PHOIHOP', nguoiGiao, gioGiao);
      }

      // bản ghi gia hạn đã duyệt
      buoc.forEach(function (b) {
        themGiaHan({
          idCtnv: idnv, noiDung: 'Khối lượng công việc phát sinh, đề nghị gia hạn thời gian hoàn thành.',
          hanxulydexuat: b.moi, hanxulyth_cu: b.cu, trangThai: 11,
          phanhoi: 'Đồng ý gia hạn.', useridDexuat: o.userid, useridDuyet: nguoiGiao,
          createDate: gioLamViec(themNgay(b.cu, -2), rnd), ngayduyet: gioLamViec(themNgay(b.cu, -1), rnd)
        });
      });

      // --- chuỗi xử lý: TIEPNHAN -> TIENDO... -> [BAOCAO bị trả lại] -> BAOCAO -> NGHIEMTHU
      var mocDau = soCuaNgay(tiepNhan), mocCuoi = soCuaNgay(hoanThanh), nhip = mocCuoi - mocDau;
      themXuLy(idnv, 'TIEPNHAN', 'Đã tiếp nhận nhiệm vụ và xây dựng kế hoạch thực hiện.',
        0, 2, null, null, o.userid, gioLamViec(tiepNhan, rnd));

      var soTienDo = rnd.nguyen(1, 3);
      for (var t = 1; t <= soTienDo; t++) {
        var ngayTd = ngayTuSo(mocDau + Math.round(nhip * t / (soTienDo + 2)));
        themXuLy(idnv, 'TIENDO', rnd.chon(NOI_DUNG_TIEN_DO),
          Math.round(90 * t / (soTienDo + 1)), null, null, null, o.userid, gioLamViec(ngayTd, rnd));
      }

      if (o.biTraLai) {
        // §9.4 S3: bản ghi báo cáo BỊ CHẤM CHƯA ĐẠT — trangthaiDvXuly = 12.
        // Ghi ngay trên chính bản ghi BAOCAO của người thực hiện để đếm được
        // cả khi tính theo useridXuly lẫn khi tính theo nhiệm vụ mà họ chủ trì.
        var ngayTl = ngayTuSo(mocDau + Math.round(nhip * 0.7));
        themXuLy(idnv, 'BAOCAO', rnd.chon(NOI_DUNG_BAO_CAO), 100, o.trangthai, 10, 12,
          o.userid, gioLamViec(ngayTl, rnd));
        themXuLy(idnv, 'TIENDO', 'Đã bổ sung, chỉnh sửa theo ý kiến của lãnh đạo.',
          95, null, null, null, o.userid, gioLamViec(ngayTuSo(mocDau + Math.round(nhip * 0.85)), rnd));
      }

      themXuLy(idnv, 'BAOCAO', rnd.chon(NOI_DUNG_BAO_CAO), 100, o.trangthai, 10, null,
        o.userid, gioLamViec(hoanThanh, rnd));
      themXuLy(idnv, 'NGHIEMTHU', rnd.chon(Y_KIEN_DAT), 100, o.trangthai, null, 11,
        nguoiGiao, gioLamViec(ngayNghiemThu, rnd));
    }

    /* -----------------------------------------------------------------
     * 9.2. 12 văn bản nổi bật + 26 nhiệm vụ ĐANG SỐNG (§2.4 ma trận T1-T14)
     * ----------------------------------------------------------------- */
    VAN_BAN_NOI_BAT.forEach(function (v) {
      themVanBan({
        id: v.id, sokyhieu: v.sokyhieu, trichyeu: v.trichyeu, loaivb: v.loaivb,
        ngaybanhanh: themNgay(today, v.lech), coquanbanhanh: v.coquan,
        dokhan: v.dokhan, linhvuc: v.linhvuc, nguonnv: v.nguon, useridcreate: 'U02'
      });
    });

    var idNvTheoMa = {};

    NHIEM_VU_SONG.forEach(function (s) {
      var u = userTheoId[s.chuTri];
      var nguoiGiao = nguoiGiaoCua(u.unitcode);
      var ngayGiao = themNgay(today, s.lechGiao);
      var han = themNgay(ngayGiao, s.songay);
      var tiepNhan = (s.kb === 'CHUA_TIEP_NHAN' || s.kb === 'TU_CHOI') ? null : themNgay(ngayGiao, 1);
      var idnv = ma('NV', ++dem.nv, 4);
      idNvTheoMa[s.ma] = idnv;
      // §1.2 bước 2.4: nhiệm vụ và bản ghi phân công dùng chung một mốc giờ giao việc
      var gioGiao = gioLamViec(ngayGiao, rnd);

      // ngày hoàn thành thực tế (chỉ với các kịch bản đã gửi báo cáo kết quả)
      var hoanThanh = null;
      if (s.kb === 'CHO_XAC_NHAN' || s.kb === 'DA_NGHIEM_THU') {
        hoanThanh = ngayTuSo(Math.min(soCuaNgay(han) - 1, soCuaNgay(today) - 1));
      } else if (s.kb === 'CHO_XAC_NHAN_SAU_HAN') {
        hoanThanh = ngayTuSo(Math.min(soCuaNgay(han) + rnd.nguyen(1, 5), soCuaNgay(today) - 1));
      }

      var phanHoi = null, hsCl = null;
      if (s.kb === 'BI_TRA_LAI') phanHoi = rnd.chon(LY_DO_TRA_LAI);
      if (s.kb === 'DA_NGHIEM_THU') { phanHoi = rnd.chon(Y_KIEN_DAT); hsCl = 5; }
      if (s.kb === 'DA_THU_HOI') phanHoi = 'Thu hồi nhiệm vụ do điều chỉnh phân công giữa các phòng.';
      if (s.kb === 'TU_CHOI') phanHoi = null;

      themNhiemVu({
        id: idnv, idvb: s.vb, noidung: s.noidung, linhvuc: s.lv, dokhan: s.dokhan,
        hanxulyth: han, songayhxlth: s.songay,
        ngaygiao: gioGiao,
        ngaytiepnhan: tiepNhan ? gioLamViec(tiepNhan, rnd) : null,
        ngayhoanthanhthucte: hoanThanh ? gioLamViec(hoanThanh, rnd) : null,
        trangthai: s.tt, trangthaiDvXuly: s.ttdv,
        trangthaixulygiahan: (s.ttgh === undefined ? null : s.ttgh),
        solangiahan: 0, mucdoht: s.mucdoht, phanhoi: phanHoi, hsChatluong: hsCl,
        userIdGiaoViec: nguoiGiao, unitcode: u.unitcode,
        updatedate: gioLamViec(hoanThanh || tiepNhan || ngayGiao, rnd)
      });

      // §4.3: giữ vết phân công CHUTRI cũ đã bị thu hồi (trangthai = 0) trước khi giao lại
      if (s.chuTriCu && s.chuTriCu !== s.chuTri) {
        themPhanCong(idnv, s.chuTriCu, 'CHUTRI', nguoiGiao, gioGiao, 0);
      }
      themPhanCong(idnv, s.chuTri, 'CHUTRI', nguoiGiao, gioGiao);
      s.phoiHop.forEach(function (uid) {
        if (uid !== s.chuTri) themPhanCong(idnv, uid, 'PHOIHOP', nguoiGiao, gioGiao);
      });

      // --- chuỗi lịch sử xử lý theo từng kịch bản ---
      if (tiepNhan) {
        themXuLy(idnv, 'TIEPNHAN', 'Đã tiếp nhận nhiệm vụ và xây dựng kế hoạch thực hiện.',
          0, 2, null, null, s.chuTri, gioLamViec(tiepNhan, rnd));
      }

      var giuaKy = tiepNhan ? ngayTuSo(Math.round((soCuaNgay(tiepNhan) + soCuaNgay(hoanThanh || today)) / 2)) : null;

      switch (s.kb) {
        case 'CHUA_TIEP_NHAN':
          break;

        case 'DANG_LAM':
        case 'QUA_HAN':
          themXuLy(idnv, 'TIENDO', rnd.chon(NOI_DUNG_TIEN_DO), Math.max(5, Math.round(s.mucdoht / 2)),
            null, null, null, s.chuTri, gioLamViec(giuaKy, rnd));
          themXuLy(idnv, 'TIENDO', rnd.chon(NOI_DUNG_TIEN_DO), s.mucdoht,
            null, null, null, s.chuTri, gioLamViec(themNgay(today, -1), rnd));
          break;

        case 'CHO_XAC_NHAN':
        case 'CHO_XAC_NHAN_SAU_HAN':
          themXuLy(idnv, 'TIENDO', rnd.chon(NOI_DUNG_TIEN_DO), 60, null, null, null,
            s.chuTri, gioLamViec(giuaKy, rnd));
          themXuLy(idnv, 'BAOCAO', rnd.chon(NOI_DUNG_BAO_CAO), 100, s.tt, 10, null,
            s.chuTri, gioLamViec(hoanThanh, rnd));
          break;

        case 'BI_TRA_LAI':
          themXuLy(idnv, 'TIENDO', rnd.chon(NOI_DUNG_TIEN_DO), 55, null, null, null,
            s.chuTri, gioLamViec(giuaKy, rnd));
          // Báo cáo đã bị chấm CHƯA ĐẠT (§2.2 mã 12) -> đẩy nhiệm vụ về (2, 12).
          // Chỉ ghi MỘT bản ghi mang trangthaiDvXuly = 12 (trên chính bản ghi BAOCAO
          // của người thực hiện) để §9.4 S3 đếm đúng, không bị đếm lặp.
          // Ý kiến của người giao nằm ở trường phanhoi của nhiệm vụ.
          themXuLy(idnv, 'BAOCAO', rnd.chon(NOI_DUNG_BAO_CAO) + ' [Người giao đánh giá CHƯA ĐẠT: ' + phanHoi + ']',
            100, 1, 10, 12, s.chuTri, gioLamViec(themNgay(today, -6), rnd));
          themXuLy(idnv, 'TIENDO', 'Đang bổ sung, hoàn thiện theo ý kiến phản hồi của lãnh đạo.',
            s.mucdoht, null, null, null, s.chuTri, gioLamViec(themNgay(today, -2), rnd));
          break;

        case 'TU_CHOI':
          themXuLy(idnv, 'TUCHOI', 'Nội dung nhiệm vụ không thuộc chức năng, nhiệm vụ của phòng; đề nghị chuyển đơn vị khác thực hiện.',
            0, 6, 10, 10, s.chuTri, gioLamViec(themNgay(ngayGiao, 1), rnd));
          break;

        case 'XIN_GIA_HAN':
          themXuLy(idnv, 'TIENDO', rnd.chon(NOI_DUNG_TIEN_DO), s.mucdoht, null, null, null,
            s.chuTri, gioLamViec(themNgay(today, -3), rnd));
          themGiaHan({
            idCtnv: idnv,
            noiDung: 'Khối lượng khảo sát thực địa lớn hơn dự kiến, đề nghị gia hạn thêm 15 ngày để hoàn thành.',
            hanxulydexuat: themNgay(han, 15), hanxulyth_cu: han, trangThai: 10,
            phanhoi: null, useridDexuat: s.chuTri, useridDuyet: null,
            createDate: gioLamViec(themNgay(today, -1), rnd), ngayduyet: null
          });
          break;

        case 'DA_NGHIEM_THU':
          themXuLy(idnv, 'TIENDO', rnd.chon(NOI_DUNG_TIEN_DO), 70, null, null, null,
            s.chuTri, gioLamViec(giuaKy, rnd));
          themXuLy(idnv, 'BAOCAO', rnd.chon(NOI_DUNG_BAO_CAO), 100, 1, 10, null,
            s.chuTri, gioLamViec(hoanThanh, rnd));
          themXuLy(idnv, 'NGHIEMTHU', phanHoi, 100, 1, null, 11,
            nguoiGiao, gioLamViec(themNgay(today, -2), rnd));
          break;

        case 'DA_THU_HOI':
          themXuLy(idnv, 'TIENDO', rnd.chon(NOI_DUNG_TIEN_DO), s.mucdoht, null, null, null,
            s.chuTri, gioLamViec(giuaKy, rnd));
          break;

        case 'GIA_HAN_BI_TU_CHOI':
          themXuLy(idnv, 'TIENDO', rnd.chon(NOI_DUNG_TIEN_DO), s.mucdoht, null, null, null,
            s.chuTri, gioLamViec(themNgay(today, -8), rnd));
          // §2.4 T13 + §2.3 mã 12: người giao TỪ CHỐI gia hạn ->
          // trangthaixulygiahan := 12, solangiahan giữ nguyên, nhiệm vụ trở lại (7, null) vì đã quá hạn.
          themGiaHan({
            idCtnv: idnv,
            noiDung: 'Phải chờ số liệu đối chiếu của các đơn vị trực thuộc, đề nghị gia hạn thêm 10 ngày.',
            hanxulydexuat: themNgay(han, 10), hanxulyth_cu: han, trangThai: 12,
            phanhoi: 'Nhiệm vụ đã quá hạn nhiều ngày, đề nghị tập trung hoàn thành ngay. Không đồng ý gia hạn.',
            useridDexuat: s.chuTri, useridDuyet: nguoiGiao,
            createDate: gioLamViec(themNgay(today, -5), rnd), ngayduyet: gioLamViec(themNgay(today, -4), rnd)
          });
          break;

        case 'THU_HOI_BAO_CAO':
          themXuLy(idnv, 'TIENDO', rnd.chon(NOI_DUNG_TIEN_DO), 60, null, null, null,
            s.chuTri, gioLamViec(giuaKy, rnd));
          themXuLy(idnv, 'BAOCAO', rnd.chon(NOI_DUNG_BAO_CAO), 100, 1, 10, null,
            s.chuTri, gioLamViec(themNgay(today, -4), rnd));
          // §2.4 T8 (§4.4 loại THUHOI_BC): người thực hiện thu hồi báo cáo đang chờ xác nhận
          // -> nhiệm vụ về (2, null) vì còn hạn.
          themXuLy(idnv, 'THUHOI_BC',
            'Phát hiện thiếu số liệu của 02 đơn vị, xin thu hồi báo cáo để bổ sung trước khi trình lãnh đạo.',
            s.mucdoht, 2, null, null, s.chuTri, gioLamViec(themNgay(today, -2), rnd));
          break;
      }
    });

    /* -----------------------------------------------------------------
     * 9.3. AI_GOIY_LOG — 72 lần gợi ý đã xảy ra (§4.8, §9.8)
     *   Phân bố thứ hạng được đặt cố định để chỉ số đo được nằm đúng
     *   khoảng "đạt ngưỡng nhưng không hoàn hảo":
     *     Precision@1 = 32/72 = 0,444   Precision@3 = 50/72 = 0,694
     *     Tỷ lệ chấp nhận = 58/72 = 0,806   MRR = 41,52/72 = 0,577
     * ----------------------------------------------------------------- */
    var tkTam = thongKe(db);
    var dsUngVien = db.users.filter(function (u) {
      return u.vaitro === 'NGUOI_THUC_HIEN' && u.trangthai === 1;
    });

    function xepHangUngVien(lv, loaiTru) {
      var ds = dsUngVien.filter(function (u) { return u.id !== loaiTru; }).map(function (u) {
        var o = tkTam[u.id];
        return { id: u.id, d: (o.theoLv[lv] || 0) * 3 + o.tong * 0.3 - o.tai * 0.5 };
      });
      ds.sort(function (a, b) { return b.d - a.d || (a.id < b.id ? -1 : 1); });
      return ds.slice(0, 5).map(function (x) { return x.id; });
    }

    var DIEM_NEN = [86.4, 80.1, 74.6, 69.2, 63.5];

    // 32 lần chọn hạng 1, 10 hạng 2, 8 hạng 3, 5 hạng 4, 3 hạng 5, 14 lần bỏ qua
    var ketCuc = [];
    (function () {
      var bang = [[1, 32], [2, 10], [3, 8], [4, 5], [5, 3], [null, 14]];
      bang.forEach(function (c) { for (var i = 0; i < c[1]; i++) ketCuc.push(c[0]); });
      ketCuc = rnd.tron(ketCuc);
    })();

    // chọn 72 nhiệm vụ để gắn log: 60 việc lịch sử gần đây nhất + 12 việc đang sống
    var nvTheoId = {};
    db.nhiemvu.forEach(function (nv) { nvTheoId[nv.id] = nv; });
    var chuTriTheoNv = {};
    db.phancong.forEach(function (pc) {
      if (pc.vaitro === 'CHUTRI' && pc.trangthai === 1 && !chuTriTheoNv[pc.idnvchitiet]) {
        chuTriTheoNv[pc.idnvchitiet] = pc.userid;
      }
    });

    var dsLichSuGanDay = db.nhiemvu
      .filter(function (nv) {
        // §9.3 điều 1: bỏ qua nhiệm vụ do người ĐANG BỊ KHOÁ chủ trì. Người chủ trì thật
        // được chèn thẳng vào ket_qua_json ở dưới, nếu họ bị khoá thì bản ghi gợi ý sẽ chứa
        // một ứng viên mà bộ lọc cứng của AI không bao giờ tái tạo được.
        var ct = userTheoId[chuTriTheoNv[nv.id]];
        return nv.trangthaiDvXuly === 11 && nv.id.indexOf('NV') === 0 && !idNvTheoMaCo(nv.id) &&
          !!ct && ct.trangthai === 1;
      })
      .sort(function (a, b) { return a.ngaygiao < b.ngaygiao ? 1 : -1; })
      .slice(0, 60);

    function idNvTheoMaCo(id) {
      for (var k in idNvTheoMa) if (idNvTheoMa[k] === id) return true;
      return false;
    }

    var dsSongCoLog = ['LV01', 'LV02', 'LV05', 'LV06', 'LV07', 'LV10', 'LV11', 'LV12', 'LV13', 'LV17', 'LV18', 'LV19']
      .map(function (m) { return nvTheoId[idNvTheoMa[m]]; });

    var dsNvCoLog = dsLichSuGanDay.concat(dsSongCoLog);

    dsNvCoLog.forEach(function (nv, i) {
      var chuTri = chuTriTheoNv[nv.id];
      var hang = ketCuc[i % ketCuc.length];
      var top = xepHangUngVien(nv.linhvuc, chuTri);
      if (hang) {
        top = top.slice(0, 4);
        top.splice(hang - 1, 0, chuTri);   // người thực tế được chọn nằm đúng thứ hạng đó
      }
      var ketQua = top.map(function (uid, k) {
        return { userid: uid, diemTong: Math.round((DIEM_NEN[k] + (rnd.so() * 3 - 1.5)) * 10) / 10, thuHang: k + 1 };
      });
      var idLog = ma('AI', ++dem.ai, 3);
      db.aiLog.push({
        id: idLog,
        idnvchitiet: nv.id,
        linhvuc: nv.linhvuc,
        // §4.8: nvarchar(max) -> lưu dạng CHUỖI JSON, đọc bằng JSON.parse
        ket_qua_json: JSON.stringify(ketQua),
        userid_da_chon: hang ? chuTri : null,   // null = người giao bỏ qua gợi ý
        thu_hang_da_chon: hang || null,
        co_trong_goi_y: !!hang,
        phien_ban_trongso: i < dsNvCoLog.length - 20 ? 1 : 2,
        createdate: nv.ngaygiao
      });
      if (hang) nv.ai_goiy_id = idLog;
    });

    /* -----------------------------------------------------------------
     * 9.4. Chuẩn hoá lịch sử xử lý (§3 M07/M09 — tab "Lịch sử xử lý" sắp theo
     *   ngayxuly). Các bản ghi được ghi theo đúng thứ tự nhân quả, nhưng hai
     *   bản ghi CÙNG NGÀY có thể bốc phải giờ đảo nhau; ở đây đẩy giờ lên
     *   để mốc thời gian của mỗi nhiệm vụ luôn TĂNG DẦN.
     * ----------------------------------------------------------------- */
    var mocXuLyTruoc = {};
    db.xuly.forEach(function (x) {
      var truoc = mocXuLyTruoc[x.idCtnv];
      if (truoc && phutCuaMoc(x.ngayxuly) <= phutCuaMoc(truoc)) {
        x.ngayxuly = mocTuPhut(phutCuaMoc(truoc) + 15);
      }
      mocXuLyTruoc[x.idCtnv] = x.ngayxuly;
    });

    /* -----------------------------------------------------------------
     * 9.5. Chuẩn hoá updatedate (§4.2 — mốc CẬP NHẬT CUỐI CÙNG của nhiệm vụ)
     *   Lưới M02/M08 sắp theo cột này, nên updatedate phải >= thời điểm của
     *   bản ghi xử lý / gia hạn muộn nhất của chính nhiệm vụ đó.
     * ----------------------------------------------------------------- */
    var mocCuoi = {};
    function ghiMocCuoi(idnv, moc) {
      if (!moc) return;
      if (!mocCuoi[idnv] || moc > mocCuoi[idnv]) mocCuoi[idnv] = moc;
    }
    db.xuly.forEach(function (x) { ghiMocCuoi(x.idCtnv, x.ngayxuly); });
    db.giahan.forEach(function (h) { ghiMocCuoi(h.idCtnv, h.ngayduyet || h.createDate); });
    db.nhiemvu.forEach(function (nv) {
      var m = mocCuoi[nv.id];
      if (m && (!nv.updatedate || nv.updatedate < m)) nv.updatedate = m;
    });

    // sắp xếp văn bản theo ngày ban hành giảm dần cho đẹp lưới M03
    db.vanban.sort(function (a, b) { return a.ngaybanhanh < b.ngaybanhanh ? 1 : (a.ngaybanhanh > b.ngaybanhanh ? -1 : 0); });

    return db;
  }

  /* ===================================================================
   * 10. Thống kê nội bộ (dùng cho sinh log + tự kiểm tra).
   *     KHÔNG gọi AiEngine — seed.js phải chạy độc lập.
   * =================================================================== */
  function thongKe(db) {
    var kq = {};
    db.users.forEach(function (u) {
      kq[u.id] = {
        tong: 0, dungHan: 0, theoLv: {}, traLai: 0, giaHan: 0,
        tai: 0, dangMo: 0, quaHan: 0, soPhanCong: 0, soChuTri: 0
      };
    });
    var nvTheoId = {};
    db.nhiemvu.forEach(function (nv) { nvTheoId[nv.id] = nv; });

    db.phancong.forEach(function (pc) {
      var o = kq[pc.userid];
      if (!o) return;
      o.soPhanCong++;
      if (pc.vaitro !== 'CHUTRI' || pc.trangthai !== 1) return;
      o.soChuTri++;
      var nv = nvTheoId[pc.idnvchitiet];
      if (!nv) return;
      var xong = (nv.trangthai === 1 || nv.trangthai === 5) && nv.trangthaiDvXuly === 11;
      if (xong) {                                   // §9.4 S1/S2: chỉ đếm việc ĐÃ NGHIỆM THU
        o.tong++;
        if (nv.trangthai === 1) o.dungHan++;
        o.theoLv[nv.linhvuc] = (o.theoLv[nv.linhvuc] || 0) + 1;
        o.giaHan += (nv.solangiahan || 0);
      }
      if ([1, 5, 97].indexOf(nv.trangthai) < 0) {   // §9.4 S4: tải hiện tại
        o.dangMo++;
        o.tai += (TRONG_SO_DOKHAN[nv.dokhan] || 1);
        if (nv.trangthai === 7) o.quaHan++;         // §9.4 S5
      }
    });

    db.xuly.forEach(function (x) {                  // §9.4 S3: số lần bị trả lại
      if (x.trangthaiDvXuly === 12 && kq[x.useridXuly]) kq[x.useridXuly].traLai++;
    });
    return kq;
  }

  function copy(o) {
    var r = {}, k;
    for (k in o) if (Object.prototype.hasOwnProperty.call(o, k)) r[k] = o[k];
    return r;
  }

  /* ===================================================================
   * 11. Tự kiểm tra bộ dữ liệu — trả về MẢNG CẢNH BÁO (rỗng = sạch)
   * =================================================================== */
  function tuKiemTra(db) {
    var cb = [];
    if (!db || !db.nhiemvu) return ['Không có dữ liệu để kiểm tra.'];

    var userTheoId = {}, nvTheoId = {}, vbTheoId = {};
    db.users.forEach(function (u) { userTheoId[u.id] = u; });
    db.nhiemvu.forEach(function (nv) { nvTheoId[nv.id] = nv; });
    db.vanban.forEach(function (v) { vbTheoId[v.id] = v; });

    // --- (1) khối lượng dữ liệu (§8 T9: >= 300; yêu cầu demo: >= 320) ---
    if (db.nhiemvu.length < 320) {
      cb.push('Tổng số nhiệm vụ = ' + db.nhiemvu.length + ' < 320.');
    }
    var soKetThuc = db.nhiemvu.filter(function (nv) {
      return (nv.trangthai === 1 || nv.trangthai === 5) && nv.trangthaiDvXuly === 11;
    }).length;
    if (soKetThuc < 320) cb.push('Số nhiệm vụ lịch sử đã nghiệm thu = ' + soKetThuc + ' < 320.');

    // --- (2) mỗi nhiệm vụ phải có >= 1 CHUTRI còn hiệu lực (§4.3) ---
    // --- (3) một người không được vừa CHUTRI vừa PHOIHOP trên cùng nhiệm vụ ---
    var vaiTro = {};
    db.phancong.forEach(function (pc) {
      if (!nvTheoId[pc.idnvchitiet]) cb.push('Phân công ' + pc.id + ' trỏ tới nhiệm vụ không tồn tại.');
      if (!userTheoId[pc.userid]) cb.push('Phân công ' + pc.id + ' trỏ tới người dùng không tồn tại.');
      var k = pc.idnvchitiet + '|' + pc.userid;
      if (!vaiTro[k]) vaiTro[k] = {};
      vaiTro[k][pc.vaitro] = true;
    });
    Object.keys(vaiTro).forEach(function (k) {
      if (vaiTro[k].CHUTRI && vaiTro[k].PHOIHOP) {
        cb.push('Vi phạm §4.3: người ' + k.split('|')[1] + ' vừa CHUTRI vừa PHOIHOP trên nhiệm vụ ' + k.split('|')[0] + '.');
      }
    });
    var coChuTri = {};
    db.phancong.forEach(function (pc) {
      if (pc.vaitro === 'CHUTRI' && pc.trangthai === 1) coChuTri[pc.idnvchitiet] = true;
    });
    var thieuChuTri = db.nhiemvu.filter(function (nv) { return !coChuTri[nv.id]; });
    if (thieuChuTri.length) {
      cb.push('Có ' + thieuChuTri.length + ' nhiệm vụ không có người chủ trì còn hiệu lực (vd: ' + thieuChuTri[0].id + ').');
    }

    // --- (4) mã trạng thái phải nằm trong tập §2 ---
    db.nhiemvu.forEach(function (nv) {
      if (TRANG_THAI_HOP_LE.indexOf(nv.trangthai) < 0) {
        cb.push('Nhiệm vụ ' + nv.id + ' có trangthai = ' + nv.trangthai + ' ngoài tập {1,2,3,5,6,7,13,97}.');
      }
      if ([null, 10, 11, 12].indexOf(nv.trangthaiDvXuly) < 0) {
        cb.push('Nhiệm vụ ' + nv.id + ' có trangthaiDvXuly = ' + nv.trangthaiDvXuly + ' ngoài tập {null,10,11,12}.');
      }
      if (!vbTheoId[nv.idvb]) cb.push('Nhiệm vụ ' + nv.id + ' trỏ tới văn bản không tồn tại (' + nv.idvb + ').');
      if (nv.mucdoht < 0 || nv.mucdoht > 100) cb.push('Nhiệm vụ ' + nv.id + ' có mucdoht ngoài 0-100.');
      if (nv.hanxulyth && nv.ngaygiao && nv.hanxulyth < String(nv.ngaygiao).slice(0, 10)) {
        cb.push('Nhiệm vụ ' + nv.id + ' có hạn xử lý trước ngày giao.');
      }
    });

    // mỗi văn bản có 1-4 nhiệm vụ con
    var demCon = {};
    db.nhiemvu.forEach(function (nv) { demCon[nv.idvb] = (demCon[nv.idvb] || 0) + 1; });
    db.vanban.forEach(function (v) {
      var n = demCon[v.id] || 0;
      if (n < 1 || n > 4) cb.push('Văn bản ' + v.id + ' có ' + n + ' nhiệm vụ con (yêu cầu 1-4).');
    });

    // --- (5) đủ 8 chân dung a-h ---
    var tk = thongKe(db);
    var chaCua = {};
    db.linhvuc.forEach(function (l) { chaCua[l.ma] = l.nhomCha; });

    // (a) mỗi lĩnh vực lá có ít nhất 1 chuyên gia >= 8 việc đã nghiệm thu
    LINH_VUC_LA.forEach(function (lv) {
      var co = db.users.some(function (u) {
        return u.vaitro === 'NGUOI_THUC_HIEN' && u.trangthai === 1 &&
          tk[u.id] && (tk[u.id].theoLv[lv] || 0) >= 8;
      });
      if (!co) cb.push('Chân dung (a): lĩnh vực ' + lv + ' chưa có chuyên gia nào >= 8 nhiệm vụ đã nghiệm thu.');
    });

    // (b) giỏi nhưng quá tải: tải >= max_concurrent_tasks x 1,5 (§9.3 điều 6) và có chuyên môn cao
    var b = db.users.filter(function (u) {
      return u.vaitro === 'NGUOI_THUC_HIEN' && tk[u.id] &&
        tk[u.id].tai >= (u.max_concurrent_tasks || 8) * 1.5 &&
        Object.keys(tk[u.id].theoLv).some(function (lv) { return tk[u.id].theoLv[lv] >= 8; });
    });
    if (!b.length) cb.push('Chân dung (b): thiếu người "giỏi nhưng đang quá tải" (tải >= K x 1,5).');

    // (c) chậm nhưng rảnh: tải = 0, tỷ lệ đúng hạn <= 0,5, bị trả lại >= 4
    var c = db.users.filter(function (u) {
      var o = tk[u.id];
      return u.vaitro === 'NGUOI_THUC_HIEN' && o && o.tong >= 5 && o.tai === 0 &&
        (o.dungHan / o.tong) <= 0.5 && o.traLai >= 4;
    });
    if (!c.length) cb.push('Chân dung (c): thiếu người "chậm nhưng rảnh" (tải 0, đúng hạn <= 50%, bị trả lại >= 4).');

    // (d) người mới tinh: không có bản ghi phân công nào
    var d = db.users.filter(function (u) {
      return u.vaitro === 'NGUOI_THUC_HIEN' && u.trangthai === 1 && tk[u.id] && tk[u.id].soPhanCong === 0;
    });
    if (!d.length) cb.push('Chân dung (d): thiếu người dùng mới chưa có bản ghi nhiệm vụ nào.');

    // (e) chỉ làm lĩnh vực ANH EM cùng nhóm cha -> demo S1 fallback 0,5
    var e = db.users.filter(function (u) {
      var o = tk[u.id];
      if (!o || u.vaitro !== 'NGUOI_THUC_HIEN' || u.trangthai !== 1) return false;
      var dsLv = Object.keys(o.theoLv);
      if (!dsLv.length) return false;
      var cha = chaCua[dsLv[0]];
      if (!cha) return false;
      var cungCha = dsLv.every(function (lv) { return chaCua[lv] === cha; });
      var conThieu = LINH_VUC_LA.some(function (lv) { return chaCua[lv] === cha && !o.theoLv[lv]; });
      return cungCha && conThieu && o.tong >= 5;
    });
    if (!e.length) cb.push('Chân dung (e): thiếu người chỉ làm lĩnh vực anh em cùng nhóm cha.');

    // (f) đang có >= 2 nhiệm vụ quá hạn (trangthai = 7)
    var f = db.users.filter(function (u) { return tk[u.id] && tk[u.id].quaHan >= 2; });
    if (!f.length) cb.push('Chân dung (f): thiếu người đang giữ >= 2 nhiệm vụ quá hạn (trangthai = 7).');

    // (g) tài khoản bị khoá (§9.3 điều 1)
    var g = db.users.filter(function (u) { return u.vaitro === 'NGUOI_THUC_HIEN' && u.trangthai === 0; });
    if (!g.length) cb.push('Chân dung (g): thiếu tài khoản người thực hiện bị khoá.');

    // (h) chuyên môn cao nhưng thuộc đơn vị khác phạm vi P01 (§9.3 điều 3)
    var h = db.users.filter(function (u) {
      var o = tk[u.id];
      return u.vaitro === 'NGUOI_THUC_HIEN' && u.trangthai === 1 && u.unitcode !== 'P01' && o &&
        Object.keys(o.theoLv).some(function (lv) { return chaCua[lv] === 'CNTT' && o.theoLv[lv] >= 8; });
    });
    if (!h.length) cb.push('Chân dung (h): thiếu người chuyên môn cao thuộc đơn vị ngoài phạm vi P01.');

    // --- (6) nhật ký AI phải cho ra chỉ số nằm trong khoảng mục tiêu §9.8 ---
    var n = db.aiLog.length;
    if (n < 60) cb.push('Nhật ký AI chỉ có ' + n + ' bản ghi (< 60).');
    else {
      var p1 = 0, p3 = 0, chapNhan = 0, mrr = 0;
      db.aiLog.forEach(function (l) {
        if (l.co_trong_goi_y && l.thu_hang_da_chon) {
          chapNhan++;
          if (l.thu_hang_da_chon === 1) p1++;

    // §6.2 dong 6,7,8,14,16,17: cot QUAN_TRI/NGUOI_GIAO co dau, cot NGUOI_THUC_HIEN = ❌.
    var laBenGiao = (vt === 'NGUOI_GIAO' || vt === 'QUAN_TRI');
    // §6.2 dong 9,10,11,12,13,15: chi cot NGUOI_THUC_HIEN co dau, hai cot kia = ❌.
    var laBenLam = (vt === 'NGUOI_THUC_HIEN');

    // Quan tri: §6.2 danh dau (v) o cac dong 6,7,8,14,16,17,18,19.
    // Quyet dinh: quan tri BO QUA dieu kien so huu du lieu nhung VAN phai
    // thoa dieu kien trang thai (hanh dong sai trang thai la vo nghia).
    var qt = CAU_HINH.quanTriToanQuyen && v.laQuanTri;

    // Nguoi giao "hieu luc": userIdGiaoViec = toi, hoac toi la nguoi tao khi
    // nhiem vu chua chi dinh can bo giao (bam coTheXacNhan — §6.2 dong 14).
    var laNguoiGiaoHoacTao = v.laNguoiGiao || (!n || !n.userIdGiaoViec ? v.laNguoiTao : false);

    var q = {};

    // §6.2 dong 6 — Sua nhiem vu da giao: userIdGiaoViec = toi VA trangthai = 3.
    q.suaNhiemVu = laBenGiao && (v.laNguoiGiao || qt) && tt === 3;

    // §6.2 dong 7 — Thu hoi nhiem vu (-> 97): userIdGiaoViec = toi VA trangthai ∉ {1,5,97}.
    q.thuHoiNhiemVu = laBenGiao && (v.laNguoiGiao || qt) && tt !== null && !trong([1, 5, 97], tt);

    // §6.2 dong 8 — Thu hoi phan cong (rut 1 nguoi): userIdGiaoViec = toi VA trangthai ∉ {1,5}.
    q.thuHoiPhanCong = laBenGiao && (v.laNguoiGiao || qt) && tt !== null && !trong([1, 5], tt);

    // §6.2 dong 9 — Tiep nhan: toi la CHUTRI VA trangthai = 3. (QUAN_TRI/NGUOI_GIAO = KHONG)
    q.tiepNhan = laBenLam && v.laChuTri && tt === 3;

    // §6.2 dong 10 — Tu choi: toi la CHUTRI VA trangthai ∈ {2,3} VA solangiahan = 0.
    // XUNG DOT DAC TA: §6.2 dong 10 khong neu truc B, nhung §2.4 T3 ghi ro chi tu
    // (3, null) hoac (2, null). Chon theo §2.4 (may trang thai la nguon chuan cho
    // chuyen trang thai) => them ve `dv === null`, tranh vong lap tu choi vo han
    // (tu choi -> (6,10) -> bac bo -> (2,12) -> tu choi lai...).
    q.tuChoi = laBenLam && v.laChuTri && trong([2, 3], tt) && dv === null && slgh === 0;

    // §6.2 dong 11 — Cap nhat tien do: CHUTRI VA trangthai ∈ {2,3,7} VA trangthaiDvXuly ∈ {null,12}.
    q.capNhatTienDo = laBenLam && v.laChuTri && trong([2, 3, 7], tt) && (dv === null || dv === 12);

    // §6.2 dong 12 — Gui bao cao ket qua: dieu kien nhu dong 11.
    q.guiBaoCao = laBenLam && v.laChuTri && trong([2, 3, 7], tt) && (dv === null || dv === 12);

    // §6.2 dong 13 — Thu hoi bao cao: CHUTRI VA trangthai ∈ {1,5} VA trangthaiDvXuly = 10.
    q.thuHoiBaoCao = laBenLam && v.laChuTri && trong([1, 5], tt) && dv === 10;

    // §6.2 dong 14 — Kiem tra ket qua: trangthaiDvXuly = 10 VA (userIdGiaoViec = toi HOAC toi la nguoi tao).
    // Loai truc A = 6: cap (6,10) thuoc §2.4 T4/T5 (Xu ly tu choi), khong phai T9/T10;
    // neu de chung se sinh cac cap chet (6,11)/(6,12) ngoai may trang thai §2.4.
    // Loai truc A = 97 cho chac (diem cuoi §2.6).
    q.kiemTraKetQua = laBenGiao && dv === 10 && tt !== 6 && tt !== 97 && (laNguoiGiaoHoacTao || qt);

    // §6.2 dong 15 — Xin gia han: CHUTRI VA trangthai ∈ {2,3,7} VA trangthaixulygiahan != 10 VA solangiahan < 2.
    q.xinGiaHan = laBenLam && v.laChuTri && trong([2, 3, 7], tt) && gh !== 10 && slgh < CAU_HINH.soLanGiaHanToiDa;

    // §6.2 dong 16 — Duyet/tu choi gia han: trangthaixulygiahan = 10 VA userIdGiaoViec = toi.
    // Them ve tt !== 97: §2.6 coi 97 la DIEM CUOI, khong duoc "hoi sinh" bang duyet gia han.
    q.duyetGiaHan = laBenGiao && gh === 10 && tt !== 97 && (v.laNguoiGiao || qt);

    // §6.2 dong 17 — Nhac viec: userIdGiaoViec = toi VA trangthai ∉ {1,5,97}.
    q.nhacViec = laBenGiao && (v.laNguoiGiao || qt) && tt !== null && !trong([1, 5, 97], tt);

    // §6.2 dong 18 — Xem chi tiet + lich su: la nguoi giao, hoac co ten trong NHIEMVU_PHANCONG
    // (ca CHUTRI lan PHOIHOP). Bo sung: nguoi tao ban ghi (§6.2 dong 14 coi nguoi tao la nguoi giao).
    q.xemChiTiet = !!n && (v.laNguoiGiao || v.laNguoiTao || v.laChuTri || v.laPhoiHop || v.laQuanTri);

    // §6.2 dong 19 — Tai tep dinh kem: nhu dong 18.
    q.taiTep = q.xemChiTiet;

    // MO RONG (§2.4 T4/T5) — §6.2 KHONG co dong cho "Xu ly tu choi".
    // Quy dinh: nguoi giao (hoac quan tri) xu ly khi nhiem vu o cap (6, 10).
    q.xuLyTuChoi = laBenGiao && (laNguoiGiaoHoacTao || qt) && tt === 6 && dv === 10;

    return q;
  }

  /* Metadata hanh dong — de UI dung sinh menu theo dung ten khoa cua Flow.quyen. */
  var HANH_DONG = [
    { ma: 'suaNhiemVu',     nhan: 'Sửa nhiệm vụ',                    dong: 6,  vai: 'Người giao' },
    { ma: 'thuHoiNhiemVu',  nhan: 'Thu hồi nhiệm vụ',                dong: 7,  vai: 'Người giao' },
    { ma: 'thuHoiPhanCong', nhan: 'Thu hồi phân công',               dong: 8,  vai: 'Người giao' },
    { ma: 'tiepNhan',       nhan: 'Tiếp nhận',                       dong: 9,  vai: 'Người thực hiện' },
    { ma: 'tuChoi',         nhan: 'Từ chối nhiệm vụ',                dong: 10, vai: 'Người thực hiện' },
    { ma: 'capNhatTienDo',  nhan: 'Cập nhật tiến độ',                dong: 11, vai: 'Người thực hiện' },

    { ma: 'thuHoiBaoCao',   nhan: 'Thu hồi báo cáo',                 dong: 13, vai: 'Người thực hiện' },
    { ma: 'kiemTraKetQua',  nhan: 'Kiểm tra kết quả',                dong: 14, vai: 'Người giao' },
    { ma: 'xinGiaHan',      nhan: 'Xin gia hạn',                     dong: 15, vai: 'Người thực hiện' },
    { ma: 'duyetGiaHan',    nhan: 'Duyệt gia hạn',                   dong: 16, vai: 'Người giao' },
    { ma: 'nhacViec',       nhan: 'Nhắc việc',                       dong: 17, vai: 'Người giao' },
    { ma: 'xemChiTiet',     nhan: 'Xem chi tiết',                    dong: 18, vai: 'Tất cả liên quan' },
    { ma: 'taiTep',         nhan: 'Tải tệp đính kèm',                dong: 19, vai: 'Tất cả liên quan' },
    { ma: 'xuLyTuChoi',     nhan: 'Xử lý từ chối',                   dong: 0,  vai: 'Người giao' }
  ];

  /** Danh sach hanh dong dang duoc phep — tien cho UI dung ve menu ngu canh. */
  function dsHanhDongChoPhep(db, nv, userid) {
    var q = quyen(db, nv, userid);
    var kq = [];
    for (var i = 0; i < HANH_DONG.length; i++) {
      var h = HANH_DONG[i];
      if (q[h.ma]) kq.push({ ma: h.ma, nhan: h.nhan, dong: h.dong, vai: h.vai });
    }
    return kq;
  }

  /* -------------------------------------------------------------------
   * 6. Flow.trangThaiHopLe — §5.4 D5 / §1.2 buoc 5
   *    Bo loc combobox "Ket qua xu ly" theo han.
   * ----------------------------------------------------------------- */
  // Tap ung vien goc cua combobox. 97 KHONG nam trong day: 97 chi do nguoi giao
  // dat khi thu hoi nhiem vu, khong phai ket qua nguoi thuc hien tu bao cao.
  var MA_UNGVIEN_BAOCAO = [1, 2, 3, 5, 6, 7, 13];

  // `today` nhan CA HAI dang: chuoi 'yyyy-mm-dd', HOAC ca doi tuong DB (khi do lay
  // db.today — "hom nay" cua demo, §5.4 D5). UI nen goi trangThaiHopLe(nv, DB).
  function trangThaiHopLe(nv, today) {
    var n = nv || {};
    var ngay = (typeof today === 'string') ? chuanHoaNgay(today) : homNay(today);
    // §1.2 buoc 5: con han loai [5,7,8,6]; qua han loai [1,2,4,6,8].
    var loaiBo = quaHan(n, ngay) ? [1, 2, 4, 6, 8] : [5, 7, 8, 6];
    var kq = [];
    for (var i = 0; i < MA_UNGVIEN_BAOCAO.length; i++) {
      var ma = MA_UNGVIEN_BAOCAO[i];
      if (ma === 13) continue;                 // §1.2 buoc 5: ma 13 LUON bi loai
      if (trong(loaiBo, ma)) continue;
      var m = timDm(TRANGTHAINV, ma);
      if (m) kq.push({ ma: m.ma, nhan: m.nhan });
    }
    return kq;
  }

  /* -------------------------------------------------------------------
   * 7. Ghi lich su xu ly (§4.4 XULY_NHIEMVU)
   * ----------------------------------------------------------------- */
  function ghiXuLy(db, n, userid, loai, tt) {
    var t = tt || {};
    var bg = {
      id: taoId('xl'),
      idCtnv: n.id,
      loai: loai,
      noidung: t.noidung !== undefined ? t.noidung : '',
      mucdoht: t.mucdoht !== undefined ? t.mucdoht : soHoacNull(n.mucdoht),
      trangthai: t.trangthai !== undefined ? t.trangthai : soHoacNull(n.trangthai),
      trangthaiXuly: t.trangthaiXuly !== undefined ? t.trangthaiXuly : null,
      trangthaiDvXuly: t.trangthaiDvXuly !== undefined ? t.trangthaiDvXuly : soHoacNull(n.trangthaiDvXuly),
      useridXuly: userid,
      ngayxuly: homNay(db)
    };
    mang(db, 'xuly').push(bg);
    return bg;
  }

  function loi(thongBao) { return { ok: false, loi: thongBao }; }
  function ok(n, them) {
    var r = { ok: true, nv: n };
    if (them) for (var k in them) if (Object.prototype.hasOwnProperty.call(them, k)) r[k] = them[k];
    return r;
  }

  /**
   * Khung chung cho moi hanh dong: chuan hoa db/nv, dong bo bo dem, kiem quyen.
   * Tra ve {loi:...} khi hong, {n:..., q:...} khi hop le.
   */
  function chuanBi(db, nv, userid, maQuyen, tenHanhDong) {
    if (!db) return { loi: loi('Thiếu dữ liệu hệ thống.') };
    baoDamBoDem(db);
    var n = timNhiemVu(db, nv);
    if (!n) return { loi: loi('Không tìm thấy nhiệm vụ.') };
    if (!userid) return { loi: loi('Chưa xác định người thực hiện thao tác.') };
    var q = quyen(db, n, userid);
    if (!q[maQuyen]) {
      return { loi: loi('Bạn không có quyền ' + tenHanhDong + ' ở trạng thái hiện tại (' +
        nhanTrangThai(n.trangthai) + ' / ' + nhanPhanHoi(n.trangthaiDvXuly) + ').') };
    }
    return { n: n, q: q };
  }

  function kiemNoiDung(v, batBuoc, tenTruong) {
    var s = chuoiSach(v);
    if (batBuoc && s === '') return 'Vui lòng nhập ' + tenTruong + '.';
    if (s.length > CAU_HINH.doDaiNoiDungToiDa) {
      return tenTruong.charAt(0).toUpperCase() + tenTruong.slice(1) +
        ' không được vượt quá ' + CAU_HINH.doDaiNoiDungToiDa + ' ký tự.';
    }
    return null;
  }

  function danhDauSua(db, n) {
    n.updatedate = homNay(db);
  }

  /* -------------------------------------------------------------------
   * 8. CAC HANH DONG (§2.4 T2..T14)
   *    Moi ham: (db, nv, userid, payload) -> {ok:true, nv} | {ok:false, loi}
   * ----------------------------------------------------------------- */

  /** T2 — Tiep nhan (§1.2 buoc 3, §5.4 D1). THIET KE MOI: he goc khong co buoc nay (§10.3). */
  function tiepNhan(db, nv, userid, payload) {
    var c = chuanBi(db, nv, userid, 'tiepNhan', 'tiếp nhận nhiệm vụ');
    if (c.loi) return c.loi;
    var n = c.n, p = payload || {};

    n.trangthai = 2;                     // (3, null) -> (2, null)
    n.ngaytiepnhan = homNay(db);
    danhDauSua(db, n);
    ghiXuLy(db, n, userid, 'TIEPNHAN', {
      noidung: chuoiSach(p.noidung) || 'Đã tiếp nhận nhiệm vụ.',
      trangthai: 2
    });
    return ok(n);
  }

  /** T3 — Tu choi nhiem vu (§1.2 buoc 3, §5.4 D2). Ly do BAT BUOC — §10.7 la yeu cau MOI. */
  function tuChoi(db, nv, userid, payload) {
    var c = chuanBi(db, nv, userid, 'tuChoi', 'từ chối nhiệm vụ');
    if (c.loi) return c.loi;
    var n = c.n, p = payload || {};

    // §10.7: he goc KHONG bat buoc ly do; day la rang buoc MOI cua app nho.
    var e = kiemNoiDung(p.lyDo, true, 'lý do từ chối');
    if (e) return loi(e);

    n.trangthai = 6;                     // (3|2, null) -> (6, 10)
    n.trangthaiDvXuly = 10;
    danhDauSua(db, n);
    ghiXuLy(db, n, userid, 'TUCHOI', {
      noidung: chuoiSach(p.lyDo),
      trangthai: 6,
      trangthaiXuly: 10,
      trangthaiDvXuly: 10
    });
    return ok(n);
  }

  /**
   * T4/T5 — Nguoi giao xu ly de nghi tu choi.
   * payload.ketQua: 'CHAP_NHAN' -> (97, null) thu hoi ; 'BAC_BO' -> (2, 12) lam lai.
   * §6.2 KHONG co dong rieng cho hanh dong nay (xem Flow.quyen.xuLyTuChoi).
   */
  function xuLyTuChoi(db, nv, userid, payload) {
    var c = chuanBi(db, nv, userid, 'xuLyTuChoi', 'xử lý đề nghị từ chối');
    if (c.loi) return c.loi;
    var n = c.n, p = payload || {};

    var kq = chuoiSach(p.ketQua).toUpperCase();
    if (kq !== 'CHAP_NHAN' && kq !== 'BAC_BO') {
      return loi('Kết quả xử lý từ chối phải là "CHAP_NHAN" hoặc "BAC_BO".');
    }
    var e = kiemNoiDung(p.phanHoi, false, 'ý kiến phản hồi');
    if (e) return loi(e);

    if (kq === 'CHAP_NHAN') {
      n.trangthai = 97;                  // T4: (6,10) -> (97, null) — DIEM CUOI §2.6
      n.trangthaiDvXuly = null;
    } else {
      n.trangthai = 2;                   // T5: (6,10) -> (2, 12) — nguoi thuc hien lam lai
      n.trangthaiDvXuly = 12;
    }
    n.phanhoi = chuoiSach(p.phanHoi);
    danhDauSua(db, n);
    ghiXuLy(db, n, userid, 'XL_TUCHOI', {
      noidung: chuoiSach(p.phanHoi) || (kq === 'CHAP_NHAN' ? 'Chấp nhận đề nghị từ chối.' : 'Bác bỏ đề nghị từ chối.'),
      trangthai: n.trangthai,
      trangthaiDvXuly: n.trangthaiDvXuly
    });
    return ok(n);
  }

  /** T6 — Cap nhat tien do (§1.2 buoc 4, §5.4 D3). KHONG doi trang thai. */
  function capNhatTienDo(db, nv, userid, payload) {
    var c = chuanBi(db, nv, userid, 'capNhatTienDo', 'cập nhật tiến độ');
    if (c.loi) return c.loi;
    var n = c.n, p = payload || {};

    // §10.2: he goc KHONG validate 0-100 (o input type="text"). Day la yeu cau MOI, BAT BUOC.
    if (p.mucdoht === null || p.mucdoht === undefined || p.mucdoht === '') {
      return loi('Vui lòng nhập mức độ hoàn thành (0 - 100).');
    }
    var md = Number(p.mucdoht);
    if (!isFinite(md) || Math.floor(md) !== md || md < 0 || md > 100) {
      return loi('Mức độ hoàn thành phải là số nguyên từ 0 đến 100.');
    }
    var e = kiemNoiDung(p.noidung, false, 'nội dung công việc đã làm');
    if (e) return loi(e);

    n.mucdoht = md;
    danhDauSua(db, n);                   // trangthai / trangthaiDvXuly GIU NGUYEN
    ghiXuLy(db, n, userid, 'TIENDO', {
      noidung: chuoiSach(p.noidung),
      mucdoht: md
    });
    return ok(n);
  }

  /** T7 — Gui bao cao ket qua (§1.2 buoc 5, §5.4 D4). */
  function guiBaoCao(db, nv, userid, payload) {
    var c = chuanBi(db, nv, userid, 'guiBaoCao', 'gửi báo cáo kết quả');
    if (c.loi) return c.loi;
    var n = c.n, p = payload || {};
    var ngay = homNay(db);

    // §5.4 D4: server VALIDATE LAI trang thai co nam trong danh sach da loc theo han khong.
    var tt = soHoacNull(p.trangthai);
    if (tt === null) return loi('Vui lòng chọn kết quả xử lý.');
    var hopLe = trangThaiHopLe(n, ngay);
    var coTrong = false;
    for (var i = 0; i < hopLe.length; i++) if (hopLe[i].ma === tt) coTrong = true;
    if (!coTrong) {
      var nhanDs = hopLe.map(function (x) { return x.nhan; }).join(', ');
      return loi('Kết quả xử lý không hợp lệ theo hạn của nhiệm vụ. Chỉ được chọn: ' + nhanDs + '.');
    }

    // §1.2 buoc 5 + §4.4: noi dung BAT BUOC khi trangthai ∈ {1,5}.
    var e = kiemNoiDung(p.noidung, trong([1, 5], tt), 'nội dung báo cáo');
    if (e) return loi(e);

    // §1.2 buoc 4 + §10.2: mucdoht la TUY CHON o buoc bao cao, nhung neu co gui len
    // thi phai la so nguyen 0-100. KHONG duoc nuot gia tri rac ('abc', NaN...) am tham.
    if (p.mucdoht !== null && p.mucdoht !== undefined && p.mucdoht !== '') {
      var md = Number(p.mucdoht);
      if (!isFinite(md) || Math.floor(md) !== md || md < 0 || md > 100) {
        return loi('Mức độ hoàn thành phải là số nguyên từ 0 đến 100.');
      }
      n.mucdoht = md;
    }

    n.trangthai = tt;                    // (2|3|7, null|12) -> (gia tri chon, 10)
    n.trangthaiDvXuly = 10;
    danhDauSua(db, n);
    ghiXuLy(db, n, userid, 'BAOCAO', {
      noidung: chuoiSach(p.noidung),
      mucdoht: soHoacNull(n.mucdoht),
      trangthai: tt,
      trangthaiXuly: 10,                 // §4.4: = 10 khi gui bao cao
      trangthaiDvXuly: 10
    });
    return ok(n);
  }

  /** T8 — Thu hoi bao cao (§1.2 buoc 5, §5.4 D6). */
  function thuHoiBaoCao(db, nv, userid, payload) {
    var c = chuanBi(db, nv, userid, 'thuHoiBaoCao', 'thu hồi báo cáo');
    if (c.loi) return c.loi;
    var n = c.n, p = payload || {};
    var ngay = homNay(db);

    var e = kiemNoiDung(p.lyDo, false, 'lý do thu hồi');
    if (e) return loi(e);

    // §2.5: con han (hoac khong co han) -> 2 ; qua han -> 7.
    n.trangthai = quaHan(n, ngay) ? 7 : 2;
    n.trangthaiDvXuly = null;
    danhDauSua(db, n);
    ghiXuLy(db, n, userid, 'THUHOI_BC', {
      noidung: chuoiSach(p.lyDo) || 'Thu hồi báo cáo để chỉnh sửa.',
      trangthai: n.trangthai,
      trangthaiDvXuly: null
    });
    return ok(n);
  }

  /** T9/T10 — Kiem tra ket qua / nghiem thu (§1.2 buoc 6, §5.5 E1). */
  function nghiemThu(db, nv, userid, payload) {
    var c = chuanBi(db, nv, userid, 'kiemTraKetQua', 'kiểm tra kết quả');
    if (c.loi) return c.loi;
    var n = c.n, p = payload || {};
    var ngay = homNay(db);

    var kq = chuoiSach(p.ketQua).toUpperCase();
    if (kq !== 'DAT' && kq !== 'CHUA_DAT') {
      return loi('Kết quả nghiệm thu phải là "DAT" hoặc "CHUA_DAT".');
    }
    // §1.2 buoc 6 + §10.7: noi dung phan hoi BAT BUOC (goc khong bat buoc — yeu cau MOI).
    var e = kiemNoiDung(p.phanHoi, true, 'nội dung phản hồi');
    if (e) return loi(e);

    if (kq === 'DAT') {
      // §2.4 T9 chi dinh nghia ĐẠT tu (1|5, 10). O (2|3|7, 10) nguoi thuc hien vua bao
      // cao mot trang thai CHUA hoan thanh => neu cho ĐẠT se sinh cap (2|3|7, 11):
      // khong phai diem cuoi §2.6 ma moi hanh dong tiep theo deu tat. Chi cho CHUA_DAT.
      if (!trong([1, 5], soHoacNull(n.trangthai))) {
        return loi('Chỉ nghiệm thu ĐẠT khi người thực hiện báo cáo Hoàn thành (1) hoặc ' +
          'Hoàn thành - Sau hạn (5). Hãy chọn "Chưa đạt" để yêu cầu bổ sung.');
      }
      // T9: (1|5, 10) -> (giu nguyen, 11) => DIEM CUOI §2.6
      n.trangthaiDvXuly = 11;
      n.ngayhoanthanhthucte = ngay;
      var hs = soHoacNull(p.hsChatluong);
      if (hs !== null) {
        if (hs < 1 || hs > 6) return loi('Hệ số chất lượng phải nằm trong khoảng 1 - 6.');
        n.hsChatluong = hs;              // §5.5 E1: chi ghi khi DAT
      }
    } else {
      // T10: (1|5, 10) -> (2 con han / 7 qua han, 12) => quay lai buoc 4
      n.trangthaiDvXuly = 12;
      if (trong([1, 5], soHoacNull(n.trangthai))) {
        n.trangthai = quaHan(n, ngay) ? 7 : 2;
      }
    }
    n.phanhoi = chuoiSach(p.phanHoi);
    danhDauSua(db, n);
    ghiXuLy(db, n, userid, 'NGHIEMTHU', {
      noidung: chuoiSach(p.phanHoi),
      trangthai: soHoacNull(n.trangthai),
      trangthaiDvXuly: soHoacNull(n.trangthaiDvXuly)
    });
    return ok(n);
  }

  /** T11 — Xin gia han (§1.3, §5.6 F1). */
  function xinGiaHan(db, nv, userid, payload) {
    var c = chuanBi(db, nv, userid, 'xinGiaHan', 'xin gia hạn');
    if (c.loi) return c.loi;
    var n = c.n, p = payload || {};

    var han = chuanHoaNgay(p.hanxulydexuat);
    if (!han) return loi('Vui lòng chọn thời gian đề xuất gia hạn.');
    // §3.3 M10: `min` = han hien tai. Dat ta yeu cau LON HON han hien tai.
    var hanCu = chuanHoaNgay(n.hanxulyth);
    if (hanCu && mocNgay(han) <= mocNgay(hanCu)) {
      return loi('Thời gian đề xuất gia hạn phải muộn hơn thời hạn hiện tại (' + dinhDang(hanCu) + ').');
    }
    var e = kiemNoiDung(p.noiDung !== undefined ? p.noiDung : p.lyDo, false, 'lý do gia hạn');
    if (e) return loi(e);

    var bg = {
      id: taoId('gh'),
      idCtnv: n.id,
      noiDung: chuoiSach(p.noiDung !== undefined ? p.noiDung : p.lyDo),
      hanxulydexuat: han,
      hanxulyth_cu: hanCu,
      // MO RONG ngoai §4.5: nho lai trang thai truoc khi chuyen 13 de khoi phuc
      // chinh xac o T12/T13 (dac biet khi truoc do la 3 — chua tiep nhan).
      trangthai_cu: soHoacNull(n.trangthai),
      trangThai: 10,
      phanhoi: null,
      useridDexuat: userid,
      useridDuyet: null,
      createDate: homNay(db),
      ngayduyet: null
    };
    mang(db, 'giahan').push(bg);

    n.trangthai = 13;                    // §2.4 T11
    n.trangthaixulygiahan = 10;
    danhDauSua(db, n);
    ghiXuLy(db, n, userid, 'GIAHAN', {
      noidung: bg.noiDung || ('Đề xuất gia hạn đến ' + dinhDang(han) + '.'),
      trangthai: 13
    });
    return ok(n, { giahan: bg });
  }

  /**
   * T12/T13 — Duyet / tu choi gia han (§1.3, §5.6 F2).
   * payload: { ketQua: 'DUYET' | 'TU_CHOI', phanHoi, idGiaHan? }
   *
   * §5.6 CANH BAO BAN GIAO: he goc FE KHONG co dong nao gan lai `hanxulyth`
   * sau khi duyet gia han (logic nam hoan toan o backend, khong kiem chung duoc)
   * => toan bo hanh vi duoi day la DAC TA MOI cua app nho.
   */
  function duyetGiaHan(db, nv, userid, payload) {
    var c = chuanBi(db, nv, userid, 'duyetGiaHan', 'duyệt gia hạn');
    if (c.loi) return c.loi;
    var n = c.n, p = payload || {};
    var ngay = homNay(db);

    var kq = chuoiSach(p.ketQua).toUpperCase();
    if (kq !== 'DUYET' && kq !== 'TU_CHOI') {
      return loi('Kết quả duyệt gia hạn phải là "DUYET" hoặc "TU_CHOI".');
    }
    var e = kiemNoiDung(p.phanHoi, false, 'ý kiến của người duyệt');
    if (e) return loi(e);

    // Tim yeu cau gia han dang treo (trangThai = 10) cua nhiem vu nay.
    var ds = mang(db, 'giahan');
    var bg = null;
    for (var i = ds.length - 1; i >= 0; i--) {
      if (ds[i].idCtnv !== n.id) continue;
      if (p.idGiaHan && ds[i].id !== p.idGiaHan) continue;
      if (Number(ds[i].trangThai) === 10) { bg = ds[i]; break; }
    }
    if (!bg) return loi('Không tìm thấy yêu cầu gia hạn đang chờ duyệt của nhiệm vụ này.');

    bg.phanhoi = chuoiSach(p.phanHoi);
    bg.useridDuyet = userid;
    bg.ngayduyet = ngay;

    if (kq === 'DUYET') {
      bg.trangThai = 11;
      n.trangthaixulygiahan = 11;
      n.solangiahan = (soHoacNull(n.solangiahan) || 0) + 1;   // §2.3: +1 khi duyet
      n.hanxulyth = bg.hanxulydexuat;                          // §5.6 F2 (dac ta MOI)
    } else {
      bg.trangThai = 12;
      n.trangthaixulygiahan = 12;
      // Han giu nguyen.
    }

    // Khoi phuc truc A: tu 13 tro ve gia tri truoc khi xin gia han, co ap
    // quy tac han cua §2.5 (7 -> 2 khi han moi con hieu luc, 2 -> 7 khi qua han).
    n.trangthai = trangThaiSauGiaHan(bg, n, ngay);
    danhDauSua(db, n);
    ghiXuLy(db, n, userid, 'DUYET_GIAHAN', {
      noidung: bg.phanhoi || (kq === 'DUYET'
        ? ('Đồng ý gia hạn đến ' + dinhDang(bg.hanxulydexuat) + '.')
        : 'Không đồng ý gia hạn.'),
      trangthai: n.trangthai
    });
    return ok(n, { giahan: bg });
  }

  /** §2.5 — tinh lai truc A sau khi ket thuc quy trinh gia han. */
  function trangThaiSauGiaHan(bg, n, ngay) {
    var cu = soHoacNull(bg && bg.trangthai_cu);
    if (cu === null || cu === 13) cu = 2;      // khong co thong tin -> mac dinh 2
    if (cu === 3) {
      // NGOAI LE CO Y (ghi ro trong tai lieu ban giao): §5.6 F2 viet "trangthai ve 2 neu
      // han moi con hieu luc", nhung neu ap cho ca truong hop truoc do la 3 thi nhiem vu
      // se nhay sang "Dang trien khai" MA KHONG qua buoc Tiep nhan (§1.2 buoc 3 / §2.4 T2)
      // va khong co `ngaytiepnhan`. Vi vay: chua tiep nhan thi giu 3 neu con han,
      // chuyen 7 neu da qua han (§2.5 quy tac 3 -> 7).
      return quaHan(n, ngay) ? 7 : 3;
    }
    // Con lai (2 hoac 7): 7 -> 2 khi han moi con hieu luc, 2 -> 7 khi qua han.
    return quaHan(n, ngay) ? 7 : 2;
  }

  /** T14 — Thu hoi nhiem vu (§1.3, §5.3 C6). -> (97, null), DIEM CUOI. */
  function thuHoiNhiemVu(db, nv, userid, payload) {
    var c = chuanBi(db, nv, userid, 'thuHoiNhiemVu', 'thu hồi nhiệm vụ');
    if (c.loi) return c.loi;
    var n = c.n, p = payload || {};

    var e = kiemNoiDung(p.lyDo, false, 'lý do thu hồi');
    if (e) return loi(e);

    n.trangthai = 97;
    n.trangthaiDvXuly = null;

    // §2.6: 97 la DIEM CUOI, khong co duong quay lai (§1.3). Neu con yeu cau gia han
